name: Build Octet for Windows

on:
  push:
    branches: [claude/gracious-faraday-oqgori]
    paths: ["octet/**", ".github/workflows/octet-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: octet

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Test
        working-directory: octet
        run: cargo test

      - name: Build the installers
        working-directory: octet/app/src-tauri
        run: tauri build

      - name: Keep the installers with this run
        uses: actions/upload-artifact@v4
        with:
          name: octet-windows
          path: |
            octet/target/release/bundle/nsis/*.exe
            octet/target/release/bundle/msi/*.msi

      - name: Read the version
        id: ver
        shell: bash
        run: |
          v=$(node -p "require('./octet/app/src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/octet-v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "octet-v$v is already published. Bump the version to publish a new download; this build is kept with the run."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the download
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: octet-v${{ steps.ver.outputs.version }}
          name: Octet ${{ steps.ver.outputs.version }} for Windows
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Octet, your offline CCNA library and lab.

            Download **Octet_${{ steps.ver.outputs.version }}_x64-setup.exe** and run it. Windows may say it protected your PC because the app isn't signed yet: click **More info**, then **Run anyway**.
          files: |
            octet/target/release/bundle/nsis/*.exe
            octet/target/release/bundle/msi/*.msi
