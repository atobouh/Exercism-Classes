<title>Octet Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Onest:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed workbench. The board is quiet at rest; the brief, the cable tray and the console float over it and only grow when used. */
:root {
  color-scheme: dark;
  --bench: oklch(17.5% 0.006 250); --bench-dot: oklch(27% 0.008 250);
  --glass: oklch(21% 0.007 250 / 0.92); --glass2: oklch(25% 0.008 250 / 0.96); --edge: oklch(34% 0.01 250);
  --ink: oklch(92% 0.006 250); --ink2: oklch(72% 0.01 250); --ink3: oklch(56% 0.01 250);
  --metal-hi: oklch(36% 0.008 255); --metal: oklch(29% 0.008 255); --metal-lo: oklch(23% 0.008 255); --recess: oklch(13% 0.004 255); --silk: oklch(76% 0.01 250);
  --led-off: oklch(26% 0.006 250); --led-green: oklch(80% 0.17 150); --led-amber: oklch(80% 0.15 70);
  --you: oklch(77% 0.1 165); --broken: oklch(70% 0.15 28);
  --c-straight: oklch(70% 0.1 245); --c-cross: oklch(78% 0.12 85); --c-console: oklch(84% 0.06 215); --c-fiber: oklch(74% 0.14 50); --c-serial: oklch(48% 0.02 260);
  --f-book: "Newsreader", Georgia, serif; --f-ui: "Onest", system-ui, sans-serif; --f-mono: "Spline Sans Mono", ui-monospace, Consolas, monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bench); color: var(--ink); font: 400 14px/1.5 var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
#stage { position: fixed; inset: 0; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
#board.panning { cursor: grabbing; }
#wires { position: absolute; inset: 0; pointer-events: none; }
.hand #board { cursor: crosshair; }

/* faceplates */
.dev .body { cursor: grab; }
.dev.dragging .body { cursor: grabbing; }
.silk { font: 500 7.2px var(--f-ui); fill: var(--silk); letter-spacing: .04em; }
.silk.big { font: 600 9px var(--f-ui); letter-spacing: .06em; }
.silk.name { font: 600 11px var(--f-ui); fill: var(--ink); letter-spacing: .01em; }
.tagname { font: 600 12.5px var(--f-ui) !important; fill: var(--ink2) !important; }
.plab { font: 500 6.4px var(--f-mono); fill: var(--ink3); opacity: 0; transition: opacity 160ms ease; }
.labels .plab, .near .plab { opacity: 1; }
.port { cursor: pointer; }
.port .hl { fill: none; stroke: var(--you); stroke-width: 1.4; opacity: 0; transition: opacity 120ms ease; }
.port:hover .hl { opacity: .9; }
.port.fits .hl { opacity: .75; stroke-dasharray: 2 2; }
.port.fits.hot .hl { opacity: 1; stroke-dasharray: none; stroke-width: 2; }
.dim-other .port:not(.fits) { opacity: .35; }
.led { transition: fill 120ms ease; }
.led.green { fill: var(--led-green); filter: drop-shadow(0 0 2.5px oklch(80% 0.17 150 / .8)); }
.led.amber { fill: var(--led-amber); filter: drop-shadow(0 0 2.5px oklch(80% 0.15 70 / .8)); }
.led.blink { animation: blink 1s steps(2, jump-none) infinite; }
.led.act { animation: act 90ms steps(2, jump-none) 6; }
@keyframes blink { 50% { opacity: .25; } }
@keyframes act { 50% { opacity: .2; } }
.token { opacity: 0; pointer-events: none; transition: opacity 180ms ease; }
.face { transition: opacity 180ms ease; }
.far .token { opacity: 1; pointer-events: auto; }
.far .face { opacity: 0; pointer-events: none; }
.token .tk-bg { fill: var(--glass2); stroke: var(--edge); }
.token .g * { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.token .g circle { fill: var(--ink); stroke: none; }
.token text { font: 600 12px var(--f-ui); fill: var(--ink); }

/* floating chrome */
.panel { position: fixed; background: var(--glass); border: 1px solid var(--edge); border-radius: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 18px 40px -20px oklch(5% 0 0 / .8); }
#brief { left: 16px; top: 16px; width: 330px; max-width: calc(100vw - 32px); padding: 14px 16px 12px; display: grid; gap: 10px; }
#brief header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
#brief h1 { margin: 0; font: 450 21px/1.15 var(--f-book); letter-spacing: -0.01em; }
#brief .count { font-size: 12px; color: var(--ink3); white-space: nowrap; font-variant-numeric: tabular-nums; }
#brief ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; counter-reset: t; }
#brief li { counter-increment: t; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; font-size: 13px; color: var(--ink2); line-height: 1.45; }
#brief li::before { content: counter(t); width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font: 600 10.5px var(--f-ui); box-shadow: inset 0 0 0 1px var(--edge); color: var(--ink3); margin-top: 1px; }
#brief li.done { color: var(--ink3); }
#brief li.done::before { content: "✓"; background: var(--you); color: var(--bench); box-shadow: none; }
#brief li.next { color: var(--ink); }
#brief code { font: 400 12px var(--f-mono); color: var(--ink); }
#brief .more { border: 0; background: none; color: var(--ink3); font: inherit; font-size: 12.5px; padding: 0; text-align: left; cursor: pointer; }
#brief .more:hover { color: var(--ink); }
#brief.min ol, #brief.min .more { display: none; }

#tools { right: 16px; top: 16px; display: flex; gap: 2px; padding: 4px; }
.tb { border: 0; background: transparent; color: var(--ink2); font: 500 12.5px var(--f-ui); height: 30px; min-width: 30px; padding: 0 10px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tb:hover { background: oklch(100% 0 0 / .06); color: var(--ink); }
.tb[aria-pressed="true"] { background: oklch(100% 0 0 / .1); color: var(--ink); }
.tb .k { font: 500 10.5px var(--f-ui); color: var(--ink3); }
.tb.zoom { font-variant-numeric: tabular-nums; min-width: 54px; justify-content: center; }
.sep { width: 1px; background: var(--edge); margin: 5px 3px; }

#tray { left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; max-width: calc(100vw - 32px); overflow-x: auto; }
.cable { border: 0; background: transparent; color: var(--ink2); border-radius: 10px; padding: 6px 12px 7px 8px; display: grid; grid-template-columns: 34px auto; gap: 2px 8px; align-items: center; cursor: pointer; text-align: left; transition: background-color 120ms ease, transform 160ms var(--ease); }
.cable:hover { background: oklch(100% 0 0 / .05); color: var(--ink); }
.cable:active { transform: scale(0.97); }
.cable[aria-pressed="true"] { background: oklch(100% 0 0 / .1); color: var(--ink); }
.cable svg { grid-row: span 2; width: 34px; height: 28px; }
.cable b { font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.cable span { font-size: 11px; color: var(--ink3); white-space: nowrap; }

#card { position: fixed; z-index: 30; pointer-events: none; min-width: 210px; max-width: 290px; padding: 11px 13px; opacity: 0; transform: translateY(4px); transition: opacity 120ms ease, transform 160ms var(--ease); }
#card.on { opacity: 1; transform: none; }
#card h3 { margin: 0 0 6px; font: 600 13px var(--f-ui); display: flex; justify-content: space-between; gap: 10px; }
#card h3 i { font: 400 11.5px var(--f-mono); color: var(--ink3); font-style: normal; }
#card dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 12.5px; }
#card dt { color: var(--ink3); }
#card dd { margin: 0; color: var(--ink); }
#card dd.mono { font: 400 11.5px/1.6 var(--f-mono); }
#card p { margin: 8px 0 0; font-size: 12px; color: var(--ink2); line-height: 1.45; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--led-off); }
.dot.green { background: var(--led-green); } .dot.amber { background: var(--led-amber); }

#menu { position: fixed; z-index: 40; min-width: 200px; padding: 5px; display: grid; }
#menu[hidden] { display: none; }
#menu button { border: 0; background: transparent; color: var(--ink); font: 450 13px var(--f-ui); text-align: left; padding: 7px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 18px; }
#menu button:hover { background: oklch(100% 0 0 / .07); }
#menu button[disabled] { color: var(--ink3); cursor: default; background: none; }
#menu button span { color: var(--ink3); font-size: 11.5px; }
#menu hr { border: 0; border-top: 1px solid var(--edge); margin: 4px 6px; }
#menu .h { font: 500 11px var(--f-ui); color: var(--ink3); padding: 6px 10px 2px; }

#toast { left: 50%; bottom: 92px; transform: translate(-50%, 8px); padding: 10px 14px; max-width: min(520px, calc(100vw - 32px)); font-size: 13px; color: var(--ink); opacity: 0; pointer-events: none; transition: opacity 160ms ease, transform 200ms var(--ease); z-index: 35; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

#con { right: 16px; top: 62px; bottom: 16px; width: 470px; max-width: calc(100vw - 32px); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; overflow: hidden; transform: translateX(calc(100% + 24px)); transition: transform 260ms var(--ease); z-index: 20; }
#con.on { transform: none; }
#con .tabs { display: flex; gap: 2px; padding: 6px 6px 0; overflow-x: auto; }
#con .tab { border: 0; background: transparent; color: var(--ink3); font: 500 12.5px var(--f-ui); padding: 7px 10px; border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
#con .tab[aria-selected="true"] { background: var(--recess); color: var(--ink); }
#con .tab .x { opacity: .5; font-size: 14px; line-height: 1; }
#con .tab .x:hover { opacity: 1; }
#con .via { padding: 7px 14px; font-size: 11.5px; color: var(--ink3); background: var(--recess); display: flex; justify-content: space-between; gap: 10px; }
#con .via button { border: 0; background: none; color: var(--ink3); font: inherit; cursor: pointer; padding: 0; }
#con .via button:hover { color: var(--ink); }
#out { margin: 0; padding: 8px 14px 4px; overflow: auto; background: var(--recess); font: 400 12.5px/1.6 var(--f-mono); color: var(--ink2); white-space: pre; user-select: text; -webkit-user-select: text; }
#out .cmd { color: var(--ink); }
#out .log { color: oklch(75% 0.07 70); }
#out .err { color: var(--broken); }
#out .ok { color: var(--led-green); }
#line { display: flex; gap: 0; padding: 4px 14px 12px; background: var(--recess); font: 400 12.5px/1.6 var(--f-mono); align-items: baseline; }
#prompt { color: var(--ink); white-space: pre; }
#in { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--ink); font: inherit; caret-color: var(--you); padding: 0; }
#pcset { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 8px; padding: 10px 14px; background: var(--recess); border-bottom: 1px solid var(--edge); align-items: end; }
#pcset[hidden] { display: none; }
#pcset label { display: grid; gap: 3px; font-size: 11px; color: var(--ink3); min-width: 0; }
#pcset input { width: 100%; min-width: 0; border: 0; border-radius: 7px; background: oklch(100% 0 0 / .06); color: var(--ink); font: 400 12.5px var(--f-mono); padding: 6px 8px; outline: none; box-shadow: inset 0 0 0 1px var(--edge); }
#pcset input:focus { box-shadow: inset 0 0 0 1.5px var(--you); }
#pcset button { border: 0; border-radius: 7px; background: var(--ink); color: var(--bench); font: 600 12px var(--f-ui); padding: 7px 11px; cursor: pointer; }
:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
@media (max-width: 700px) { #brief { width: auto; right: 16px; } #brief.min { right: auto; } #tools { top: auto; bottom: 86px; } .cable span { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; animation-duration: 1ms !important; } }
</style>

<div id="stage">
  <svg id="board" aria-label="Lab bench">
    <defs>
      <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--bench-dot)"/></pattern>
      <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--metal-hi)"/><stop offset=".12" stop-color="var(--metal)"/><stop offset="1" stop-color="var(--metal-lo)"/></linearGradient>
      <linearGradient id="ear" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--metal-lo)"/><stop offset="1" stop-color="var(--metal)"/></linearGradient>
      <linearGradient id="sfp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(55% 0.01 250)"/><stop offset="1" stop-color="oklch(38% 0.01 250)"/></linearGradient>
      <filter id="shadow" x="-10%" y="-30%" width="120%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="black" flood-opacity=".45"/></filter>
    </defs>
    <rect id="grid" x="-5000" y="-5000" width="10000" height="10000" fill="url(#dots)"/>
    <g id="cam"><rect x="-5000" y="-5000" width="10000" height="10000" fill="url(#dots)" opacity="0"/><g id="devs"></g></g>
  </svg>
  <canvas id="wires"></canvas>
</div>

<section id="brief" class="panel" aria-label="The brief">
  <header><h1>Bring the office online</h1><span class="count" id="count">0 of 5</span></header>
  <ol id="tasks"></ol>
  <button class="more" type="button" id="hideBrief">Hide the brief</button>
</section>

<div id="tools" class="panel" role="toolbar" aria-label="Bench tools">
  <button class="tb" type="button" id="zout" aria-label="Zoom out">−</button>
  <button class="tb zoom" type="button" id="zfit" title="Fit everything">100%</button>
  <button class="tb" type="button" id="zin" aria-label="Zoom in">+</button>
  <span class="sep"></span>
  <button class="tb" type="button" id="labels" aria-pressed="false" title="Show every port name">Labels <span class="k">Alt</span></button>
  <button class="tb" type="button" id="fast" aria-pressed="false" title="Run the clock ten times faster, so spanning tree finishes in 3 seconds">Time ×10</button>
  <button class="tb" type="button" id="sound" aria-pressed="true">Sound</button>
</div>

<div id="tray" class="panel" role="toolbar" aria-label="Cables"></div>

<aside id="con" class="panel" aria-label="Console">
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="via"><span id="via"></span><button type="button" id="conClose">Close</button></div>
  <div style="display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0">
    <form id="pcset" hidden>
      <label>IPv4 address<input id="pcIp" spellcheck="false" autocomplete="off"></label>
      <label>Subnet mask<input id="pcMask" spellcheck="false" autocomplete="off"></label>
      <label>Default gateway<input id="pcGw" spellcheck="false" autocomplete="off"></label>
      <button type="submit">Apply</button>
    </form>
    <pre id="out" aria-live="polite"></pre>
  </div>
  <label id="line"><span id="prompt"></span><input id="in" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Command"></label>
</aside>

<div id="card" class="panel" role="status"></div>
<div id="menu" class="panel" role="menu" hidden></div>
<div id="toast" class="panel" role="status"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const board = $('#board'), cam = $('#cam'), devsG = $('#devs'), wires = $('#wires'), ctx = wires.getContext('2d');
let speed = 1, simT = 0, lastReal = performance.now();
const now = () => simT;

/* ================= devices ================= */
const CABLES = {
  straight: { name: 'Straight-through', hint: 'copper, most links', color: '--c-straight', w: 4.2, fits: ['eth'] },
  cross: { name: 'Crossover', hint: 'like to like', color: '--c-cross', w: 4.2, fits: ['eth'] },
  console: { name: 'Console', hint: 'rollover, PC to CONSOLE', color: '--c-console', w: 3.4, fits: ['con', 'com'] },
  fiber: { name: 'Fiber LC', hint: 'SFP to SFP', color: '--c-fiber', w: 3, fits: ['sfp'] },
  serial: { name: 'Serial DCE/DTE', hint: 'router to router WAN', color: '--c-serial', w: 5.6, fits: ['serial'] },
};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

let macN = 0x10;
const mac = (oui) => { macN++; const h = (oui + macN.toString(16).padStart(6, '0')); return `${h.slice(0, 4)}.${h.slice(4, 8)}.${h.slice(8, 12)}`; };

function iface(over) { return Object.assign({ shutdown: false, ip: '', mask: '', mode: 'access', vlan: 1, portfast: false, clock: 0, desc: '', phys: false, proto: false, upSince: 0, medium: '', act: 0 }, over); }

function makeRouter(id, x, y) {
  const d = { id, name: id, kind: 'router', model: 'ISR4321/K9', x, y, w: 560, h: 66, ports: [], ifs: {}, routes: [], arp: {}, hostname: id, secret: '', boot: 0 };
  const P = (o) => d.ports.push(o);
  // NIM slot 1 with a NIM-2T serial card
  P({ key: 'S0/1/0', iface: 'Serial0/1/0', type: 'serial', x: 46, y: 26, w: 26, h: 13, label: '0' });
  P({ key: 'S0/1/1', iface: 'Serial0/1/1', type: 'serial', x: 108, y: 26, w: 26, h: 13, label: '1' });
  P({ key: 'G0/0/0', iface: 'GigabitEthernet0/0/0', type: 'eth', x: 232, y: 24, w: 22, h: 17, label: 'GE 0/0/0', led: true });
  P({ key: 'G0/0/1', iface: 'GigabitEthernet0/0/1', type: 'eth', x: 286, y: 24, w: 22, h: 17, label: 'GE 0/0/1', led: true });
  P({ key: 'G0/0/1s', iface: 'GigabitEthernet0/0/1', type: 'sfp', x: 316, y: 26, w: 24, h: 13, label: 'SFP', led: true });
  P({ key: 'CON', iface: 'console', type: 'con', x: 378, y: 24, w: 22, h: 17, label: 'CON' });
  P({ key: 'AUX', iface: 'aux', type: 'decor', x: 410, y: 24, w: 22, h: 17, label: 'AUX' });
  for (const n of ['GigabitEthernet0/0/0', 'GigabitEthernet0/0/1', 'Serial0/1/0', 'Serial0/1/1']) d.ifs[n] = iface({ shutdown: true, mac: mac('00d097') });
  return d;
}
function makeSwitch(id, x, y) {
  const d = { id, name: id, kind: 'switch', model: 'WS-C2960+24TC-L', x, y, w: 720, h: 66, ports: [], ifs: {}, vlans: { 1: 'default' }, macs: {}, arp: {}, hostname: id, gw: '', boot: 0 };
  const x0 = 172;
  for (let n = 1; n <= 24; n++) {
    const c = Math.floor((n - 1) / 2), top = n % 2 === 1;
    const x = x0 + c * 24 + Math.floor(c / 4) * 10;
    d.ports.push({ key: 'F0/' + n, iface: 'FastEthernet0/' + n, type: 'eth', x, y: top ? 13 : 36, w: 20, h: 15, row: top ? 0 : 1, label: String(n), led: true });
    d.ifs['FastEthernet0/' + n] = iface({ mac: mac('0019e8') });
  }
  for (const n of [1, 2]) {
    const y = n === 1 ? 13 : 36;
    d.ports.push({ key: 'G0/' + n, iface: 'GigabitEthernet0/' + n, type: 'eth', x: 500, y, w: 20, h: 15, row: n - 1, label: 'G' + n, led: true });
    d.ports.push({ key: 'G0/' + n + 's', iface: 'GigabitEthernet0/' + n, type: 'sfp', x: 528, y: y + 1, w: 24, h: 13, row: n - 1, label: 'SFP', led: false });
    d.ifs['GigabitEthernet0/' + n] = iface({ mac: mac('0019e8') });
  }
  d.ports.push({ key: 'CON', iface: 'console', type: 'con', x: 640, y: 24, w: 22, h: 17, label: 'CONSOLE' });
  d.ifs.Vlan1 = iface({ shutdown: true, mac: mac('0019e8'), svi: true });
  return d;
}
function makePC(id, x, y, ip = '', mask = '', gw = '') {
  const d = { id, name: id, kind: 'pc', model: 'Desktop PC', x, y, w: 228, h: 84, ports: [], ifs: {}, arp: {}, hostname: id, ip, mask, gw, buf: [] };
  d.ports.push({ key: 'COM1', iface: 'com', type: 'com', x: 30, y: 50, w: 30, h: 14, label: 'COM1' });
  d.ports.push({ key: 'NIC', iface: 'FastEthernet0', type: 'eth', x: 168, y: 46, w: 22, h: 17, label: 'LAN', led: true });
  d.ifs.FastEthernet0 = iface({ mac: mac('005079') });
  return d;
}

const devs = [
  makeRouter('R1', -280, -250),
  makeRouter('ISP', -280, -470),
  makeSwitch('S1', -360, -40),
  makePC('PC-A', -330, 180, '192.168.10.10', '255.255.255.0', '192.168.10.1'),
  makePC('PC-B', 140, 180),
];
devs.find(d => d.id === 'ISP').ifs['Serial0/1/0'] = iface({ shutdown: false, ip: '10.0.0.2', mask: '255.255.255.252', mac: 'n/a' });
devs.find(d => d.id === 'ISP').preset = true;
const D = id => devs.find(d => d.id === id);

/* ================= faceplate drawing ================= */
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
function rj45(g, p, flip) {
  // a recessed jack with its latch notch and eight gold contacts

board.addEventListener('pointerdown', e => {

/* hover: one calm card, only for what's under the pointer */
const card = $('#card');
function hoverInfo(e) {

let tT;

let lastEval = 0;
