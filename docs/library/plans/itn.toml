]

[[chapter.page]]
name = "03-arp-across-a-router"
title = "ARP across a router"
summary = "A host never ARPs for a remote host. It ARPs for its gateway, and each router ARPs on the next link."
teaches = [
  "PC1 to a remote server: PC1 ARPs for its default gateway's IP, not the server's",
  "The router receives the frame, looks up the route, and ARPs on the outgoing link for the next hop or the final host",
  "A `table` of MACs and IPs on each link: IPs constant, MACs change",
  "Misconception: a router does not forward the ARP broadcast to other networks; broadcasts stop at the router",
  "What happens on the very first ping: the first echo can time out while ARP completes (seen as `.!!!!` on IOS)",
  "`question` blocks naming the source and destination MAC on each link",
