# ---------------------------------------------------------------------------
# Chapter 12: IPv6 addressing (ITN module 12)
# ---------------------------------------------------------------------------
[[chapter]]
number = 12
title = "IPv6 addressing"

[[chapter.page]]
name = "01-why-ipv6"
title = "Why IPv6"
summary = "IPv4 ran out of addresses. IPv6 has enough for everything, and the two run side by side for now."
teaches = [
  "IPv4 has about 4.3 billion addresses; IANA's free pool ran out in 2011 and the RIRs followed",
  "NAT stretched IPv4 but broke end-to-end connectivity and added complexity",
  "IPv6 has 2^128 addresses and was designed with autoconfiguration and a simpler header",
  "Coexistence methods: dual stack (both protocols on every device), tunneling (IPv6 inside IPv4), translation (NAT64)",
  "Dual stack is the recommended approach where possible",
  "`question` matching a coexistence method to a description",
]

[[chapter.page]]
name = "02-writing-ipv6-addresses"
title = "Writing IPv6 addresses"
summary = "An IPv6 address is eight groups of four hex digits, and two rules make it shorter."
teaches = [
  "128 bits written as eight *hextets* of 16 bits (four hex digits) separated by colons; the preferred (full) format 2001:0db8:0000:0000:00a0:0000:0000:0001",
  "Rule 1: omit leading zeros in any hextet (00a0 becomes a0, 0000 becomes 0); never trailing zeros",
  "Rule 2: a double colon (::) replaces one run of consecutive all-zero hextets, once per address",
  "When there are two equal runs, compress the longest, or the first if equal (RFC 5952 recommendation)",
  "Worked examples compressing and expanding addresses",
  "Misconceptions: using :: twice makes the address ambiguous; removing trailing zeros changes the address",
  "`question` blocks choosing the valid compressed form",
  "A `drill` of kind ipv6",
]

[[chapter.page]]
name = "03-prefix-and-interface-id"
title = "Prefix length and interface ID"
summary = "IPv6 has no dotted mask. A prefix length marks the network part, and /64 is the norm for a LAN."
teaches = [
  "Prefix length notation from /0 to /128, e.g. 2001:db8:acad:1::10/64",
  "The prefix identifies the network; the *interface ID* identifies the host",
  "A /64 gives a 64-bit prefix and 64-bit interface ID; SLAAC and EUI-64 need /64",
  "Prefix boundaries on hex-digit edges (multiples of 4 bits) are easiest to read",
  "Extracting the prefix of an address for /64 and /48",
  "IPv6 has no broadcast and no reserved host addresses at the ends of the range in the IPv4 sense",
  "`question` blocks finding the prefix",
  "A `drill` of kind ipv6",
]

[[chapter.page]]
name = "04-ipv6-address-types"
title = "IPv6 address types"
summary = "IPv6 has unicast, multicast and anycast addresses, and several kinds of unicast."
teaches = [
  "Three types: unicast (one interface), multicast (a group), anycast (the nearest of several interfaces with the same address); no broadcast",
  "Anycast: the same unicast address on several devices, and routing delivers to the closest; used for services such as DNS",
  "Unicast kinds in a `table` with prefix: global unicast (GUA, currently 2000::/3), link-local (LLA, fe80::/10), loopback (::1/128), unspecified (::/128), unique local (ULA, fc00::/7, in practice fd00::/8), embedded IPv4",
  "ULAs are like private IPv4 addresses: routable inside an organization, not on the internet",
  "An interface usually has several IPv6 addresses at once: an LLA always, plus GUAs",
  "`question` blocks identifying the type from a given address",
  "`recall` cards for fe80::/10, 2000::/3, fc00::/7",
]

[[chapter.page]]
name = "05-global-unicast-addresses"
title = "Global unicast addresses"
summary = "A GUA has a global routing prefix from the provider, a subnet ID you choose and an interface ID."
teaches = [
  "Structure: global routing prefix (often /48 from the provider), subnet ID (16 bits for a /48 to /64), interface ID (64 bits)",
  "A `fields` block of a GUA with 48, 16 and 64 bit spans",
  "Worked example: 2001:db8:acad::/48 gives subnets 2001:db8:acad:1::/64, 2001:db8:acad:2::/64",
  "A /48 provides 65,536 /64 subnets",
  "Reading an address: which part the provider gave, which part the network team assigned",
  "`question`: identify the subnet ID in an address",
]

[[chapter.page]]
name = "06-link-local-addresses"
title = "Link-local addresses"
summary = "Every IPv6 interface has a link-local address. It never leaves the link, and routers use it constantly."
teaches = [
  "Link-local addresses fe80::/10 are confined to one link and are never routed",
  "Every IPv6-enabled interface creates one automatically, even without a GUA",
  "Uses: Neighbor Discovery, router advertisements, routing protocol neighbors and next hops, and the host's default gateway (the router's LLA)",
  "The same LLA can exist on different links, so routers can use fe80::1 on every interface to make it easy to recognize",
  "Windows shows link-local addresses with a zone index such as %11 to say which interface",
  "`question`: why a packet to an LLA is not forwarded by a router",
]

[[chapter.page]]
name = "07-static-ipv6-configuration"
title = "Static IPv6 on routers and hosts"
summary = "Type in a GUA and a memorable link-local address on each router interface."
teaches = [
  "`ipv6 unicast-routing` in global config: required for forwarding IPv6 and sending RAs",
  "`ipv6 address 2001:db8:acad:1::1/64` and `ipv6 address fe80::1 link-local` in interface config",
