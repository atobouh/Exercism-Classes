[[chapter.page]]
name = "07-troubleshooting-methodology"
title = "A troubleshooting method"
summary = "Follow a fixed method, change one thing at a time, and write down what you did."
teaches = [
  "The six steps: identify the problem, establish a theory of probable causes, test the theory, establish a plan and implement it, verify the solution, document findings and actions",
  "Gathering information by asking users good questions (what changed, when, who is affected)",
  "When to escalate to a senior technician or vendor support, according to company policy",
  "`debug` commands show events in real time (for example `debug ip icmp`); they use CPU, so use them carefully and stop them with `undebug all`",
  "`terminal monitor` to see log and debug output in an SSH or Telnet session; `terminal no monitor` to stop",
