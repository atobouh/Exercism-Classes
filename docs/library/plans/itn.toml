]

# ---------------------------------------------------------------------------
# Chapter 5: Number systems (ITN module 5)
# ---------------------------------------------------------------------------
[[chapter]]
number = 5
title = "Number systems"

[[chapter.page]]
name = "01-why-numbers-matter"
title = "Why networkers count in binary"
summary = "Devices see addresses as bits. To subnet and troubleshoot, you need to see them the same way."
teaches = [
  "Scene: the address 192.168.10.77 and the mask 255.255.255.224 look unrelated in decimal, but in binary the mask's edge and the host part are obvious",
  "Computers store everything as bits (0 and 1); a byte or *octet* is 8 bits",
  "Where each system appears: IPv4 addresses and masks in dotted decimal (binary underneath), MAC addresses and IPv6 addresses in hexadecimal",
  "What this chapter builds: fast binary and decimal conversion for octets, hexadecimal for MAC and IPv6",
  "Reassurance and method: only eight place values matter for IPv4 octets",
]

[[chapter.page]]
name = "02-positional-notation"
title = "Positional notation"
summary = "A digit's value depends on its position. In binary, each position is a power of 2."
teaches = [
  "Decimal positional notation: 1,947 as 1x1000 + 9x100 + 4x10 + 7x1, positions are powers of 10",
  "Binary positional notation: positions are powers of 2; the eight octet place values 128, 64, 32, 16, 8, 4, 2, 1",
  "A `table` of the eight positions with 2^7 down to 2^0 and their values",
  "Why an octet ranges from 0 (00000000) to 255 (11111111), and why 255 = 256 - 1",
  "The high-order bit (leftmost, 128) and low-order bit (rightmost, 1)",
  "`recall` card for the eight place values",
]

[[chapter.page]]
name = "03-binary-to-decimal"
title = "Binary to decimal"
summary = "Add up the place values where the bit is 1."
teaches = [
  "Method: write the place values over the bits, add the values under each 1",
  "Worked examples: 11000000 = 192, 10101000 = 168, 00001010 = 10, 11111110 = 254",
  "Converting a whole 32-bit address octet by octet into dotted decimal",
  "Shortcut: 11110000 = 255 - 15 = 240 (all ones minus the trailing ones you removed)",
  "Common octet values worth recognizing: 128, 192, 224, 240, 248, 252, 254, 255",
  "`question` blocks converting octets",
  "A `drill` of kind binary",
]

[[chapter.page]]
name = "04-decimal-to-binary"
title = "Decimal to binary"
summary = "Walk the place values from 128 down, subtracting each one that fits."
teaches = [
  "Subtraction method: start at 128; if the number is at least the place value, write 1 and subtract, else write 0; continue to 1",
  "Worked examples: 172 = 10101100, 77 = 01001101, 31 = 00011111, 200 = 11001000",
  "Always write all eight bits, including leading zeros, so octets line up",
  "Checking your answer by converting back",
  "Converting a full address such as 10.1.16.254 into 32 bits",
  "Misconception: 256 does not fit in an octet; the largest octet is 255",
  "A `drill` of kind binary",
]

[[chapter.page]]
name = "05-masks-in-binary"
title = "Addresses and masks in binary"
summary = "A subnet mask is a run of 1s followed by 0s. Its decimal octets come from a short list."
teaches = [
  "An IPv4 subnet mask is 32 bits: contiguous 1s for the network part, then 0s for the host part",
  "The only valid mask octet values: 0, 128, 192, 224, 240, 248, 252, 254, 255, with the bit count for each in a `table`",
  "Prefix length counts the 1 bits: 255.255.255.0 is /24, 255.255.255.192 is /26, 255.255.240.0 is /20",
  "Converting mask to prefix and prefix to mask, octet by octet",
  "Why 255.255.0.255 or 255.255.255.100 are not valid masks",
  "Preview of the AND operation that chapter 11 uses to find the network address",
  "A `drill` of kind mask",
]

[[chapter.page]]
name = "06-hexadecimal"
title = "Hexadecimal"
summary = "Hexadecimal packs four bits into one character, using 0 to 9 and A to F."
teaches = [
  "Base 16: digits 0 to 9 and A (10) to F (15); positions are powers of 16",
  "One hex digit is exactly four bits (a *nibble*); two hex digits are one byte",
  "A `table` of 0 to F with decimal and 4-bit binary values",
  "Why hex is used: MAC addresses (48 bits = 12 hex digits) and IPv6 addresses (128 bits = 32 hex digits) are much shorter than binary",
  "Notation: hex may be written with 0x (0x0800) or a trailing h; case does not matter",
  "`recall` cards for A, C and F values",
]

[[chapter.page]]
name = "07-converting-hex"
title = "Converting hexadecimal"
summary = "Convert through binary, one nibble at a time, and decimal becomes routine."
teaches = [
  "Hex to binary: replace each hex digit with its 4 bits (A8 = 1010 1000)",
  "Binary to hex: group bits into fours from the right and replace each group (11000000 = C0)",
  "Hex to decimal for a byte: first digit x 16 + second digit (A8 = 10x16 + 8 = 168)",
  "Decimal to hex for a byte: divide by 16 for the first digit, remainder is the second (192 = C0, 255 = FF)",
  "Worked examples with values that appear in networking: 0x0800 (IPv4 EtherType), FF (all ones), FE80 (start of IPv6 link-local)",
  "`question` blocks converting between all three systems",
  "A `drill` of kind hex",
]

[[chapter.page]]
name = "08-hex-in-macs-and-ipv6"
title = "Hex in MAC and IPv6 addresses"
summary = "Read a MAC address and an IPv6 address as the bits they really are."
teaches = [
  "MAC address formats for the same 48 bits: 00-50-79-66-68-00 (Windows), 00:50:79:66:68:00 (Linux, macOS), 0050.7966.6800 (Cisco IOS)",
  "Splitting a MAC into the OUI (first 24 bits) and the vendor-assigned part",
  "An IPv6 address as eight hextets of 16 bits each: 2001:0db8:acad:0001:0000:0000:0000:0010",
  "Converting one hextet to binary (ACAD = 1010 1100 1010 1101)",
  "Why IPv6 prefix boundaries fall cleanly on hex digits when they are multiples of 4 bits (/48, /56, /64)",
  "`question`: how many bits a given number of hex digits represents",
]

[[chapter.page]]
name = "09-check-yourself"
title = "Check yourself: number systems"
summary = "Mixed conversions and drills across binary, decimal and hexadecimal."
teaches = [
  "`question` blocks: binary to decimal, decimal to binary, decimal to hex, hex to binary",
  "Mask to prefix and prefix to mask conversions",
  "Spot the invalid mask",
  "Count bits in MAC and IPv6 addresses",
  "Drills of kinds binary, hex and mask in sequence",
  "Four to six `recall` cards (place values, valid mask octets, bits per hex digit)",
]

# ---------------------------------------------------------------------------
# Chapter 6: Data link layer (ITN module 6)
# ---------------------------------------------------------------------------
[[chapter]]
number = 6
title = "Data link layer"

[[chapter.page]]
name = "01-one-link-at-a-time"
title = "One link at a time"
summary = "The data link layer moves a frame across one link. At every router the packet gets a new frame."
teaches = [
  "Scene: a packet crossing an Ethernet LAN, a serial WAN link and a wireless LAN keeps its IP header but rides in a different frame on each",
  "Jobs of the data link layer: lets upper layers use the media, encapsulates packets into frames, controls access to the media, detects errors",
  "Routers de-encapsulate the frame, forward the packet, and re-encapsulate it in a new frame for the next link",
  "Layer 2 addresses (MAC addresses on Ethernet) are local to one link",
  "A `diagram` of a path that crosses three link types",
]

[[chapter.page]]
name = "02-llc-and-mac-sublayers"
title = "The LLC and MAC sublayers"
summary = "IEEE splits the data link layer into a top half that talks to software and a bottom half that talks to hardware."
teaches = [
  "Logical Link Control (LLC, IEEE 802.2): identifies the network layer protocol in the frame, implemented in software, independent of media",
  "Media Access Control (MAC): data encapsulation, addressing, frame delimiting, error detection, and media access; implemented in the NIC hardware",
  "IEEE 802 standards per technology: 802.3 Ethernet, 802.11 wireless LAN, 802.15 personal area networks",
  "Other data link standards bodies: ITU-T, ANSI",
  "A `table` of sublayer, job, where implemented",
  "`question` placing a function in LLC or MAC",
]

[[chapter.page]]
name = "03-topologies"
title = "Physical and logical topologies"
summary = "WANs and LANs connect nodes in a few standard shapes, and the shape affects how frames get on the medium."
teaches = [
  "Physical topology (cables and devices) versus logical topology (how frames travel between nodes)",
  "WAN topologies: point-to-point (simplest and most common), hub and spoke, mesh (full and partial), with a `diagram`",
  "Half-duplex and full-duplex logical point-to-point links",
  "LAN topologies: star and extended star (switch-based, used today), bus and ring (legacy)",
  "Tradeoffs of full mesh (resilience) versus hub and spoke (cost)",
  "`question`: name the topology from a description",
]

[[chapter.page]]
name = "04-duplex-and-media-access"
title = "Duplex and media access control"
summary = "On a shared medium devices must take turns. On a switched full-duplex link they do not."
teaches = [
  "Half duplex: both devices can send but not at the same time (old hubs, wireless); full duplex: both send at once (switched Ethernet)",
  "Shared media (multiaccess) versus point-to-point connections, as the exam calls them",
  "Contention-based access: CSMA/CD on legacy half-duplex Ethernet (listen, send, detect collision, jam, back off and retry)",
  "CSMA/CA on 802.11 wireless: listen, then avoid collisions with timing and acknowledgments, because radios cannot detect collisions while sending",
  "Controlled access: deterministic turns (legacy Token Ring), and why it faded",
  "Why modern switched full-duplex Ethernet does not need CSMA/CD: each port is its own collision domain",
  "A comparison `table` of CSMA/CD and CSMA/CA",
  "`question`: which access method for a hub, a switch port and a Wi-Fi client",
]

[[chapter.page]]
name = "05-the-data-link-frame"
title = "The data link frame"
summary = "Every frame has a header, the packet and a trailer, but each technology fills them in its own way."
teaches = [
  "Generic frame fields: frame start and stop, addressing, type (which Layer 3 protocol), control (for example QoS), data (the packet), error detection, as a `fields` block",
  "Error detection: the sender computes a cyclic redundancy check (CRC) and puts it in the *frame check sequence* (FCS); the receiver recomputes it and discards the frame on mismatch",
  "Discarded frames are not resent by Ethernet; upper layers (TCP) recover",
  "Layer 2 addresses are only meaningful on the local link and are replaced at each router",
  "Frame types by technology: Ethernet, 802.11 wireless, PPP, HDLC; wireless frames carry up to four addresses because of the AP",
  "Why WAN point-to-point protocols may need little or no addressing",
  "`question`: what a switch does with a frame that fails the FCS check",
]

[[chapter.page]]
name = "06-check-yourself"
title = "Check yourself: data link layer"
summary = "Mixed questions on sublayers, topologies, duplex, media access and frames."
teaches = [
  "LLC versus MAC functions",
  "WAN and LAN topology names from diagrams",
  "Half versus full duplex and which access method applies",
  "CSMA/CD versus CSMA/CA",
  "Frame fields and the FCS",
  "What changes and what stays the same as a packet crosses routers",
  "Four to six `recall` cards",
]

# ---------------------------------------------------------------------------
# Chapter 7: Ethernet switching (ITN module 7)
# ---------------------------------------------------------------------------
[[chapter]]
number = 7
title = "Ethernet switching"

[[chapter.page]]
name = "01-ethernet-today"
title = "Ethernet today"
summary = "Ethernet is the wired LAN technology. A switch reads each frame and sends it only where it needs to go."
teaches = [
  "Scene: a floor of PCs plugged into one switch, and a frame from PC1 to PC3 that PC2 never sees",
  "Ethernet is defined by IEEE 802.2 (LLC) and 802.3 (MAC and physical), and runs over copper and fiber at 10 Mbps to 400 Gbps and beyond",
  "From hubs (shared, one collision domain) to switches (each port its own collision domain, full duplex)",
  "What this chapter covers: the frame, MAC addresses, how a switch learns and forwards, forwarding methods, port speed and duplex",
  "A `diagram` of a single-switch LAN",
]

[[chapter.page]]
name = "02-the-ethernet-frame"
title = "The Ethernet frame"
summary = "An Ethernet frame is 64 to 1518 bytes, with two MAC addresses, a type and a check sequence."
teaches = [
  "`fields` block of the Ethernet II frame: Preamble (7 bytes) and SFD (1 byte), Destination MAC (6), Source MAC (6), EtherType (2), Data (46 to 1500), FCS (4)",
  "Minimum frame 64 bytes and maximum 1518 bytes, counted from destination MAC to FCS (preamble not counted); 802.1Q tagging allows 1522",
  "Padding: a payload under 46 bytes is padded up",
  "EtherType values: 0x0800 IPv4, 0x86DD IPv6, 0x0806 ARP",
  "*Runts* (under 64 bytes) and *giants* (over the maximum) are dropped; runts often come from collisions",
  "Jumbo frames (up to about 9000 bytes) exist on some networks as an exception",
  "`question` on frame size limits",
]

[[chapter.page]]
name = "03-mac-addresses"
title = "MAC addresses"
summary = "A MAC address is 48 bits: a vendor code and a serial number, written in hexadecimal."
teaches = [
  "48 bits written as 12 hex digits; formats 00-50-79-66-68-00, 00:50:79:66:68:00, 0050.7966.6800",
  "The OUI (first 24 bits) is assigned by the IEEE to a vendor; the vendor assigns the last 24 bits uniquely",
  "Burned-in address (BIA) in the NIC, and that the operating system can override it",
  "Every Ethernet frame carries a source MAC (always unicast, the sender's NIC) and a destination MAC",
  "A NIC accepts a frame whose destination MAC is its own, broadcast, or a multicast group it has joined, and discards others",
  "`question`: identify the OUI in a given address",
]

[[chapter.page]]
name = "04-unicast-broadcast-multicast-macs"
title = "Unicast, broadcast and multicast MACs"
summary = "The destination MAC says whether a frame is for one NIC, all of them, or a group."
teaches = [
  "Unicast MAC: one specific NIC; to reach a host on the same LAN the sender needs its MAC (ARP finds it, chapter 9)",
  "Broadcast MAC FF-FF-FF-FF-FF-FF: every device on the LAN processes it; used by ARP requests and DHCP discover",
  "Multicast MACs: IPv4 multicast maps to 01-00-5E plus the low 23 bits of the group address; IPv6 multicast maps to 33-33 plus the low 32 bits",
  "The least significant bit of the first byte: 0 for unicast, 1 for group (multicast or broadcast)",
  "A `table` of type, example address, who processes it",
  "Switches flood broadcasts out every port except the incoming one, so a broadcast domain is the whole LAN",
  "`question`: classify given destination MACs",
]

[[chapter.page]]
name = "05-how-a-switch-learns"
title = "How a switch learns and forwards"
summary = "A switch learns from source addresses and forwards by destination address."
teaches = [
  "Learn: on every incoming frame the switch records the source MAC, the incoming port and the VLAN in its MAC address table (CAM table), and refreshes the timer if already present",
  "Aging: entries not refreshed are removed after 300 seconds by default on Catalyst switches",
  "Forward: known unicast destination is sent out only the matching port; unknown unicast, broadcast and multicast are flooded out all ports in the VLAN except the incoming one",
  "Filter: if the destination is on the same port the frame arrived on, the switch drops it",
  "`show mac address-table` output with columns Vlan, Mac Address, Type, Ports, shown in a `console`",
  "`show mac address-table dynamic`, `clear mac address-table dynamic`, and static entries with `mac address-table static`",
  "`command` block: display the MAC address table",
  "Misconception: a switch learns from the source address, never from the destination",
]

[[chapter.page]]
name = "06-forwarding-step-by-step"
title = "Forwarding a frame, step by step"
summary = "Follow three frames through two switches and watch both MAC tables fill."
teaches = [
  "Topology: S1 and S2 connected by an uplink, two PCs on each, shown in a `diagram`",
  "Frame 1 from PC1 to PC3 with empty tables: learned on S1, flooded, learned on S2 with the uplink as the port, flooded",
  "Frame 2, PC3 replies: now a known unicast on both switches",
  "Frame 3, a broadcast: flooded everywhere regardless of table contents",
  "Many MACs can be learned on one port (the uplink)",
  "A `table` of each switch's MAC table after each frame",
  "`question` blocks predicting which ports a frame leaves",
]

[[chapter.page]]
name = "07-switching-methods"
title = "Store-and-forward and cut-through"
summary = "A switch can check the whole frame before sending it on, or start sending as soon as it reads the address."
teaches = [
  "Store-and-forward: receive the entire frame, check the FCS, discard bad frames, then forward; the method on Cisco Catalyst switches and required for QoS and speed mismatches",
  "Cut-through: forward after reading the destination MAC; lower latency, but forwards corrupt frames",
  "Fast-forward (forward right after the destination address) and fragment-free (wait for the first 64 bytes, which filters most collision fragments)",
  "A comparison `table` of the three: latency, error checking",
  "Memory buffering: port-based buffering (queue per port) versus shared memory buffering (one pool, allows larger frames and asymmetric speeds)",
  "`question`: which method drops a frame with a bad FCS",
]

[[chapter.page]]
name = "08-speed-duplex-and-auto-mdix"
title = "Speed, duplex and auto-MDIX"
summary = "Two ends of a link must agree on speed and duplex. Autonegotiation usually gets it right."
teaches = [
  "Autonegotiation: both ends advertise capabilities and choose the best common speed and duplex; Gigabit and faster ports run full duplex",
  "Manual settings in interface mode: `speed 100`, `duplex full`, and the return to `speed auto` and `duplex auto`",
  "Duplex mismatch: one side full, one side half; the link works but is slow, with late collisions on the half-duplex side and errors such as CRC and runts on the full-duplex side",
  "Why mismatches happen: one end hard-coded, the other left on auto, so autonegotiation falls back to half duplex",
  "Auto-MDIX with `mdix auto` (default on most current switches), which needs speed and duplex on auto on some platforms",
  "Verifying with `show interfaces fa0/1` (the `Full-duplex, 100Mb/s` line) and `show interfaces status`, in a `console`",
  "`command` blocks to set and reset duplex",
]

[[chapter.page]]
name = "09-check-yourself"
title = "Check yourself: Ethernet switching"
summary = "Mixed questions on frames, MAC addresses, MAC tables and port settings."
teaches = [
  "Frame fields, sizes and EtherType values",
  "Unicast, broadcast and multicast MACs, and the 01-00-5E and 33-33 prefixes",
  "Predict switch learning and forwarding in a two-switch topology",
  "Store-and-forward versus cut-through variants",
  "Diagnose a duplex mismatch from interface symptoms",
  "Four to six `recall` cards including the 300 second aging default",
]

# ---------------------------------------------------------------------------
# Chapter 8: Network layer (ITN module 8)
# ---------------------------------------------------------------------------
[[chapter]]
number = 8
title = "Network layer"

[[chapter.page]]
name = "01-end-to-end-delivery"
title = "End-to-end delivery"
summary = "The network layer carries a packet from the original sender to the final receiver, across any number of networks."
teaches = [
  "Scene: a packet from a laptop at home to a server on another continent, crossing many routers and link types",
  "The four network layer processes: addressing end devices, encapsulation, routing, de-encapsulation",
  "IPv4 and IPv6 are the network layer protocols in use today",
  "Routers forward packets between networks; the network layer does not care what each link is",
  "A `diagram` of a multi-router path",
]

[[chapter.page]]
name = "02-ip-characteristics"
title = "Connectionless, best effort, media independent"
summary = "IP sends each packet on its own, makes no promises, and runs over any medium."
teaches = [
  "*Connectionless*: no setup before sending, like posting a letter",
  "*Best effort*: no delivery guarantee, no acknowledgment, no retransmission; reliability is left to TCP or the application",
  "*Media independent*: IP runs over copper, fiber or wireless; it only needs to know the link's maximum transmission unit (MTU)",
  "IPv4 fragmentation: a router can split a packet that exceeds the next link's MTU (1500 bytes on Ethernet), and why that is costly",
  "IPv6 routers do not fragment; the sender must size packets (path MTU discovery)",
  "`question` blocks on what IP does and does not do",
  "Misconception: 'unreliable' means IP does not check delivery, not that packets usually get lost",
]

[[chapter.page]]
name = "03-the-ipv4-header"
title = "The IPv4 header"
summary = "A 20-byte IPv4 header carries addresses, a lifetime and the name of what it carries."
teaches = [
