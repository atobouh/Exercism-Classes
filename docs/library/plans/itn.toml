[[chapter.page]]
name = "06-the-three-way-handshake"
title = "Opening and closing a TCP session"
summary = "A session opens with SYN, SYN-ACK, ACK and closes with FIN and ACK from each side."
teaches = [
  "Three-way handshake: client SYN, server SYN-ACK, client ACK; what each step proves",
  "Server process listens on a port; each client session gets its own socket pair",
  "Session termination: FIN from one side, ACK, FIN from the other, ACK (four steps, sometimes combined)",
