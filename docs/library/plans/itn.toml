[[chapter.page]]
name = "04-unicast-broadcast-multicast"
title = "Unicast, broadcast and multicast"
summary = "IPv4 can send to one host, every host on a network, or a group of interested hosts."
teaches = [
  "Unicast: one to one; source addresses are always unicast",
  "Limited broadcast 255.255.255.255 stays on the local network; directed broadcast (all host bits 1, e.g. 172.16.4.255/24) targets one remote network",
  "Routers do not forward limited broadcasts, and IOS does not forward directed broadcasts by default (`no ip directed-broadcast`)",
  "A router interface is the boundary of a broadcast domain",
  "Multicast range 224.0.0.0 to 239.255.255.255; 224.0.0.0 to 224.0.0.255 is reserved for local link use, e.g. 224.0.0.5 and 224.0.0.6 for OSPF",
  "Hosts join multicast groups; one packet reaches many receivers",
  "`question` classifying given destination addresses",
]

[[chapter.page]]
