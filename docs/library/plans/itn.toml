[[chapter.page]]
name = "02-arp-request-and-reply"
title = "ARP request and reply"
summary = "A host broadcasts 'who has this IP?' and the owner answers with its MAC address."
teaches = [
  "The ARP table (ARP cache) maps IPv4 addresses to MACs; the host checks it first",
  "ARP request: broadcast frame (destination FF-FF-FF-FF-FF-FF, EtherType 0x0806) asking for the MAC of a target IPv4 address",
  "Every host on the LAN receives it; only the owner of the target IP replies",
  "ARP reply: unicast frame back to the requester carrying the target's MAC",
  "Both sides add entries to their ARP tables; entries age out after a while",
  "`fields` block of the important ARP message fields: sender MAC, sender IP, target MAC (zeros in the request), target IP",
