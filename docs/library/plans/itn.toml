[[chapter]]
number = 14
title = "Transport layer"

[[chapter.page]]
name = "01-many-conversations-one-host"
title = "Many conversations, one host"
summary = "A host runs a browser, email and a video call at once. The transport layer keeps their data apart."
teaches = [
  "Scene: one laptop with several applications sending and receiving at once over one network connection",
  "Transport layer jobs: track individual conversations, segment data and reassemble it, add header information, identify the application",
  "Multiplexing: segments from many conversations interleave on the network",
  "Two protocols with different priorities: TCP (reliable, ordered) and UDP (fast, light)",
  "Where the transport layer sits: between applications and IP, end to end only (routers do not look at it to forward)",
]

[[chapter.page]]
name = "02-tcp-features"
title = "What TCP provides"
summary = "TCP sets up a session and guarantees ordered, complete delivery."
teaches = [
  "Connection-oriented: a session is set up before data flows",
  "Reliable delivery: lost segments are retransmitted",
  "Same-order delivery using sequence numbers",
  "Flow control: the receiver limits how much the sender may send",
  "Stateful: both ends track the session",
  "Applications that use TCP: HTTP, HTTPS, SMTP, POP3, IMAP, FTP, SSH, Telnet",
  "The cost: more overhead and delay than UDP",
]

[[chapter.page]]
name = "03-the-tcp-header"
title = "The TCP header"
summary = "A 20-byte TCP header carries ports, sequence and acknowledgment numbers, flags and a window."
teaches = [
  "`fields` block with unit bits and row 32: Source Port (16), Destination Port (16), Sequence Number (32), Acknowledgment Number (32), Header Length (4), Reserved (6), Control Bits (6), Window Size (16), Checksum (16), Urgent (16), Options",
  "Minimum header 20 bytes",
  "Control bits: URG, ACK, PSH, RST, SYN, FIN, each with its meaning",
  "Window size: how many bytes the receiver will accept before acknowledging",
  "Checksum covers the header and data",
  "`question`: which field enables reordering",
]

[[chapter.page]]
name = "04-udp-and-tcp-compared"
title = "UDP and how it compares"
