]

[[chapter.page]]
name = "08-flow-control-and-windows"
title = "Flow control and window size"
summary = "The receiver's window tells the sender how much it may send before waiting for an acknowledgment."
teaches = [
  "Window size: bytes the sender may transmit before it must receive an acknowledgment",
  "Sliding window: the window moves forward as acknowledgments arrive",
  "Maximum segment size (MSS): typically 1,460 bytes on Ethernet (1,500 byte MTU minus 20 IP and 20 TCP header bytes)",
  "Congestion avoidance: when segments are lost the sender reduces how much it sends, then increases again",
