  "HTTP methods: GET (retrieve), POST (send data to the server), PUT (upload a resource)",
  "HTTP is a request-response protocol and is stateless; HTTP sends everything in plain text",
  "HTTPS adds TLS encryption and server authentication",
  "A step `table` of the request from typing the URL to rendering the page",
  "`question`: which port a browser uses for an https URL",
]

[[chapter.page]]
name = "04-email-protocols"
title = "Email: SMTP, POP3 and IMAP"
summary = "SMTP sends mail. POP3 and IMAP let a client read it."
teaches = [
  "SMTP (TCP 25) carries mail from client to server and from server to server",
  "POP3 (TCP 110) downloads messages to the client and typically deletes them from the server",
  "IMAP (TCP 143) keeps messages on the server and synchronizes folders across devices",
  "The email path: sender's client, sender's server, recipient's server, recipient's client",
  "Comparison `table` of POP3 and IMAP",
  "`question`: which protocol suits someone reading mail on three devices",
]

[[chapter.page]]
name = "05-dns"
title = "DNS"
summary = "DNS turns names into addresses through a hierarchy of servers."
teaches = [
  "Why names: people remember names, devices need addresses",
  "The hierarchy: root servers, top-level domains (.com, .org, country codes), second-level domains",
  "Resolution: the client asks its configured DNS server, which answers from cache or queries the hierarchy",
  "Record types: A (IPv4), AAAA (IPv6), NS (name server), MX (mail exchange)",
  "DNS uses UDP and TCP port 53",
  "`nslookup` on a host, showing the server used and the answer, in a `console`; `ipconfig /displaydns` and `ipconfig /flushdns` on Windows",
  "`question`: which record type a mail server lookup returns",
]

[[chapter.page]]
name = "06-dhcp"
title = "DHCP for IPv4"
summary = "DHCP hands out addresses, masks, gateways and DNS servers on loan."
teaches = [
  "Why DHCP: automatic, consistent configuration for clients; static addresses for servers, printers and network devices",
  "The four messages: DHCPDISCOVER (broadcast), DHCPOFFER, DHCPREQUEST, DHCPACK",
  "What a lease includes: IPv4 address, mask, default gateway, DNS server, lease time; renewal before the lease ends",
  "DHCP uses UDP 67 (server) and 68 (client)",
  "DHCP servers can be a dedicated server, a router or a home wireless router",
  "Because DISCOVER is a broadcast, a remote DHCP server needs a relay on the router (`ip helper-address`, configured in the second book)",
  "`ipconfig /release` and `ipconfig /renew`, and `ipconfig /all` showing DHCP Server and Lease Obtained, in a `console`",
  "DHCPv6 is the IPv6 counterpart (chapter 12)",
]

[[chapter.page]]
name = "07-file-sharing-services"
title = "File sharing: FTP, TFTP and SMB"
summary = "FTP moves files with two connections, TFTP moves them simply, and SMB shares them on a LAN."
teaches = [
  "FTP: TCP 21 for control commands and TCP 20 for data (active mode); the client opens the control connection",
  "FTP sends usernames and passwords in clear text; SFTP (over SSH) and FTPS are secure alternatives",
  "TFTP: UDP 69, no authentication, no directory listing, simple acknowledgment per block; used to move IOS images and configuration files",
  "SMB: TCP 445, Windows file and printer sharing, sessions that let clients open, read and write remote files",
  "Comparison `table` of FTP, TFTP and SMB: transport, port, authentication, typical use",
  "`question`: which protocol a router uses to copy its configuration to a server with no login",
]

[[chapter.page]]
name = "08-check-yourself"
title = "Check yourself: application layer"
summary = "Mixed questions on application protocols, their ports and how they work."
teaches = [
  "Presentation and session layer functions",
  "Client-server versus peer-to-peer by scenario",
  "HTTP methods and ports, HTTPS",
  "SMTP, POP3 and IMAP choice",
  "DNS hierarchy and record types; DHCP message order and ports",
  "FTP, TFTP and SMB by scenario",
  "Four to six `recall` cards",
]

# ---------------------------------------------------------------------------
# Chapter 16: Network security fundamentals (ITN module 16)
# ---------------------------------------------------------------------------
[[chapter]]
number = 16
title = "Network security fundamentals"

[[chapter.page]]
name = "01-threats-and-vulnerabilities"
title = "Threats, vulnerabilities and exploits"
summary = "Security starts with names: what can go wrong, what makes it possible, and what stops it."
teaches = [
  "Definitions: *asset*, *vulnerability* (a weakness), *threat* (a potential danger), *exploit* (the method that uses a vulnerability), *mitigation* (a countermeasure), *risk*",
  "Types of threats: information theft, data loss and manipulation, identity theft, disruption of service",
  "Three sources of vulnerability: technological (protocol, OS, equipment weaknesses), configuration (default passwords, misconfigured services), security policy (no written policy, no monitoring)",
  "A `table` of the three vulnerability sources with examples",
  "`question` classifying a described weakness as technological, configuration or policy",
  "Misconception: a vulnerability is not an attack; it is the weakness an attack uses",
]

[[chapter.page]]
name = "02-physical-security-and-people"
title = "Physical security and people"
summary = "Locks, power and people matter as much as configuration."
teaches = [
  "Four classes of physical threats: hardware (theft, damage), environmental (heat, humidity), electrical (spikes, brownouts), maintenance (poor handling, missing spares)",
  "Physical access control: locked wiring closets and server rooms, badge readers, logs, mantraps",
  "Security program elements: written policy, user awareness, regular training, phishing simulations",
  "Why users are often the weakest point: social engineering targets people, not devices",
  "Power protection: UPS and surge protection",
  "`question` matching a physical threat to a mitigation",
]

[[chapter.page]]
name = "03-malware"
title = "Viruses, worms and Trojan horses"
summary = "Malware is software built to harm. It spreads in a few distinct ways."
teaches = [
  "Virus: attaches to executable code and needs a user to run it",
  "Worm: replicates itself and spreads across networks on its own by exploiting vulnerabilities",
  "Trojan horse: looks like useful software but carries a malicious payload",
  "Other malware in brief: ransomware, spyware, adware",
  "Comparison `table` of how each spreads and what it needs",
  "Defenses: patching, antivirus or endpoint protection, least privilege, user awareness",
  "`question` identifying malware from a description",
]

[[chapter.page]]
name = "04-reconnaissance-and-access-attacks"
title = "Reconnaissance and access attacks"
summary = "Attackers first map the network, then try to get in."
teaches = [
  "Reconnaissance: internet information queries, ping sweeps, port scans, vulnerability scanners",
  "Access attacks: password attacks (guessing, brute force, dictionary), trust exploitation, port redirection, man-in-the-middle",
  "Social engineering: pretexting, phishing, spear phishing, spam, something for something, baiting, impersonation, tailgating, shoulder surfing, dumpster diving",
  "A `table` of attack, goal, example",
  "`question` blocks naming the attack type in a scenario",
]

[[chapter.page]]
name = "05-denial-of-service"
title = "Denial of service"
summary = "A DoS attack does not steal data. It stops a service from working for its real users."
teaches = [
  "DoS: overwhelming a service with traffic or sending malformed data to crash it",
  "DDoS: many compromised hosts (a botnet of zombies) attack at once, directed by a command and control server",
  "Why DoS is common: easy to launch, hard to block completely",
  "TCP SYN flood: half-open connections exhaust the server",
  "Mitigations: firewalls and IPS, provider filtering, keeping systems patched",
  "`question` distinguishing DoS from DDoS",
]

[[chapter.page]]
name = "06-defense-in-depth"
title = "Defense in depth"
summary = "No single device stops every attack. Layers of protection do."
teaches = [
  "Defense in depth: VPN, firewall, IPS, email and web security appliances, AAA server, each covering different threats",
  "Keep backups (frequent, tested, stored off site) and keep systems upgraded and patched",
  "AAA: authentication (who you are), authorization (what you may do), accounting (what you did); local versus server-based (RADIUS, TACACS+)",
  "Firewall types: packet filtering, application filtering, URL filtering, stateful packet inspection; next-generation firewalls add application awareness and IPS",
  "Endpoint security: antivirus, host firewalls, host intrusion prevention",
  "A `table` matching each layer to the threats it addresses",
  "`question` blocks: which AAA component logs commands",
]

[[chapter.page]]
name = "07-passwords-and-access"
title = "Passwords and login protection"
summary = "Strong passwords, hashed secrets and login limits make device access harder to abuse."
teaches = [
  "Strong password guidance: long, mixed characters, no dictionary words, changed when compromised, never reused; passphrases",
  "Password policy elements: minimum length and complexity, history, lockout, management of shared credentials",
  "Alternatives and additions: multifactor authentication (something you know, have, are), certificates, biometrics",
  "`enable secret` is hashed (type 5 MD5 on older IOS, stronger types 8 or 9 on newer IOS XE), while `service password-encryption` gives only reversible type 7",
  "`security passwords min-length 8`",
  "`login block-for 120 attempts 3 within 60` to slow brute-force logins",
  "`exec-timeout 5 0` on console and VTY lines (default 10 minutes)",
  "A `console` of the hardening commands and `command` blocks for two of them",
]

[[chapter.page]]
name = "08-enabling-ssh"
title = "Enabling SSH"
summary = "Replace Telnet with SSH so remote logins and commands are encrypted."
teaches = [
  "Prerequisites: an IOS image that supports cryptography, a hostname other than the default, and a domain name",
  "Steps in order: `hostname R1`, `ip domain-name example.com`, `crypto key generate rsa general-keys modulus 2048`, `username admin secret ...`, `line vty 0 4`, `transport input ssh`, `login local`, `ip ssh version 2`",
  "Why `login local` (use the local username database) instead of `login` with a line password",
  "Verify with `show ip ssh` (SSH Enabled - version 2.0) and `show ssh`, in a `console`",
  "Connect from a client with an SSH client (or `ssh -l admin 192.168.10.1` from another IOS device)",
  "The same steps on a switch, with `line vty 0 15`",
  "Misconception: `transport input ssh` blocks Telnet; leaving `transport input all` allows both",
  "`command` blocks for generating the RSA key and restricting VTY to SSH",
]

[[chapter.page]]
name = "09-disabling-unused-services"
title = "Disabling unused services and ports"
summary = "Every running service and every live port is a door. Close the ones you do not use."
teaches = [
  "Cisco devices may run services that are not needed, such as the HTTP server",
  "Listing open ports: `show control-plane host open-ports` on IOS XE; `show ip ports all` on some IOS releases",
  "Disabling services: `no ip http server`, `no ip http secure-server` if the GUI is not used",
  "Shutting down unused switch ports with `interface range fa0/10 - 24` then `shutdown`",
  "Other basic hardening: banners that warn, keeping IOS updated",
  "`command` block for shutting an interface range",
]

[[chapter.page]]
name = "10-hardening-walk-through"
title = "Hardening walk-through"
summary = "Take a router with weak defaults and harden it step by step, then check the result."
teaches = [
  "Start from a weak configuration in a `console`: Telnet open, `enable password`, no timeouts, no banner",
  "Apply the fixes in order: enable secret, `service password-encryption`, minimum length, `login block-for`, local user, SSH, `transport input ssh`, `exec-timeout`, banner, `no ip http server`",
  "Verify with `show running-config`, `show ip ssh`, an SSH login, a refused Telnet attempt",
  "A checklist `table` the reader can reuse on any device",
  "Mixed `question` blocks on threats, attacks and mitigations",
  "Four `recall` cards",
]

