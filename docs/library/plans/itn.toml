  "Protocol analysis with a capture tool such as Wireshark to see which protocols dominate and when",
  "Employee network utilization: OS, applications and their traffic over time, and how usage changes",
  "Topology shapes as networks grow: two-tier (collapsed core) and three-tier (access, distribution, core) campus designs, spine-leaf in data centers, WAN links between sites",
  "On-premises versus cloud-hosted services as a growth choice",
  "`question`: which tool gives a traffic baseline",
]

[[chapter.page]]
name = "04-verifying-with-ping-and-traceroute"
title = "Verifying with ping and traceroute"
summary = "Ping and traceroute prove reachability and, measured over time, give a performance baseline."
teaches = [
  "A network baseline: record normal round-trip times and paths so you can recognize abnormal",
  "Extended ping on IOS: set source interface, repeat count, datagram size and timeout, in a `console`",
  "Using round-trip times to compare relative performance of paths and times of day",
  "Extended traceroute on IOS for choosing the source and probe settings",
  "Windows `tracert` and IOS `traceroute` used together to locate slow or broken hops",
  "`question` interpreting a rising round-trip time",
]

[[chapter.page]]
name = "05-host-ip-commands"
title = "Checking IP settings on Windows, Linux and macOS"
summary = "Every client OS can show its address, mask, gateway and DNS. Know the command on each."
teaches = [
  "Windows: `ipconfig`, `ipconfig /all` (MAC, DHCP server, lease, DNS servers), `ipconfig /displaydns`, in a `console`",
  "Linux: `ip address` (and `ifconfig` on older systems), `ip route` for the default gateway, in a `console`",
  "macOS: `ifconfig`, and `networksetup -getinfo` with a service name such as Wi-Fi",
  "`arp -a` on all three to see the neighbor cache",
  "`netstat` or `ss` (Linux) for active connections",
  "A `table` of the command per OS for address, gateway, DNS, ARP cache",
  "`question` blocks: which command shows the DHCP server on Windows",
]

[[chapter.page]]
name = "06-ios-show-commands"
title = "IOS show commands for a small network"
summary = "A handful of show commands answers most questions about a switch or router."
teaches = [
  "`show running-config`, `show interfaces`, `show ip interface`, `show ip interface brief`, `show arp`, `show ip route`, `show protocols`",
  "`show version` output: IOS version, uptime, image file, memory, interfaces, configuration register (0x2102 for a normal boot), in a `console`",
  "`show cdp neighbors` (Device ID, Local Intrfce, Holdtme, Capability, Platform, Port ID) and `show cdp neighbors detail` for neighbor IP addresses, in a `console`",
  "CDP runs by default on Cisco devices; it helps map a topology but leaks information, so disable it on untrusted ports",
  "`show ip interface brief` on a switch and a router side by side",
  "`command` blocks for `show version` and `show cdp neighbors`",
