  "IP addressing plan by device type: end devices, servers and peripherals, network devices, with static versus DHCP and documented ranges",
  "Redundancy in a small network: redundant servers, links and power where the business needs them",
  "Traffic management: give voice priority over video and video over data with QoS",
  "`question`: choose between fixed and modular devices for a growth scenario",
]

[[chapter.page]]
name = "02-applications-and-protocols"
title = "Applications and protocols in a small network"
summary = "Users see applications. The network has to support the protocols underneath them."
teaches = [
  "Network-aware applications (email client, browser) versus application layer services (file transfer, print spooling)",
  "Common protocols a small network supports: DNS, DHCP, SSH, Telnet (legacy), SMTP, POP3, IMAP, HTTP, HTTPS, FTP, TFTP, SMB, with ports in a `table`",
  "Voice and video: VoIP, IP telephony and real-time video need low delay and jitter and may need QoS and more bandwidth",
  "Infrastructure checks for voice: PoE switches, QoS support, enough bandwidth",
  "`question` blocks matching services to protocols",
]

[[chapter.page]]
name = "03-growing-the-network"
title = "Growing to a larger network"
summary = "Plan growth with documentation, inventory and traffic analysis, and the design shape changes as the network grows."
teaches = [
