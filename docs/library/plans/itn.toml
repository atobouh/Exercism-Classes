  "`command` blocks for the GUA and the LLA",
  "Misconception: an IPv6 address typed without a prefix length is rejected; the prefix is part of the command",
]

[[chapter.page]]
name = "08-slaac-and-dhcpv6"
title = "Dynamic GUAs: SLAAC and DHCPv6"
summary = "A router advertisement tells hosts how to get their addresses: on their own, partly from DHCPv6, or fully from DHCPv6."
teaches = [
  "Router Solicitation (to ff02::2, all routers) and Router Advertisement (to ff02::1, all nodes); Cisco routers send RAs every 200 seconds by default once `ipv6 unicast-routing` is on",
  "Method 1, SLAAC only: the RA carries the prefix and the host builds its own GUA; default gateway is the router's LLA",
  "Method 2, SLAAC with stateless DHCPv6: the host makes its address with SLAAC and gets DNS and other settings from a DHCPv6 server (the O flag)",
  "Method 3, stateful DHCPv6: the host gets its address from a DHCPv6 server (the M flag), still using the RA for its default gateway",
  "A `table` of the three methods: where the address comes from, where DNS comes from, which flag",
  "Duplicate Address Detection runs before a host uses its new address",
  "Point forward: configuring DHCPv6 servers is in the second book",
  "`question`: which method does a given RA flag combination select",
]

[[chapter.page]]
name = "09-interface-ids-eui64-and-random"
title = "Interface IDs: EUI-64 and random"
summary = "A host builds its 64-bit interface ID from its MAC address or from random bits."
teaches = [
  "EUI-64 steps: split the 48-bit MAC in half, insert FFFE in the middle, flip the seventh bit (the U/L bit) of the first byte",
  "Worked example: MAC 0050.7966.6800 becomes interface ID 0250:79ff:fe66:6800",
  "A second worked example where flipping the bit turns 02 into 00",
  "Randomly generated interface IDs: used by Windows and other modern OSes by default for privacy, because EUI-64 exposes the MAC",
  "LLAs are built the same way: fe80:: plus the interface ID",
  "`ipv6 address 2001:db8:acad:1::/64 eui-64` on a router, and spotting `FFFE` in `show ipv6 interface brief`",
  "`question` blocks computing EUI-64 interface IDs",
]

[[chapter.page]]
name = "10-ipv6-multicast"
title = "IPv6 multicast"
summary = "IPv6 uses multicast where IPv4 used broadcast, and every host joins a few groups automatically."
teaches = [
  "Multicast prefix ff00::/8; well-known assigned multicast addresses",
  "ff02::1 all-nodes (every IPv6 device joins it; the closest thing to a broadcast) and ff02::2 all-routers (routers join it once `ipv6 unicast-routing` is on)",
  "Solicited-node multicast: ff02::1:ff00:0/104 plus the last 24 bits of a unicast address; one per address, used by ND so only the target is interrupted",
  "Worked example: the solicited-node address for 2001:db8:acad:1::10 is ff02::1:ff00:10",
  "`show ipv6 interface g0/0/0` on a router showing `Joined group address(es)` with ff02::1, ff02::2 and solicited-node groups, in a `console`",
