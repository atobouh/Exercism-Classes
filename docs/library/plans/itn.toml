]

[[chapter.page]]
name = "07-sequence-and-acknowledgment"
title = "Sequence numbers and acknowledgments"
summary = "TCP numbers every byte. The receiver acknowledges by naming the next byte it expects."
teaches = [
  "The initial sequence number (ISN) is chosen at random during the handshake",
  "Sequence numbers count bytes, not segments",
  "The acknowledgment number is the next byte expected (expectational acknowledgment)",
  "Worked example with numbers: 1,460-byte segments and the ACKs that follow",
  "Lost data: the sender retransmits unacknowledged data after a timeout",
  "Selective acknowledgment (SACK) lets the receiver report non-contiguous blocks, so only missing data is resent",
  "Out-of-order segments are reordered by sequence number before delivery to the application",
