  "Windows: `arp -a` shows Internet Address, Physical Address, Type (dynamic or static) per interface, in a `console`; `arp -d` deletes entries",
  "Cisco router: `show ip arp` (or `show arp`) with columns Protocol, Address, Age (min), Hardware Addr, Type, Interface, in a `console`",
  "Entries with Age `-` are the router's own interface addresses",
  "Cisco IOS ARP entries time out after 4 hours by default; host operating systems use much shorter timers that vary by OS",
  "`clear arp-cache` on a router",
  "Static ARP entries exist but are rarely used",
  "`command` block: display the router's ARP table",
]

[[chapter.page]]
name = "05-arp-issues"
title = "ARP problems and risks"
summary = "ARP broadcasts load the LAN, and anyone can send a fake ARP reply."
teaches = [
  "Broadcast overhead: many hosts starting up at once flood ARP requests; segmenting the network limits it",
  "Gratuitous ARP: a host announces its own IP and MAC without being asked (used after address changes and for duplicate detection)",
  "ARP spoofing (ARP poisoning): an attacker replies with its own MAC for the gateway's IP and becomes a man in the middle",
  "Hosts accept ARP replies they did not request, which makes spoofing possible",
  "Mitigation preview: Dynamic ARP Inspection on enterprise switches (covered in the second book)",
  "`question`: what an attacker gains by spoofing the gateway's MAC",
]

[[chapter.page]]
name = "06-ipv6-neighbor-discovery"
