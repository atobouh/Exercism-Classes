book = "itn"

# ---------------------------------------------------------------------------
# Chapter 1: Networking today (ITN module 1)
# ---------------------------------------------------------------------------
[[chapter]]
number = 1
title = "Networking today"

[[chapter.page]]
name = "01-networks-everywhere"
title = "Networks everywhere"
summary = "A message you send crosses many devices and links you never see. This book is about how that works."
teaches = [
  "Follow one concrete action (a video call or a web search) from a laptop across a home router, an ISP and a server, naming each kind of device it touches",
  "Define a *network* as devices connected so they can share data, and the *internet* as a network of networks",
  "Define a *host* (end device) as any device that sends or receives messages and has an address",
  "How networks changed learning, work, play and communication, with two or three concrete examples rather than a list",
  "The idea that the same principles run a two-PC home network and a global provider network, so learning one teaches you the other",
  "A short preview of what the reader will be able to do after the book: address hosts, configure a switch and a router, test and troubleshoot",
]

[[chapter.page]]
name = "02-network-components"
title = "End devices and intermediary devices"
summary = "Hosts create and receive data. Switches, routers, access points and firewalls carry it between them."
teaches = [
  "End devices: PCs, laptops, phones, printers, IP phones, cameras, servers; clients request services and servers provide them, and one host can be both",
  "Peer-to-peer networks (a host is client and server at once): cheap and simple, but no central management, weak security and poor scaling",
  "Intermediary devices and what each does: a *switch* connects hosts in one LAN, a *router* connects networks and picks paths, an *access point* bridges wireless clients to the wired LAN, a *firewall* filters traffic",
  "Layer 2 switches versus Layer 3 (multilayer) switches: a Layer 3 switch can also route between networks",
  "Next-generation firewalls and IPS: a firewall permits or denies by rule, an IPS inspects traffic and blocks known attacks; an NGFW combines both with application awareness",
  "Wireless LAN controllers (WLCs) manage many access points centrally; endpoints and servers are the sources and sinks of traffic",
  "Power over Ethernet (PoE): a switch port powers an IP phone, AP or camera over the same cable",
  "Jobs intermediary devices do: regenerate signals, keep path information, report errors, choose alternate paths, apply priority and security policy",
]

[[chapter.page]]
name = "03-media-and-topology-diagrams"
title = "Network media and topology diagrams"
summary = "Data travels over copper, glass or radio, and engineers draw it with a small set of symbols."
teaches = [
  "The three media types and how each carries bits: metal wires (electrical pulses), glass or plastic fiber (light), and wireless (radio waves)",
  "Terms: *NIC* (network interface card), *physical port* (the socket), *interface* (a port on a networking device that connects to a network)",
  "Standard symbols for PC, server, switch, router, wireless router, access point and firewall, shown in a `diagram`",
  "Physical topology diagrams show where devices and cables are (rooms, racks); logical topology diagrams show devices, ports and addressing",
  "Read a small logical diagram: which hosts share a LAN, which router interface is each LAN's gateway, which link joins two routers",
  "Ask the reader to identify the device kinds and network count in a diagram (`question`)",
]

[[chapter.page]]
name = "04-lans-and-wans"
title = "LANs, WANs and the internet"
summary = "A LAN covers one building under one owner. A WAN joins LANs over long distances, usually through a provider."
teaches = [
  "A *LAN* spans a small area, is run by one organization or person, and gives high-speed links to its hosts",
  "A *WAN* joins LANs across large distances, is usually run by one or more service providers, and is typically slower and costs more per bit",
  "Comparison `table`: LAN versus WAN on area, ownership, speed and cost",
  "The internet as an interconnection of LANs and WANs with no single owner; organizations such as IETF, ICANN and IAB keep it working",
  "*Intranet* (private to one organization) versus *extranet* (secure access for outside partners such as suppliers)",
  "Small office/home office (SOHO) networks: one wireless router doing switching, routing, Wi-Fi and the internet connection",
  "On-premises networks versus cloud-hosted services, as a first idea the book returns to later",
]

[[chapter.page]]
name = "05-internet-connections"
title = "Connecting to the internet"
summary = "Homes and businesses reach the internet through cable, DSL, cellular, satellite, fiber or leased lines."
teaches = [
  "Home and small office options: cable (shares the TV coax), DSL (telephone line), cellular, satellite, fiber to the home, and dial-up as a legacy option",
  "Business options: dedicated leased lines, Metro Ethernet, business DSL and satellite, and why businesses pay for guaranteed bandwidth and service levels",
  "A comparison `table` of connection types by medium, typical use and tradeoff",
  "Separate networks (phone, TV, data) versus a *converged network* that carries voice, video and data on one infrastructure",
  "The ISP's role: it provides the WAN link and the path to the rest of the internet",
  "`question`: choose a suitable connection for a described site (rural home, branch office, data center)",
]

[[chapter.page]]
name = "06-reliable-networks"
title = "What makes a network reliable"
summary = "Reliable networks rest on four ideas: fault tolerance, scalability, quality of service and security."
teaches = [
  "*Fault tolerance*: redundant paths limit the damage of a failure; packet switching lets traffic take another path, unlike a circuit-switched phone call",
  "*Scalability*: a network grows by adding users and devices without redesigning it, because it follows standard protocols and a layered design",
  "*Quality of service (QoS)*: when links congest, voice and video need priority over bulk data; congestion is when demand exceeds bandwidth",
  "*Security*: physical security of devices and media, and information security (confidentiality, integrity, availability, the CIA triad)",
  "A comparison of packet switching and circuit switching with a concrete example of each",
  "`question` cards that map a described design choice (a second uplink, a priority queue, a lock on the wiring closet) to the property it serves",
]

[[chapter.page]]
name = "07-network-trends"
title = "Network trends"
summary = "BYOD, collaboration tools, video and the cloud change what a network must carry."
teaches = [
  "*BYOD* (bring your own device): any device, anywhere, and the security and capacity problems it creates",
  "Online collaboration and video communication: real-time traffic that is sensitive to delay",
  "Cloud computing: services and storage reached over the internet; public, private, hybrid and community clouds compared in a `table`",
  "Data centers: where cloud services physically live; on-premises versus cloud as a cost, control and responsibility tradeoff",
  "Server virtualization in one paragraph: one physical server runs many virtual machines; containers share one operating system kernel and are lighter still",
  "Home trends: smart home devices, powerline networking (data over electrical wiring), wireless broadband from a WISP or cellular provider",
]

[[chapter.page]]
name = "08-network-security-basics"
title = "Threats and defenses"
summary = "Networks face attacks from outside and inside. Layers of defense keep them in check."
teaches = [
  "External threats: viruses, worms and Trojan horses, spyware and adware, zero-day attacks, threat actor attacks, denial of service, data interception and theft, identity theft",
  "Internal threats: lost or stolen devices, accidental misuse by employees, malicious insiders; many breaches start inside",
  "Why no single solution works: security is implemented in layers",
  "Home and small office defenses: antivirus and antispyware, firewall filtering on the home router",
  "Larger network defenses: dedicated firewalls, access control lists (ACLs), intrusion prevention systems (IPS), virtual private networks (VPNs)",
  "A `table` matching each threat to a defense that addresses it",
  "Point forward: chapter 16 configures device hardening on real switches and routers",
]

[[chapter.page]]
name = "09-the-networking-profession"
title = "Working in networking"
summary = "Networking skills lead to many roles, and certification shows you have them."
teaches = [
  "The CCNA certification as a starting point: it covers fundamentals, network access, IP connectivity, IP services, security and automation",
  "What the three CCNA courses cover, and how this book's chapters follow the first course",
  "Roles that use these skills: network technician, network administrator, network engineer, security analyst, cloud and automation roles",
  "Why hands-on command-line practice matters as much as theory",
  "How to use this app: read in order, answer the questions, use recall cards and drills for spaced practice",
]

[[chapter.page]]
name = "10-check-yourself"
title = "Check yourself: networking today"
summary = "Mixed questions on devices, network types, connections, reliability, trends and threats."
teaches = [
  "Mixed `question` blocks: identify end devices versus intermediary devices from descriptions",
  "LAN versus WAN, intranet versus extranet, by scenario",
  "Pick the internet connection type that matches a described site",
  "Match fault tolerance, scalability, QoS and security to design choices",
  "Public, private, hybrid and community cloud by scenario",
  "Match threats to defenses",
  "Four to six `recall` cards covering the chapter's key terms",
]

# ---------------------------------------------------------------------------
# Chapter 2: Basic switch and end device configuration (ITN module 2)
# ---------------------------------------------------------------------------
[[chapter]]
number = 2
title = "Basic switch and end device configuration"

[[chapter.page]]
name = "01-a-switch-out-of-the-box"
title = "A switch out of the box"
summary = "A new Cisco switch forwards frames on its own. To manage and secure it, you talk to its operating system."
teaches = [
  "Scene: a new Catalyst 2960 on a desk; plug in PCs and it already switches, but it has no name, no passwords and no management address",
  "An operating system's parts: the *shell* (user interface), the *kernel* (talks to hardware), the hardware",
  "Cisco IOS is the operating system on Cisco switches and routers; IOS XE runs on Catalyst 9000 switches and ISR 4000 routers and behaves the same at the CLI for this book",
  "GUI versus CLI: why network engineers use the command-line interface (precise, scriptable, works over a slow console link)",
  "Firmware and the IOS image are stored in flash; the running configuration lives in RAM (detail on page 6)",
  "Preview of the chapter: reach the CLI, move between modes, name and secure the switch, save, address hosts and the switch, test",
]

[[chapter.page]]
name = "02-reaching-the-cli"
title = "Reaching the CLI"
summary = "You reach a switch through its console port, or over the network with SSH or Telnet."
teaches = [
  "Console port: out-of-band access through a rollover (console) cable or a USB console cable, used for first setup and when the network is down",
  "Terminal emulator settings for the console: 9600 baud, 8 data bits, no parity, 1 stop bit, no flow control",
  "Terminal emulators such as PuTTY, Tera Term and SecureCRT",
  "SSH: in-band, encrypted remote access, the recommended method; needs an IP address on the device",
  "Telnet: in-band remote access that sends everything, including passwords, in clear text; avoid it",
  "AUX port on some routers for dial-up modem access (legacy)",
  "Comparison `table` of console, SSH, Telnet and AUX: in-band or out-of-band, encrypted or not, needs an IP address or not",
  "`question`: which access method works on a switch that has no IP address yet",
]

[[chapter.page]]
name = "03-command-modes"
title = "IOS command modes"
summary = "IOS separates looking from changing. Each mode has its own prompt and its own commands."
teaches = [
  "User EXEC mode (`Switch>`): limited monitoring commands only",
  "Privileged EXEC mode (`Switch#`): all show commands, copy, reload, debug; entered with `enable`, left with `disable`",
  "Global configuration mode (`Switch(config)#`), entered with `configure terminal`; changes apply immediately to the running configuration",
  "Subconfiguration modes: line (`Switch(config-line)#`), entered with `line console 0` or `line vty 0 15`; interface (`Switch(config-if)#`), entered with `interface fastethernet0/1` or `interface vlan 1`",
  "Moving back: `exit` goes up one level, `end` or Ctrl+Z goes straight to privileged EXEC; moving from one subconfig mode directly to another",
  "A `console` showing a session moving through every mode",
  "`command` blocks: enter privileged EXEC; enter global configuration",
  "Misconception: show commands do not work in global configuration mode unless you prefix them with `do`",
]

[[chapter.page]]
name = "04-command-structure-and-help"
title = "Command structure and help"
summary = "Every command is keywords and arguments. The question mark and the Tab key save you from memorizing them."
teaches = [
  "Command structure: a keyword (`ping`) followed by arguments (`192.168.10.5`); syntax conventions such as bold keywords and italic arguments, square brackets for optional, braces for required choices",
  "Context-sensitive help: `?` alone lists commands in this mode, `sh?` completes a partial word, `show ?` lists the next keywords",
  "Tab completion and abbreviation: `conf t`, `sh ip int br` work as long as the abbreviation is unique",
  "IOS error messages: `% Ambiguous command`, `% Incomplete command.`, `% Invalid input detected at '^' marker.`, shown in a `console`",
  "Hotkeys: Up arrow and Ctrl+P (history), Ctrl+A and Ctrl+E (line start and end), Ctrl+C (abort in config mode), Ctrl+Shift+6 (interrupt a ping, traceroute or DNS lookup), Space and Enter at `--More--`",
  "`no ip domain-lookup` stops a mistyped word from being treated as a hostname and waiting for DNS",
  "`command` block using an abbreviation",
]

[[chapter.page]]
name = "05-naming-and-securing-the-switch"
title = "Naming and securing the switch"
summary = "Give the switch a hostname, lock its console and remote lines, and protect privileged mode."
teaches = [
  "`hostname S1`: hostname rules (start with a letter, no spaces, end with a letter or digit, letters, digits and dashes only, under 64 characters)",
  "Securing the console: `line console 0`, `password`, `login`; without `login` the password is never asked for",
  "Securing privileged EXEC with `enable secret` (hashed) rather than `enable password` (stored as typed); if both exist the secret wins",
  "Securing remote lines: `line vty 0 15` on a 2960 (16 lines), `password`, `login`; routers often have `line vty 0 4` by default",
  "`service password-encryption`: encrypts clear-text passwords in the config with weak type 7, which only stops shoulder surfing",
  "`banner motd #Authorized access only#`: the delimiter character, and why a banner should warn rather than welcome",
  "A `console` of the full sequence and the resulting lines in `show running-config`",
  "`command` blocks for `enable secret` and `login` in line mode",
]

[[chapter.page]]
name = "06-saving-the-configuration"
title = "Saving and restoring the configuration"
summary = "Changes live in RAM until you copy them to NVRAM. A reload without saving undoes them."
teaches = [
  "running-config in RAM (active, lost on power loss) versus startup-config in NVRAM (loaded at boot)",
  "`show running-config` and `show startup-config`, and how to compare them",
  "`copy running-config startup-config` (abbreviated `copy run start`) and its `Destination filename [startup-config]?` prompt, shown in a `console`",
  "Undo unsaved changes with `reload`, and the `System configuration has been modified. Save? [yes/no]:` prompt",
  "`erase startup-config` then `reload` to return to a blank configuration; on a switch VLANs are kept in `vlan.dat` in flash, so `delete vlan.dat` as well for a full reset",
  "Capturing a configuration to a text file from the terminal emulator, and pasting a text file back in",
  "`command` block for saving the configuration",
  "Misconception: configuration changes take effect immediately; saving controls only whether they survive a reboot",
]

[[chapter.page]]
name = "07-ports-and-addresses"
title = "Ports, interfaces and addresses"
summary = "Hosts need an IP address, a mask and a gateway. A switch needs one too, but only so you can manage it."
teaches = [
  "An IPv4 address is 32 bits written as four decimal octets (192.168.10.10); the subnet mask (255.255.255.0) marks which part names the network; the default gateway is the router address for leaving the network",
  "IPv6 addresses are 128 bits in hexadecimal, previewed with 2001:db8:acad:10::10/64",
  "Physical ports and media: copper twisted pair, fiber, wireless; each has its own standards (preview of chapter 4)",
  "A Layer 2 switch forwards frames by MAC address and does not need an IP address to do that",
  "The *switch virtual interface (SVI)*: `interface vlan 1` is a virtual interface that gives the switch a management address",
  "Why VLAN 1 is the default and all access ports start in it",
  "`question`: which device needs a default gateway for which purpose",
]

[[chapter.page]]
name = "08-configuring-ip-addressing"
title = "Configuring IP addressing"
summary = "Set a host's address by hand or with DHCP, then give the switch its management address."
teaches = [
  "Windows manual IPv4 configuration: IP address, subnet mask, default gateway, preferred DNS server, in the adapter's IPv4 properties",
  "DHCP: 'Obtain an IP address automatically' and why most hosts use it; what the DHCP server hands out",
  "IPv6 host settings: manual, or automatic with SLAAC or DHCPv6 (chapter 12 explains them)",
  "Switch SVI: `interface vlan 1`, `ip address 192.168.1.2 255.255.255.0`, `no shutdown`, shown in a `console` with the resulting status messages",
  "`ip default-gateway 192.168.1.1` in global configuration so the switch can be managed from other networks",
  "`command` blocks for the SVI address and the default gateway",
  "Misconception: the switch's default gateway does not affect frames it forwards for hosts; it is only for traffic the switch itself sends",
]

[[chapter.page]]
name = "09-verifying-connectivity"
title = "Verifying connectivity"
summary = "Check the address you set, then prove two devices can reach each other."
teaches = [
  "`ipconfig` on Windows: IPv4 address, subnet mask, default gateway, and IPv6 link-local address, shown in a `console`",
  "`show ip interface brief` on the switch: columns Interface, IP-Address, OK?, Method, Status, Protocol, shown in a `console`",
  "Why `Vlan1` can show `up/down` or `down/down`: the SVI comes up only when at least one port in VLAN 1 is up",
  "`ping` from PC1 to PC2 and from a PC to the switch SVI; reading Windows ping output (Reply from, bytes=32, time, TTL)",
  "What a failed ping tells you and does not tell you: wrong address, wrong mask, cable, shut interface",
  "`command` block: show a summary of interfaces and their IPv4 addresses",
]

[[chapter.page]]
name = "10-worked-setup"
title = "Worked setup: a new switch"
summary = "Configure a switch from blank to managed and secured, then prove it works."
teaches = [
  "Scenario: S1 with PC1 and PC2, addressed from 192.168.1.0/24, shown in a `diagram`",
  "The full ordered configuration in one `console`: hostname, `no ip domain-lookup`, enable secret, console and VTY passwords, `service password-encryption`, banner, SVI, default gateway, save",
  "Host configuration for both PCs",
  "Verification sequence: `show running-config`, `show ip interface brief`, ping between PCs and to S1",
  "Two planted faults (a missing `login`, an SVI left shut) and how the reader would spot each",
  "Mixed `command` and `question` blocks, and three or four `recall` cards on modes and saving",
]

# ---------------------------------------------------------------------------
# Chapter 3: Protocols and models (ITN module 3)
# ---------------------------------------------------------------------------
[[chapter]]
number = 3
title = "Protocols and models"

[[chapter.page]]
name = "01-rules-for-talking"
title = "Rules for talking"
summary = "Any conversation needs a sender, a receiver, a channel and rules both sides follow."
teaches = [
  "The three parts of any communication: message source (sender), destination (receiver), channel (media)",
  "A human example (a phone call or a letter) and how each part maps to a network",
  "What both sides must agree on: who is sending and who receives, a common language and grammar, speed and timing, confirmation that the message arrived",
  "Define a *protocol* as an agreed set of rules for communication",
  "Why networks need protocols for every step: from what a voltage means to how a web page is requested",
]

[[chapter.page]]
name = "02-what-every-message-needs"
title = "What every message needs"
summary = "Messages must be encoded, formatted, sized, timed and addressed for one, some or all receivers."
teaches = [
  "Message encoding: turning information into a form that can be sent (bits into voltage, light or radio)",
  "Message formatting and encapsulation: placing a message in a defined structure with addresses, like an envelope",
  "Message size: long messages are broken into smaller pieces that fit the medium and are reassembled",
  "Message timing: flow control (how fast), response timeout (how long to wait), access method (when you may send)",
  "Delivery options: *unicast* (one to one), *multicast* (one to a group), *broadcast* (one to all); IPv6 has no broadcast",
  "A `question` per timing term matched to a described situation",
]

[[chapter.page]]
name = "03-protocols-at-work"
title = "Protocols working together"
summary = "Several protocols, each with one job, cooperate to deliver a single web page."
teaches = [
  "Functions protocols provide: addressing, reliability, flow control, sequencing, error detection, application interface",
  "Protocol types: network communications protocols, network security protocols, routing protocols, service discovery protocols, with one example each",
  "The web page example: HTTP (application), TCP (transport, conversations and reliability), IP (addressing and delivery between networks), Ethernet (delivery on one link)",
  "Each protocol does its own job and relies on the one below",
  "A `table` of the four protocols and what each contributes",
]

[[chapter.page]]
name = "04-protocol-suites"
title = "Protocol suites and TCP/IP"
summary = "Protocols come in suites that are designed to work together. TCP/IP won."
teaches = [
  "A *protocol suite* is a set of protocols designed to work together; historical suites (AppleTalk, Novell NetWare IPX/SPX, the OSI suite) and why TCP/IP became the standard",
  "TCP/IP is open: anyone can implement it, and it is defined in public RFCs",
  "TCP/IP protocols by layer, as a `table`: application (DNS, DHCP, SMTP, POP3, IMAP, FTP, TFTP, HTTP, HTTPS), transport (TCP, UDP), internet (IPv4, IPv6, ICMPv4, ICMPv6, NAT, OSPF, EIGRP, BGP), network access (ARP, Ethernet, WLAN)",
  "Note that ARP works between the internet and network access layers and is grouped differently by different sources",
  "Walk through a browser requesting a page: the server encapsulates the HTML down the stack, and the client de-encapsulates it up the stack",
  "`question`: which layer a named protocol belongs to",
]

[[chapter.page]]
name = "05-standards-organizations"
title = "Standards organizations"
summary = "Open standards let devices from different vendors work together. A handful of bodies write them."
teaches = [
  "Open standards versus proprietary protocols, and why open standards encourage competition and interoperability",
  "Internet bodies: ISOC (promotes open development), IAB (oversight of architecture), IETF (develops protocols, publishes RFCs), IRTF (long-term research)",
  "Addressing bodies: ICANN coordinates IP addresses and domain names; IANA manages address allocation, domain names and protocol numbers",
  "Electronics and communications bodies: IEEE (802.3 Ethernet, 802.11 Wi-Fi), EIA, TIA (cabling standards such as T568A and T568B), ITU-T (telecom and video standards)",
  "A `table` of organization, what it standardizes, one example standard",
  "`question` matching a standard to its body",
]

[[chapter.page]]
name = "06-the-osi-and-tcpip-models"
title = "The OSI and TCP/IP models"
summary = "Layered models split networking into jobs. The OSI model has seven layers and TCP/IP has four."
teaches = [
  "Why layers help: protocols can be designed and changed independently, vendors interoperate, troubleshooting has a shared vocabulary",
  "Reference model (OSI, used to describe and teach) versus protocol model (TCP/IP, matches the protocols in use)",
  "The seven OSI layers with one-line jobs: application, presentation, session, transport, network, data link, physical",
  "The four TCP/IP layers: application, transport, internet, network access",
  "A mapping `table`: OSI 5 to 7 to TCP/IP application, 4 to transport, 3 to internet, 1 and 2 to network access",
  "Using layer numbers in conversation: 'a Layer 2 problem', 'a Layer 3 switch'",
  "`question`: which OSI layer handles a described function (path selection, MAC addressing, port numbers, encoding bits)",
  "`recall` card for the OSI layer order",
]

[[chapter.page]]
name = "07-encapsulation-and-pdus"
title = "Encapsulation and PDUs"
summary = "Each layer wraps the data from the layer above. The wrapped unit gets a new name at each layer."
teaches = [
  "*Segmentation*: dividing data into smaller pieces so many conversations can share the network (multiplexing) and a lost piece is cheap to resend",
  "*Sequencing*: numbering pieces so the receiver can rebuild the data in order",
  "Protocol data units by layer: data, segment (TCP) or datagram (UDP), packet, frame, bits",
  "Encapsulation on the way down: transport header, then IP header, then frame header and trailer; de-encapsulation on the way up",
  "A `fields` block showing a frame containing a packet containing a segment containing data",
  "`question`: name the PDU at a given layer",
  "Misconception: the frame trailer (FCS) is added only at Layer 2, not by every layer",
]

[[chapter.page]]
name = "08-addresses-at-each-layer"
title = "Addresses at each layer"
summary = "IP addresses name the two ends of a conversation. MAC addresses name the two ends of one link."
teaches = [
  "Layer 3 logical addresses (source and destination IP) stay the same from original sender to final receiver",
  "Layer 2 physical addresses (source and destination MAC) are for one link, NIC to NIC, and change at every router",
  "Same network: the destination MAC is the destination host's MAC",
  "Remote network: the destination MAC is the default gateway's MAC, while the destination IP is still the remote host",
  "A `diagram` of PC1, R1 and a web server on another network, with a `table` of the four addresses on each link",
  "The network portion and host portion of an IPv4 address decide whether a destination is local (preview of chapter 11)",
  "`question`: give the destination MAC for a packet to a remote server",
]

[[chapter.page]]
name = "09-check-yourself"
title = "Check yourself: protocols and models"
summary = "Mixed questions on message rules, protocol suites, standards, layers, PDUs and addressing."
teaches = [
  "Delivery options and timing terms by scenario",
  "TCP/IP protocols placed at their layer",
  "Standards bodies matched to standards",
  "OSI layer by function, and OSI to TCP/IP mapping",
  "PDU names and the order of encapsulation",
  "Source and destination MAC and IP for a packet crossing a router",
  "Four to six `recall` cards",
]

# ---------------------------------------------------------------------------
# Chapter 4: Physical layer (ITN module 4)
# ---------------------------------------------------------------------------
[[chapter]]
number = 4
title = "Physical layer"

[[chapter.page]]
name = "01-bits-on-the-wire"
title = "Getting bits onto the medium"
summary = "The physical layer turns a frame into electrical pulses, light or radio and back again."
teaches = [
  "Scene: a frame leaves a NIC as a stream of bits and must cross a cable or the air",
  "The physical layer accepts a complete frame from the data link layer and encodes it as signals on the medium",
  "Wired connections (a NIC with an RJ-45 port) and wireless connections (a wireless NIC talking to an AP)",
  "Physical layer standards come from engineering bodies: ISO, TIA/EIA, ITU, ANSI, IEEE, and national telecom regulators",
  "The three things physical standards define: physical components (cables, connectors, NICs), encoding, signaling",
  "Contrast with upper layers, whose protocols are written mostly by the IETF in software",
]

[[chapter.page]]
name = "02-encoding-signaling-bandwidth"
title = "Encoding, signaling and bandwidth"
summary = "Bits become patterns on the medium, and bandwidth says how many can cross each second."
teaches = [
  "*Encoding*: converting bits into a predefined code; Manchester encoding represents 0 and 1 as transitions in the middle of each bit period",
  "*Signaling*: how 1 and 0 appear on the medium: voltage on copper, pulses of light on fiber, radio waves for wireless",
  "*Bandwidth*: the capacity of a medium in bits per second; units bps, kbps, Mbps, Gbps, Tbps",
  "*Latency* (time for data to travel), *throughput* (actual bits per second achieved), *goodput* (usable data after overhead and retransmissions)",
  "Why throughput is usually lower than bandwidth: traffic volume, type of traffic, latency across devices",
  "Worked example: a 1 Gbps link carrying a 500 MB file, and why it takes longer than the arithmetic suggests",
  "`question` distinguishing bandwidth, throughput and goodput",
]

[[chapter.page]]
name = "03-copper-cabling"
title = "Copper cabling"
summary = "Copper is cheap and easy to install, but signals weaken with distance and pick up noise."
teaches = [
  "*Attenuation*: signals weaken with distance, which is why copper has strict length limits",
  "Interference: electromagnetic interference (EMI) and radio frequency interference (RFI) from motors and lights; *crosstalk* from neighboring wires",
  "Countermeasures: twisting pairs (cancellation), shielding, keeping within length limits, routing away from interference",
  "Unshielded twisted pair (UTP): the standard for Ethernet LANs",
  "Shielded twisted pair (STP): better noise protection, costlier, harder to install, must be grounded",
  "Coaxial cable: used for cable internet, satellite and antenna connections",
  "A comparison `table` of UTP, STP and coax",
  "Copper safety: electrical hazards and grounding",
]

[[chapter.page]]
name = "04-utp-cabling"
title = "UTP cables and wiring"
summary = "UTP has four twisted pairs, an RJ-45 plug and two wiring standards. Which pairs cross decides the cable type."
teaches = [
  "UTP construction: four color-coded pairs, different twist rates per pair, no shield; the 100 meter channel limit for Ethernet",
  "Categories in a `table`: Cat5e (1 Gbps), Cat6 (1 Gbps, 10 Gbps up to about 55 m), Cat6a (10 Gbps at 100 m)",
  "RJ-45 connector and jack; a bad termination (untwisted wires too long) causes errors",
  "T568A and T568B pinouts; most installations use T568B",
  "Straight-through (same standard both ends: host to switch, switch to router), crossover (T568A one end, T568B the other: legacy like-to-like links), rollover (console, Cisco proprietary)",
  "*Auto-MDIX*: modern ports detect the cable and swap pairs, so a straight-through cable works between like devices",
  "Cable testers check wire map, length and faults",
  "`question`: choose the cable type for a described connection",
]

[[chapter.page]]
name = "05-fiber-optic-cabling"
title = "Fiber-optic cabling"
summary = "Fiber carries light over glass, far and fast, and ignores electrical noise."
teaches = [
  "Fiber properties: light pulses through a glass core, immune to EMI and RFI, much longer distances and higher bandwidth than copper",
  "Cable parts: core, cladding, buffer, strengthening material, jacket",
  "Single-mode fiber (SMF): very small core (about 9 micrometers), laser light, one path, long distances (many kilometers)",
  "Multimode fiber (MMF): larger core (50 or 62.5 micrometers), LED or VCSEL light, many paths, dispersion limits it to a few hundred meters at high speeds",
  "SMF versus MMF comparison `table`",
  "Uses: enterprise backbones, fiber to the home, long-haul and submarine links",
  "Connectors: ST, SC, LC, and duplex LC; patch cord jacket colors (yellow for SMF, orange or aqua for MMF)",
  "Fiber versus copper `table`: bandwidth, distance, immunity, cost, installation skill, safety (look away from the light source)",
]

[[chapter.page]]
name = "06-wireless-media"
title = "Wireless media"
summary = "Wireless carries data by radio. It frees users from cables at the cost of range, interference and security concerns."
teaches = [
  "Wireless properties: coverage limited by walls and distance, interference from other devices on the same frequencies, security (anyone in range can receive), shared medium (one device talks at a time, half duplex)",
  "Standards: Wi-Fi (IEEE 802.11), Bluetooth (IEEE 802.15), WiMAX (IEEE 802.16), Zigbee (IEEE 802.15.4)",
  "WLAN components: wireless NIC, access point (AP), wireless router in a SOHO",
  "An AP connects wireless clients to the wired LAN; a wireless router combines an AP, a switch and a router",
  "Wi-Fi Alliance certifies interoperability",
  "`question` matching a standard to a use case",
]

[[chapter.page]]
name = "07-wi-fi-standards-and-channels"
title = "Wi-Fi standards and channels"
summary = "Each 802.11 generation uses certain bands and speeds. Channels that do not overlap avoid interference."
teaches = [
  "802.11 standards in a `table` with band and maximum data rate: 802.11a (5 GHz, 54 Mbps), 802.11b (2.4 GHz, 11 Mbps), 802.11g (2.4 GHz, 54 Mbps), 802.11n Wi-Fi 4 (2.4 and 5 GHz, up to 600 Mbps), 802.11ac Wi-Fi 5 (5 GHz, multi-gigabit), 802.11ax Wi-Fi 6 (2.4 and 5 GHz; Wi-Fi 6E adds 6 GHz)",
  "2.4 GHz has longer range but fewer channels and more interference; 5 GHz has more channels and higher speed but shorter range",
  "In the 2.4 GHz band only channels 1, 6 and 11 do not overlap (in North America), so neighboring APs use those",
  "5 GHz offers many more non-overlapping channels",
  "The *SSID* is the name of a wireless network that clients choose",
  "Encryption protects wireless traffic: WPA2 and WPA3 (details in the second book)",
  "`question`: pick channels for three neighboring 2.4 GHz APs",
]

[[chapter.page]]
name = "08-choosing-media-and-poe"
title = "Choosing media and Power over Ethernet"
summary = "Distance, noise, speed and cost decide the medium. PoE lets one cable carry both data and power."
teaches = [
  "Worked scenario: a small building with desks, an IP phone at each desk, a ceiling AP, and a link to a building 400 m away; pick UTP, fiber or wireless for each and explain why",
  "Decision factors: distance, environment (EMI), required bandwidth, cost, installation",
  "Power over Ethernet: the switch (power sourcing equipment) powers phones, APs and cameras over UTP",
  "PoE standards: 802.3af (up to 15.4 W per port), 802.3at PoE+ (up to 30 W), 802.3bt (up to 60 W and 90 W)",
  "A switch has a total PoE budget, so not every port can draw its maximum at once",
  "`question`: which medium for a described link",
]

[[chapter.page]]
name = "09-check-yourself"
title = "Check yourself: physical layer"
summary = "Mixed questions on signaling, bandwidth, copper, fiber and wireless."
teaches = [
  "Bandwidth, throughput, goodput and latency by scenario",
  "Attenuation, EMI and crosstalk and what reduces each",
  "Straight-through, crossover and rollover cable choice, and the role of auto-MDIX",
  "UTP category for a required speed and distance",
  "SMF versus MMF by distance and light source",
  "802.11 standard by band and speed; non-overlapping 2.4 GHz channels",
