  "A `console` of `show interfaces` with the counter lines highlighted",
  "Duplex mismatch symptoms: slow performance, late collisions on the half-duplex end, CRC errors and runts on the full-duplex end",
  "CDP reports mismatches with a `%CDP-4-DUPLEX_MISMATCH` log message",
