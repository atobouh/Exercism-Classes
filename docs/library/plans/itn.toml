teaches = [
  "UDP features: connectionless, no acknowledgments or retransmission, no reordering, no flow control",
  "`fields` block of the 8-byte UDP header: Source Port, Length, Destination Port, Checksum (16 bits each)",
  "Applications that use UDP: DNS, DHCP, TFTP, SNMP, syslog, VoIP and live video",
  "Why real-time traffic prefers UDP: a late retransmission is worse than a gap",
