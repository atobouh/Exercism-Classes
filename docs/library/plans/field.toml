  "R2 needs the same group number, version and virtual IP; only priority differs",
  "Hosts use the virtual IP as their default gateway, never a router's real interface IP",
  "Optional: `standby 1 timers 1 3` for faster failover, `standby 1 authentication md5 key-string` for authentication",
  "IPv6 HSRP in one line: `standby 2 ipv6 autoconfig` with HSRPv2",
