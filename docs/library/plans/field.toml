book = "field"

# ---------------------------------------------------------------------------
# Chapter 1
# ---------------------------------------------------------------------------

[[chapter]]
number = 1
title = "Learning networking well"

[[chapter.page]]
name = "01-understanding-over-memorizing"
title = "Understanding over memorizing"
summary = "Why learning how a network behaves lasts longer, and works better, than memorizing facts about it."
teaches = [
  "The difference between knowing a fact (HSRP hello is 3 seconds) and understanding a mechanism (why a standby router needs hellos at all)",
  "Facts worth memorizing are few: port numbers, defaults, timers, administrative distances; everything else should be derivable from how the protocol works",
  "Asking 'what problem does this solve?' and 'what breaks without it?' for every feature, with STP and DHCP as examples",
  "The three skills the reader is building: explain it, configure it, troubleshoot it, and why each needs the others",
  "How this companion book relates to the three course books: it goes deeper on topics they skip or only touch",
  "A plan for using each page: read, answer the questions, type the commands, then let the review cards bring it back",
  "Misconception: reading a page twice is not the same as being able to recall it; testing yourself is what makes it stick",
]

[[chapter.page]]
name = "02-follow-the-packet"
title = "Follow the packet"
summary = "One habit that explains most of networking: trace a single packet, hop by hop, and say what each device does to it."
teaches = [
  "The habit: for any scenario, pick one packet and walk it from sender to receiver, naming every decision on the way",
  "What the host decides first: is the destination on my subnet (compare with the mask) or do I send to my default gateway",
  "ARP before the first frame: the host resolves the gateway's MAC, not the remote host's MAC",
  "At each router the frame is rebuilt: new source and destination MAC, same source and destination IP, TTL decreases by 1",
  "At each switch the frame is unchanged: the switch learns the source MAC and forwards, floods or filters by destination MAC",
  "Using the OSI layers as a map of where a decision happens (L2 switch, L3 router, L4 firewall or ACL), not as a list to recite",
  "A worked walk: PC in VLAN 10 pings a server across one router, with a diagram and the MAC and IP pair on each link",
  "How this habit becomes a troubleshooting method later (chapter 14): the packet stops somewhere, and that place tells you the layer",
]

[[chapter.page]]
name = "03-building-a-practice-lab"
title = "Building a practice lab"
summary = "The options for practicing on real or simulated gear, what each does well, and what each gets wrong."
teaches = [
  "Why typing commands matters: configuration skill is muscle memory plus reading the device's reply",
  "Simulators (Packet Tracer): free, light, good for topology and basic config; supports a subset of IOS and some output differs from real devices",
  "Emulators running real IOS images (Cisco Modeling Labs, GNS3, EVE-NG): real output and features, need a capable computer and licensed images",
  "Physical gear (used Catalyst 2960 switches and ISR routers): real cabling, PoE and console work; costs space, power and noise",
  "What you need for physical gear: a console cable (RJ-45 rollover or USB console), a terminal program, 9600 baud 8-N-1 as the console default",
  "What no lab simulates well: real RF for wireless, large scale, and real user traffic; how to learn those from output and diagrams instead",
  "A table comparing the three lab types on cost, realism, wireless support and setup effort",
  "Lab hygiene: save a known-good config, use `write erase` and `reload` to reset, and keep notes of what you changed",
]

[[chapter.page]]
name = "04-spaced-review-and-active-recall"
title = "Spaced review and active recall"
summary = "How memory actually works for technical material, and how Octet's review cards use it."
teaches = [
  "Active recall: pulling an answer out of memory strengthens it far more than rereading the answer",
  "The spacing effect: reviews spread over days and weeks beat the same time spent in one sitting",
  "The forgetting curve in plain terms: each successful recall makes the next forgetting slower, so intervals can grow",
  "How Octet turns every question, command and recall card into a review card and schedules it again later",
  "Rating honestly: marking a card you hesitated on as known makes the schedule wrong",
  "Interleaving: mixing topics (subnetting, STP, ACLs) in one session builds the skill of choosing the right tool",
  "How much to review: short daily sessions beat long weekly ones",
  "Writing your own recall cards: one fact per card, a real question on the front, a short answer on the back",
]

[[chapter.page]]
name = "05-reading-command-output"
title = "Reading command output"
summary = "How to read a show command line by line, and where the important fields hide."
teaches = [
  "Reading `show interfaces` from the top: the two status words ('GigabitEthernet0/1 is up, line protocol is up'), then MTU, bandwidth, duplex and speed, then the counters",
  "The four status combinations and what each means: up/up, up/down, down/down, administratively down/down",
  "Reading `show ip interface brief`: the Status and Protocol columns, and 'unassigned' in the IP-Address column",
  "Reading a routing table entry: code, prefix/length, [administrative distance/metric], via next hop, age, exit interface, using `show ip route` output",
  "Reading `show vlan brief` and `show interfaces trunk` together to see which VLANs actually cross a link",
  "Counters that matter and those that are noise: input errors, CRC, output drops versus total packets",
  "Clearing counters with `clear counters` and watching them again to see whether a problem is current or historic",
  "Misconception: a show command shows state, while `show running-config` shows intent; a configured feature can still be down",
]

[[chapter.page]]
name = "06-finding-your-way-in-the-cli"
title = "Finding your way in the CLI"
summary = "Help, filters and error messages that make the IOS command line faster to use and easier to read."
teaches = [
  "Context help: `?` after a space lists the next words, `?` right after letters completes them, Tab completes a unique word",
  "The three common error messages and their meaning: '% Invalid input detected at '^' marker', '% Incomplete command', '% Ambiguous command'",
  "Output filters: `| include`, `| exclude`, `| begin`, `| section`, with `show running-config | section interface` and `show ip route | include 10.1`",
  "`terminal length 0` to stop paging, and Space, Enter and q at the --More-- prompt",
  "The `do` prefix to run show commands from configuration mode",
  "Command history: Up arrow, Ctrl-P, `show history`, and `terminal history size`",
  "Undoing a command with `no`, and resetting an interface to defaults with `default interface`",
  "Practice: command blocks for filtering the running config and finding one interface's settings",
]

[[chapter.page]]
name = "07-explaining-and-documenting"
title = "Explaining and documenting"
summary = "Drawing topologies and explaining ideas in your own words are learning tools, not chores."
teaches = [
  "The teach-back test: if you can explain an idea to a friend without notes, you understand it; where you stall shows the gap",
  "Drawing a physical topology (devices, cables, interface names) versus a logical topology (subnets, VLANs, routing domains)",
  "What to label on a diagram: interface names, IP subnets, VLAN IDs, and which device is the root bridge or default gateway",
  "Keeping study notes in your own words, built around problems and mechanisms rather than copied definitions",
  "Writing a short config template for a task you repeat (a new access port, an SSH setup) and checking each line's purpose",
  "Keeping a change log in a lab, which is the same habit that saves real networks",
  "Why diagrams and baselines matter later when troubleshooting: you can only spot 'different' if you know 'normal'",
]

[[chapter.page]]
name = "08-check-yourself"
title = "Check yourself: a study routine"
summary = "A worked weekly routine that combines reading, labs and review, followed by mixed questions on the chapter."
teaches = [
  "A sample week: new pages on three days, lab practice on two, daily short review sessions, and one mixed-topic day",
  "How to handle a hard topic such as STP elections: draw it, predict the result, then check it in a lab with `show spanning-tree`",
  "How to tell you are ready to move on: you can predict device output before running the command",
  "Mixed questions covering active recall, spacing, interface status combinations, CLI filters and following a packet",
  "Recall cards on the console defaults, the four interface states and what changes at each router hop",
]

# ---------------------------------------------------------------------------
# Chapter 2
# ---------------------------------------------------------------------------

[[chapter]]
number = 2
title = "Number fluency: binary, subnets and VLSM"

[[chapter.page]]
name = "01-why-number-fluency"
title = "Why number fluency matters"
summary = "Subnets, masks, wildcards and IPv6 all rest on a few number skills that become fast with practice."
teaches = [
  "Where numbers appear in daily networking: addressing plans, ACL wildcards, OSPF network statements, route summaries, IPv6 prefixes",
  "The goal is speed and accuracy without a calculator, built from understanding first and then repetition",
  "The powers of two from 2^0 to 2^16, with 2^8 = 256 and 2^10 = 1024 as anchors",
  "The eight bit values in an octet: 128, 64, 32, 16, 8, 4, 2, 1, and why they sum to 255",
  "The plan for the chapter: binary, hex, masks, network and broadcast, requirements, VLSM, wildcards, IPv6",
  "How the drill blocks work: endless generated practice, not graded, best in short daily bursts",
]

[[chapter.page]]
name = "02-binary-place-values"
title = "Binary place values"
summary = "Converting between decimal and binary octets quickly, in both directions."
teaches = [
  "Binary as place values: each position doubles, and a 1 means that value is included",
  "Binary to decimal: add the place values of the 1 bits, with 11000000 = 192 and 10101100 = 172 as worked examples",
  "Decimal to binary by subtraction: take the largest place value that fits, write 1, subtract, continue, with 200 = 11001000 worked step by step",
  "Patterns worth seeing at a glance: 255 is eight ones, 127 is 01111111, 128 is 10000000, even numbers end in 0",
  "Converting a full dotted-decimal IPv4 address to 32 bits, octet by octet",
  "Common slip: forgetting leading zeros, so 5 is 00000101, not 101, when an octet must be 8 bits",
  "A `drill` of binary conversions",
]

[[chapter.page]]
name = "03-hexadecimal"
title = "Hexadecimal"
summary = "Reading and converting hex, the shorthand for MAC addresses, IPv6 and many protocol fields."
teaches = [
  "Hex digits 0 to 9 and A to F (10 to 15), and that one hex digit is exactly four bits (a nibble)",
  "Hex to binary and back by nibbles: 0xAC = 1010 1100, 0x3F = 0011 1111",
  "Hex to decimal for one byte: first digit times 16 plus second digit, with 0xC0 = 192 and 0xFF = 255",
  "Where hex appears: MAC addresses (0050.7966.6800), IPv6 addresses, EtherType 0x0800 for IPv4 and 0x86DD for IPv6, the 0x8100 802.1Q tag",
  "Reading a MAC address: the first three bytes are the OUI, and the low-order bit of the first byte marks group (multicast) addresses",
  "A table of all 16 hex digits with their 4-bit binary and decimal values",
  "A `drill` of hex conversions",
]

[[chapter.page]]
name = "04-masks-and-prefixes"
title = "Masks and prefixes"
summary = "Moving between prefix length and dotted mask, and the nine values a mask octet can take."
teaches = [
  "A subnet mask is a run of 1 bits followed by 0 bits; the prefix length counts the 1 bits",
  "The nine valid mask octet values: 0, 128, 192, 224, 240, 248, 252, 254, 255, and how each comes from adding bit values",
  "Prefix to mask: /20 = 255.255.240.0, /27 = 255.255.255.224, worked by filling octets of eight",
  "Mask to prefix: count 8 per 255 octet, then the bits in the interesting octet",
  "Invalid masks such as 255.255.255.100 and 255.0.255.0, and why IOS rejects them",
  "A table of /8 through /32 with mask, block size in the interesting octet and addresses per subnet",
  "A `drill` of mask and prefix conversions",
]

[[chapter.page]]
name = "05-network-broadcast-and-range"
title = "Network, broadcast and host range"
summary = "Finding the subnet an address belongs to, its broadcast address and its usable hosts, in seconds."
teaches = [
  "The bitwise AND that a host performs: address AND mask gives the network address, shown in binary once",
  "The fast method: find the interesting octet, compute the block size (256 minus the mask octet), find the multiple of the block at or below the address",
  "Broadcast is the next network address minus one; first host is network plus one; last host is broadcast minus one",
  "Worked examples in different octets: 192.168.10.77/27, 172.16.45.200/20, 10.100.3.9/12",
  "Checking whether two addresses are on the same subnet, which is the host's local-or-remote decision",
  "Misconception: the network address is not always .0 and the broadcast is not always .255",
  "A `drill` of subnet calculations",
]

[[chapter.page]]
name = "06-subnetting-to-requirements"
title = "Subnetting to requirements"
summary = "Choosing a prefix from how many subnets or hosts you need, and counting what a prefix gives you."
teaches = [
  "Usable hosts per subnet = 2^h minus 2, where h is the number of host bits; the 2 are the network and broadcast addresses",
  "Number of subnets = 2^s, where s is the number of borrowed bits",
  "Choosing the prefix for a host requirement: smallest h with 2^h minus 2 at least the need, with 50 hosts giving /26 and 500 hosts giving /23",
  "Choosing the prefix for a subnet requirement: smallest s with 2^s at least the need, from a /24, a /16 and a /8",
  "Listing the subnets: start at the base network and add the block size each time",
  "Special cases: /31 for point-to-point links (RFC 3021, two usable addresses, supported on IOS) and /32 for loopbacks and host routes",
  "Planning for growth: leave room in host counts and in the number of subnets",
  "A `drill` of host and subnet counts",
]

[[chapter.page]]
name = "07-vlsm-step-by-step"
title = "VLSM step by step"
summary = "Carving one block into subnets of different sizes without overlap or waste."
teaches = [
  "Why VLSM: a /24 split into equal /26s wastes addresses on a two-host link",
  "The method: list requirements, sort largest first, assign each the smallest prefix that fits, start each at the next free address on its own boundary",
  "A full worked example from 192.168.50.0/24: LANs of 100, 50 and 20 hosts plus three point-to-point links, with a table of network, prefix, range and broadcast",
  "Why largest first: smaller blocks always fit on the boundaries left after larger ones, never the reverse",
  "Checking for overlap: each subnet must start on a multiple of its own block size",
  "Using /30 or /31 for links, and keeping link and loopback space at the end of the block",
  "Misconception: VLSM is a planning method; routers simply carry prefixes of any length, and classless routing protocols such as OSPF advertise the mask",
  "A `drill` of subnet calculations to rehearse boundaries",
]

[[chapter.page]]
name = "08-wildcard-masks"
title = "Wildcard masks"
summary = "The inverse masks used by ACLs and OSPF, and how to build one for a subnet or range."
teaches = [
  "A wildcard bit of 0 means 'must match', a 1 means 'ignore', the opposite of a subnet mask",
  "Wildcard for a subnet: 255.255.255.255 minus the mask, so /24 gives 0.0.0.255 and /27 gives 0.0.0.31",
  "The keywords: `host 10.1.1.1` equals 10.1.1.1 0.0.0.0, and `any` equals 0.0.0.0 255.255.255.255",
  "Matching a range that is a power of two on a boundary, such as 192.168.16.0 to 192.168.31.255 with 192.168.16.0 0.0.15.255",
  "Where wildcards appear: `access-list 10 permit 192.168.10.0 0.0.0.255` and `network 10.1.1.0 0.0.0.255 area 0`",
  "Misconception: a range that does not start on a block boundary cannot be matched by one wildcard and needs several entries",
  "Non-contiguous wildcards exist (for example matching odd addresses) but are rarely used; recognise them, do not build plans on them",
  "A `drill` of wildcard masks",
]

[[chapter.page]]
name = "09-ipv6-shortening-and-subnets"
title = "IPv6 shortening and subnets"
summary = "Writing IPv6 addresses in their shortest correct form and splitting a /48 into /64 subnets."
teaches = [
  "An IPv6 address is 128 bits written as eight 16-bit hextets in hex",
  "Rule 1: drop leading zeros in each hextet (0db8 becomes db8, 0000 becomes 0)",
  "Rule 2: replace one run of all-zero hextets with ::, and only once in an address",
  "The preferred form (RFC 5952): lowercase, shorten the longest zero run, take the leftmost on a tie, do not use :: for a single zero hextet",
  "Expanding a shortened address back to full form by counting the missing hextets",
  "Subnetting on hextet boundaries: a /48 site with a 16-bit subnet ID gives 65,536 /64 subnets, such as 2001:db8:acad:1::/64 to 2001:db8:acad:ffff::/64",
  "Why /64 is the normal LAN prefix: SLAAC and EUI-64 need a 64-bit interface ID",
  "A `drill` of IPv6 shortening",
]

[[chapter.page]]
name = "10-check-yourself"
title = "Check yourself: numbers under time"
summary = "Mixed practice across every skill in the chapter, and a routine to keep them fast."
teaches = [
  "A short daily routine: two minutes each of binary, mask, subnet and wildcard drills",
  "Common error patterns and how to catch them: wrong interesting octet, block size off by one, network and broadcast swapped",
  "Sanity checks: the network address is even in its block, the broadcast is odd, host counts are 2 less than a power of two",
  "Mixed questions: find the subnet for a host, pick a prefix for a requirement, write a wildcard, shorten an IPv6 address",
  "All seven drill kinds on one page: `binary`, `hex`, `mask`, `wildcard`, `subnet`, `hosts`, `ipv6`",
  "Recall cards on the nine mask values, the host formula and the IPv6 shortening rules",
]

# ---------------------------------------------------------------------------
# Chapter 3
# ---------------------------------------------------------------------------

[[chapter]]
number = 3
title = "Rapid PVST+ and the spanning tree guards"

[[chapter.page]]
name = "01-why-rapid-spanning-tree"
title = "Why rapid spanning tree"
summary = "Classic STP takes up to 50 seconds to recover; RSTP does it in about a second, and Rapid PVST+ runs it per VLAN."
teaches = [
  "The picture: a redundant switch triangle, a link fails, and users wait while 802.1D reconverges",
  "802.1D timers and their cost: hello 2 s, max age 20 s, forward delay 15 s, so 30 to 50 seconds to forward again",
  "RSTP (802.1w) replaces timer-based waiting with a handshake between neighbors, so convergence is usually under a few seconds",
  "The STP family on Cisco switches: PVST+ (802.1D per VLAN), Rapid PVST+ (802.1w per VLAN), MST (802.1s, groups of VLANs per instance)",
  "Defaults: PVST+ is the default mode on Catalyst 2960; Catalyst 9000 switches running IOS XE default to Rapid PVST+",
  "RSTP is backward compatible: a port that hears 802.1D BPDUs falls back to 802.1D behavior on that link",
  "The four guards this chapter adds (BPDU guard, BPDU filter, root guard, loop guard) and the failure each prevents, as a preview",
]

[[chapter.page]]
name = "02-bridge-id-and-root-election"
title = "Bridge ID and the root election"
summary = "How the lowest bridge ID wins, what the extended system ID adds, and how to choose the root yourself."
teaches = [
  "Bridge ID = priority (4 bits) + extended system ID (12 bits, the VLAN number) + MAC address (48 bits)",
  "Default priority 32768, so VLAN 10 shows 32778 in `show spanning-tree vlan 10`; priority can only be set in multiples of 4096",
  "Lowest bridge ID wins: lowest priority first, then lowest MAC; with all defaults the oldest switch (lowest MAC) often wins, which is rarely what you want",
  "`spanning-tree vlan 10 root primary`: sets priority to 24576, or to 4096 below the current root if that is already 24576 or lower; it is a one-time macro, not a permanent rule",
  "`spanning-tree vlan 10 root secondary` sets 28672; `spanning-tree vlan 10 priority 4096` sets an exact value",
  "Reading the Root ID and Bridge ID sections of `show spanning-tree vlan 10`, including 'This bridge is the root'",
  "A worked election with three switches and their priorities and MACs",
  "Per-VLAN roots for load sharing: S1 root for VLANs 10 and 30, S2 root for VLANs 20 and 40",
]

[[chapter.page]]
name = "03-port-roles"
title = "Port roles"
summary = "Root, designated, alternate and backup ports, and the tie-breakers that decide each one."
teaches = [
  "RSTP port roles: root port (best path to root), designated port (best port on a segment toward it), alternate port (backup path to root), backup port (redundant port on a shared segment), disabled",
  "Root port selection order: lowest root path cost, then lowest sender bridge ID, then lowest sender port priority, then lowest sender port number",
  "Port costs, short method: 10 Mb/s 100, 100 Mb/s 19, 1 Gb/s 4, 10 Gb/s 2; long method: 2,000,000, 200,000, 20,000, 2,000",
  "`spanning-tree pathcost method long` and checking the method with `show spanning-tree summary`; defaults differ by platform and release, so check rather than assume",
  "Designated port selection on each segment: lowest root path cost of the switch, then lowest bridge ID",
  "Every port on the root bridge is designated; every non-root switch has exactly one root port per VLAN",
  "Adjusting the result with `spanning-tree vlan 10 cost 10` and `spanning-tree vlan 10 port-priority 64` (port priority in steps of 16, default 128)",
  "A worked three-switch diagram labeling every port's role, with a `question` asking which port becomes alternate",
]

[[chapter.page]]
name = "04-port-states-and-convergence"
title = "Port states and rapid convergence"
summary = "Discarding, learning and forwarding, and the proposal and agreement handshake that makes RSTP fast."
teaches = [
  "RSTP states: discarding, learning, forwarding; 802.1D blocking, listening and disabled all map to discarding",
  "A table mapping 802.1D states to RSTP states, with whether each learns MACs and forwards frames",
  "Link types: point-to-point (full duplex, assumed for switch links), shared (half duplex), and edge (an end device, configured with PortFast)",
  "The proposal and agreement handshake on point-to-point links: the upstream switch proposes, the downstream switch syncs (blocks its other non-edge designated ports) and agrees, then both forward",
  "Why the handshake needs point-to-point links: on shared links RSTP falls back to timers",
  "In RSTP every switch sends BPDUs every hello (2 s); three missed hellos (6 s) mean the neighbor is gone",
  "An alternate port becomes root port immediately when the root port fails, without waiting",
  "Topology changes: only non-edge ports moving to forwarding cause a TC, and switches flush learned MACs on affected ports",
]

[[chapter.page]]
name = "05-configuring-rapid-pvst"
title = "Configuring and verifying Rapid PVST+"
summary = "Turning on Rapid PVST+, placing the root, tuning ports and reading the output."
teaches = [
  "`spanning-tree mode rapid-pvst` in global configuration, and that changing modes briefly disrupts forwarding",
  "Setting root and secondary per VLAN: `spanning-tree vlan 10,20 root primary` on S1 and `spanning-tree vlan 10,20 root secondary` on S2",
  "`spanning-tree link-type point-to-point` to force the link type when a port is half duplex but really point-to-point",
  "Reading `show spanning-tree vlan 10`: 'Spanning tree enabled protocol rstp', the Role and Sts columns (Root FWD, Desg FWD, Altn BLK), and the Type column (P2p, P2p Edge, Shr)",
  "Why the output still says BLK for a discarding alternate port",
  "`show spanning-tree summary` for the mode, root bridge VLANs and which guards are enabled globally",
  "`show spanning-tree interface g0/1 detail` for one port across all VLANs",
  "A `command` block for setting the mode and one for making a switch root primary",
]

[[chapter.page]]
name = "06-portfast-and-bpdu-guard"
title = "PortFast and BPDU guard"
summary = "Letting access ports forward at once, and shutting them down if a switch appears there."
teaches = [
  "PortFast makes a port an edge port: it goes straight to forwarding and does not cause topology changes",
  "`spanning-tree portfast` on an interface, `spanning-tree portfast default` globally (applies to access ports only), and `spanning-tree portfast trunk` for a trunk to a server or AP",
  "Platform difference in one sentence: some IOS releases use `spanning-tree portfast edge` and `spanning-tree portfast edge default`",
  "The risk: a PortFast port connected to a switch can create a loop before STP reacts",
  "BPDU guard: `spanning-tree bpduguard enable` per interface, or `spanning-tree portfast bpduguard default` globally (applies only to PortFast ports)",
  "What happens when a BPDU arrives: the port goes err-disabled, with a %SPANTREE-2-BLOCK_BPDUGUARD log message",
  "Finding and recovering err-disabled ports: `show interfaces status err-disabled`, then `shutdown` and `no shutdown`, or `errdisable recovery cause bpduguard` with a default interval of 300 seconds",
  "A `console` showing the log message and the err-disabled status",
]

[[chapter.page]]
name = "07-bpdu-filter"
title = "BPDU filter"
summary = "Stopping BPDUs on edge ports, and why the interface form can quietly remove loop protection."
teaches = [
  "Purpose: stop sending BPDUs out of edge ports to hosts that never need them",
  "Global form `spanning-tree portfast bpdufilter default`: PortFast ports send a few BPDUs at link-up, then stop; if a BPDU arrives the port loses PortFast and filtering and runs normal STP",
  "Interface form `spanning-tree bpdufilter enable`: the port neither sends nor processes received BPDUs, which effectively turns STP off on that port",
  "Why the interface form is dangerous: two such ports cabled into a loop will forward a broadcast storm",
  "If BPDU filter and BPDU guard are both on one interface, the filter wins and the guard never triggers",
  "A table comparing global and interface BPDU filter: scope, sends BPDUs, reacts to received BPDUs, risk",
  "Verifying with `show spanning-tree summary` (BPDU filter default line) and `show spanning-tree interface g0/5 detail`",
]

[[chapter.page]]
name = "08-root-guard-and-loop-guard"
title = "Root guard and loop guard"
summary = "Keeping the root where you placed it, and keeping a silent link from turning into a loop."
teaches = [
  "Root guard: `spanning-tree guard root` on designated ports where a better root must never appear, such as distribution downlinks to access switches",
  "Root guard action: a superior BPDU puts the port in root-inconsistent state (discarding); it recovers by itself when the superior BPDUs stop",
  "The %SPANTREE-2-ROOTGUARD_BLOCK message and `show spanning-tree inconsistentports`",
  "Loop guard: protects root and alternate ports that stop receiving BPDUs, for example on a unidirectional fiber link",
  "Without loop guard a port that stops hearing BPDUs becomes designated and forwards, creating a loop; with it the port goes loop-inconsistent and stays discarding until BPDUs return",
  "`spanning-tree guard loop` per interface or `spanning-tree loopguard default` globally (applies to point-to-point links)",
  "Root guard and loop guard cannot be enabled on the same port",
  "UDLD as a related tool for detecting one-way links, mentioned as going deeper",
]

[[chapter.page]]
name = "09-guards-in-a-design"
title = "Guards in a design"
summary = "Where each guard belongs in a campus, and a walk-through of the three failures they report."
teaches = [
  "A summary table of PortFast, BPDU guard, BPDU filter, root guard and loop guard: where applied, what triggers it, the resulting state, how it recovers",
  "A campus design: access ports with PortFast and BPDU guard, distribution downlinks with root guard, uplinks and alternate paths with loop guard",
  "A diagram of a distribution pair and two access switches with each guard labeled at its port",
  "Walk-through 1: a user plugs a small switch into a wall port, the port goes err-disabled; how you find it and fix it",
