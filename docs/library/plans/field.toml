teaches = [
  "Roles: one active router forwards for the virtual IP, one standby is ready, any others listen",
  "Election: highest priority wins (default 100, range 0 to 255); on a tie the highest interface IP wins",
  "Timers: hello every 3 seconds, hold time 10 seconds",
  "States in order: initial, learn, listen, speak, standby, active",
  "HSRPv1: multicast 224.0.0.2, UDP 1985, groups 0 to 255, virtual MAC 0000.0c07.acXX where XX is the group in hex",
  "HSRPv2: multicast 224.0.0.102, groups 0 to 4095, virtual MAC 0000.0c9f.fXXX, millisecond timers and IPv6 support",
  "Preemption is off by default, so a higher-priority router that comes back does not take over unless configured",
  "Gratuitous ARP from the new active router updates switch MAC tables after a failover",
]

[[chapter.page]]
name = "03-configuring-hsrp"
title = "Configuring HSRP"
