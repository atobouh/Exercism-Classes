[[chapter]]
number = 6
title = "First hop redundancy in practice"

[[chapter.page]]
name = "01-the-gateway-problem"
title = "The gateway problem"
summary = "Hosts trust one default gateway; FHRPs let two routers share one virtual gateway so a failure goes unnoticed."
teaches = [
  "The picture: 200 PCs with gateway 192.168.10.1; that router fails and every PC loses the internet although a second router is right there",
  "Why hosts cannot fix it themselves: the default gateway is a single static or DHCP-given address",
  "The FHRP idea: a virtual IP and a virtual MAC shared by a group of routers; one answers, the others stand by",
  "Failover from the host's point of view: same gateway IP, same MAC in its ARP cache, so nothing changes on the host",
  "The three protocols: HSRP (Cisco), VRRP (open standard), GLBP (Cisco, load balancing), as a preview table",
