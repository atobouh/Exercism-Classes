book = "ensa"

# ---------------------------------------------------------------------------
# Chapter 1: Single-area OSPFv2 concepts (ENSA module 1: 1.1 to 1.3)
# ---------------------------------------------------------------------------

[[chapter]]
number = 1
title = "Single-area OSPFv2 concepts"

[[chapter.page]]
name = "01-why-link-state"
title = "Why routers need a map"
summary = "Static routes and distance vector protocols stop scaling; a link-state protocol gives every router the same map of the network."
teaches = [
  "Open with a picture: five routers, a link fails, and every static route that used it has to be fixed by hand",
  "Distance vector (routing by rumor: 'network X is 3 hops that way') versus link state (every router holds the full topology and computes its own paths)",
  "OSPF (Open Shortest Path First) is an open standard link-state IGP; OSPFv2 is for IPv4 (RFC 2328), OSPFv3 is for IPv6",
  "The SPF idea in one sentence: each router runs Dijkstra's shortest path first algorithm over the same database and puts itself at the root of the tree",
  "Where OSPF fits among the protocols the reader knows: static routes, RIP, EIGRP, OSPF, BGP (interior versus exterior gateway protocols)",
  "Administrative distance of OSPF is 110, compared with connected 0, static 1, EIGRP 90, RIP 120",
  "A map of the chapter: features, the three databases, the five-step operation, packets, neighbor states, DR/BDR",
  "Recall cards: OSPF AD, OSPFv2 versus OSPFv3, what link state means",
]

[[chapter.page]]
name = "02-ospf-features"
title = "What OSPF brings"
summary = "Fast convergence, a cost metric, areas and authentication: the features that make OSPF the common choice inside an enterprise."
teaches = [
  "Link-state routing with triggered updates: OSPF floods changes when they happen instead of sending the whole table on a timer",
  "Classless: every route carries its mask, so VLSM and discontiguous networks work",
  "Efficient: SPF is rerun only after a change, and updates go to multicast 224.0.0.5 (all OSPF routers) and 224.0.0.6 (DR and BDR) instead of broadcast",
  "OSPF runs directly over IP as protocol number 89, not over TCP or UDP",
  "Metric is cost, derived from bandwidth, cumulative along the path; lower is better (the formula is taught in chapter 2)",
  "Scalable through areas; the backbone is area 0; equal-cost load balancing up to 4 paths by default",
  "Secure: OSPF supports neighbor authentication (MD5 and SHA) so a rogue router cannot inject routes",
  "Misconception: OSPF does not count hops, and a 'shorter' path in hops can lose to a longer path with faster links",
  "A `question` on picking the OSPF route from a routing table with AD 110 entries next to static routes",
]

[[chapter.page]]
name = "03-ospf-components"
title = "The three OSPF databases"
summary = "Every OSPF router keeps a neighbor table, a link-state database and a routing table, built from routing protocol messages by the SPF algorithm."
teaches = [
  "The three components: routing protocol messages, data structures, and the SPF algorithm",
  "Adjacency database = neighbor table, seen with `show ip ospf neighbor`",
  "Link-state database (LSDB) = topology table, seen with `show ip ospf database`; identical on every router in an area",
  "Forwarding database = routing table, seen with `show ip route` (routes marked O)",
  "Table comparing the three: name, what it holds, the show command, whether it is identical on all routers in the area",
  "The SPF algorithm builds a shortest path tree with the local router as root, using cumulative cost",
  "A small `diagram` of four routers with link costs and a worked SPF result for one router",
  "Misconception: the LSDB is the same everywhere in the area, but each router's routing table is different because each is the root of its own tree",
]

[[chapter.page]]
name = "04-link-state-operation"
title = "How OSPF reaches convergence"
summary = "Five steps take a router from power-on to a full routing table: meet neighbors, swap link states, build the database, run SPF, install routes."
teaches = [
  "Step 1, establish neighbor adjacencies: Hellos discover routers on each link",
  "Step 2, exchange link-state advertisements (LSAs): each router describes its links (state, cost, neighbors) and floods them",
  "Step 3, build the LSDB from the LSAs received; every router in the area ends up with the same database",
  "Step 4, run the SPF algorithm to build the SPF tree",
  "Step 5, choose the best routes and install them in the routing table",
  "What a link-state advertisement says about a link: the interface, its address and mask, its cost, its neighbors",
  "What happens on a change: an LSA is flooded, every router updates its LSDB and reruns SPF; convergence is fast and loop-free",
  "LSAs are refreshed every 30 minutes even without change (LSRefreshTime); routers do not resend the whole table periodically",
  "A `question` that orders the five steps",
]

[[chapter.page]]
name = "05-single-and-multiarea"
title = "One area or many"
summary = "Areas keep the database small; this book stays in one area, but you need to know why multiarea OSPF exists and what OSPFv3 is."
teaches = [
  "Single-area OSPF: every router in area 0, one LSDB, simple to design and the CCNA focus",
  "Multiarea OSPF: a two-level hierarchy where every area connects to the backbone area 0",
  "The Area Border Router (ABR) sits between areas and holds one LSDB per attached area",
  "Benefits of multiarea: smaller routing tables (summaries), less LSA flooding, SPF reruns only inside the affected area",
  "Why it matters: SPF cost grows with the size of the database, so a change in a huge single area makes every router recompute",
  "A `diagram` of area 0 with two other areas joined by ABRs",
  "OSPFv3 in brief: the same link-state ideas for IPv6, its own process, uses the link-local address as the source and FF02::5 / FF02::6 as multicast groups; still uses a 32-bit router ID",
  "Misconception: an area is not a subnet; one area holds many subnets",
]

[[chapter.page]]
name = "06-ospf-packets"
title = "The five OSPF packet types"
summary = "Hello, DBD, LSR, LSU and LSAck: each OSPF packet type has one job in building and maintaining adjacencies."
teaches = [
  "Type 1 Hello: discovers neighbors, builds and keeps adjacencies, elects the DR and BDR",
  "Type 2 Database Description (DBD): a list of LSA headers, used to compare databases",
  "Type 3 Link-State Request (LSR): asks for the full LSA a router is missing",
  "Type 4 Link-State Update (LSU): carries one or more full LSAs; the term LSU and LSA are not the same thing",
  "Type 5 Link-State Acknowledgment (LSAck): confirms an LSU arrived, making flooding reliable",
  "A `table` of the five types: number, name, purpose",
  "Encapsulation: OSPF packet inside an IPv4 packet with protocol 89, multicast destination, inside an Ethernet frame with MAC 01-00-5E-00-00-05 or 01-00-5E-00-00-06",
  "A `fields` block for the OSPF common header essentials: version, type, packet length, router ID, area ID, checksum, authentication",
  "A `question` matching a packet type to the job it does",
]

[[chapter.page]]
name = "07-hello-packet"
title = "Inside the Hello packet"
summary = "The Hello carries the values two routers must agree on before they become neighbors."
teaches = [
  "Hello fields: router ID, area ID, network mask, hello interval, router priority, dead interval, DR, BDR, list of neighbors",
  "A `fields` block of the Hello packet body",
  "Default timers: hello 10 seconds and dead 40 seconds on broadcast and point-to-point links; 30 and 120 on NBMA links",
  "The dead interval is four times the hello interval by default; if no Hello arrives within it, the neighbor is declared down",
  "Must match to become neighbors: area ID, hello and dead intervals, subnet and mask on the link, authentication, and stub area flag",
  "Must be unique: the router ID; a duplicate RID breaks the adjacency",
  "Router priority (default 1, range 0 to 255) is carried here and is used in the DR/BDR election",
  "The neighbor list: a router sees its own RID in a neighbor's Hello, which is how it knows two-way communication exists",
  "A `question` on which mismatch stops two routers forming an adjacency",
]

[[chapter.page]]
name = "08-neighbor-states"
title = "From Down to Full"
summary = "Two OSPF routers pass through seven states as they meet, swap database summaries, and fill in what is missing."
teaches = [
  "The states in order: Down, Init, Two-Way, ExStart, Exchange, Loading, Full",
  "Down to Init: a Hello arrives but does not list this router yet",
  "Init to Two-Way: the router sees its own RID in the neighbor's Hello; on multiaccess links the DR/BDR election happens here",
  "ExStart: the two routers pick master and slave; the router with the higher router ID is master and starts the DBD exchange",
  "Exchange: DBD packets carrying LSA headers are swapped and compared",
  "Loading: LSRs ask for missing LSAs, LSUs deliver them, LSAcks confirm",
  "Full: the databases are synchronized; Hellos keep the adjacency alive",
  "Two-Way is a normal final state between two DROTHERs on a multiaccess link; it is not a fault",
  "A troubleshooting hint: neighbors stuck in ExStart or Exchange usually point to an MTU mismatch",
  "A `question` ordering states and a `recall` card on which router is master",
]

[[chapter.page]]
name = "09-dr-and-bdr"
title = "Designated routers on a shared link"
summary = "On an Ethernet segment with many routers, one designated router collects and redistributes updates so not every pair needs an adjacency."
teaches = [
  "The problem: on a multiaccess segment, n routers would need n(n-1)/2 full adjacencies; 5 routers need 10, 10 routers need 45",
  "LSA flooding on a segment without a DR: every router floods to every other, multiplying traffic",
  "The designated router (DR) and backup designated router (BDR); all other routers are DROTHERs",
  "DROTHERs send updates to 224.0.0.6 (DR and BDR); the DR sends updates to 224.0.0.5 (all OSPF routers)",
  "DROTHERs form Full adjacencies only with the DR and BDR, and stay in Two-Way with each other",
  "Election rule: highest interface priority wins; on a tie, highest router ID; priority 0 means never DR or BDR",
  "The election is not preemptive: a new router with a higher priority does not take over until the DR fails or the process is reset",
  "When the DR fails, the BDR is promoted and a new BDR is elected",
  "Point-to-point links have no DR or BDR",
  "A `diagram` of four routers on one switch with DR, BDR and DROTHER labels, and a `question` to predict the DR",
]

[[chapter.page]]
name = "10-check-yourself"
title = "Check yourself: OSPF concepts"
summary = "Mixed questions and recall cards on OSPF features, databases, packets, states and the DR election."
teaches = [
  "A short scenario: three routers on one Ethernet segment and one point-to-point link; the reader predicts DR, BDR, neighbor states and which packets fly",
  "Questions mixing packet types with their jobs (Hello, DBD, LSR, LSU, LSAck)",
  "Questions on Hello parameters that must match and the default timers 10 and 40",
  "A question on ordering the neighbor states and identifying the normal Two-Way case",
  "A DR election question with priorities and router IDs, including a priority 0 router",
  "A question on which of the three databases is identical across the area",
  "Recall cards: AD 110, protocol 89, 224.0.0.5 versus 224.0.0.6, area 0 is the backbone",
]

# ---------------------------------------------------------------------------
# Chapter 2: Single-area OSPFv2 configuration (ENSA module 2: 2.1 to 2.6)
# ---------------------------------------------------------------------------

[[chapter]]
number = 2
title = "Single-area OSPFv2 configuration"

[[chapter.page]]
name = "01-the-reference-topology"
title = "Three routers, one area"
summary = "The topology used through this chapter, and the one command that starts OSPF on a router."
teaches = [
  "A `diagram`: R1, R2, R3 in a triangle of point-to-point Ethernet links (10.1.1.0/30 style), each with a LAN and a loopback, plus a shared LAN segment for the DR pages",
  "`router ospf process-id` in global configuration; the process ID (1 to 65535) is locally significant and does not need to match between routers",
  "The prompt changes to `R1(config-router)#`",
  "The configuration plan for the chapter: router ID, which interfaces join, passive LANs, costs, default route",
  "Two ways to enable OSPF on an interface: `network` statements under the process, or `ip ospf process-id area area-id` on the interface",
  "A `command` asking the reader to start OSPF process 10",
  "Misconception: two routers with different process IDs can still become neighbors; the area ID is what must match",
]

[[chapter.page]]
name = "02-router-id"
title = "The OSPF router ID"
summary = "A 32-bit name for each router, chosen by a fixed order of rules, that OSPF uses in every packet and election."
teaches = [
  "The router ID (RID) is a 32-bit value written like an IPv4 address; it identifies the router in the LSDB and breaks DR/BDR ties",
  "Order of choice: 1) `router-id` command, 2) highest IPv4 address on an up loopback, 3) highest IPv4 address on an active physical interface",
  "The interface does not need to run OSPF to supply the RID",
  "Configuring it: `R1(config-router)# router-id 1.1.1.1`",
  "Changing the RID after OSPF has started needs `clear ip ospf process` (or a reload) to take effect; IOS warns with a message about reload or `clear ip ospf process`",
  "Verify with `show ip protocols` (Router ID line) and `show ip ospf`",
  "Best practice: set the RID explicitly so it never changes when an interface goes down",
  "Duplicate RIDs in an area break adjacencies and produce log messages",
  "A `command` to set the RID and a `question` that applies the order of precedence to a router with two loopbacks",
]

[[chapter.page]]
name = "03-network-command"
title = "Choosing interfaces with network statements"
summary = "The network command uses a wildcard mask to pick which interfaces run OSPF and which area they join."
teaches = [
  "Syntax: `network network-address wildcard-mask area area-id` in router configuration mode",
  "The wildcard mask as the inverse of the subnet mask: /24 becomes 0.0.0.255, /30 becomes 0.0.0.3 (255.255.255.255 minus the mask)",
  "Any interface whose address falls in the matched range starts sending Hellos and has its network advertised",
  "Precise matching: `network 10.1.1.5 0.0.0.0 area 0` matches exactly one interface address",
  "Broad matching: `network 0.0.0.0 255.255.255.255 area 0` enables OSPF on every interface, and why that is risky",
  "The interface method: `R1(config-if)# ip ospf 10 area 0`, and that it overrides network statements",
  "Verify with `show ip protocols` (Routing for Networks section) and `show ip ospf interface brief`",
  "A `command` writing a network statement for a /30 link, and a `drill` of kind `wildcard`",
]

[[chapter.page]]
name = "04-passive-interfaces"
title = "Passive interfaces"
summary = "Stop Hellos on LAN ports where no router lives, while still advertising the LAN."
teaches = [
  "The problem: OSPF sends Hellos out every enabled interface, including PC LANs, wasting bandwidth and CPU and letting a rogue device try to form an adjacency",
  "`passive-interface g0/0/1` in router configuration mode stops Hellos and adjacencies on that interface",
  "The network on a passive interface is still advertised to OSPF neighbors",
  "`passive-interface default` followed by `no passive-interface g0/0/0` for routers with many LAN ports",
  "Loopbacks are effectively passive; they never form adjacencies",
  "Verify with `show ip protocols` (Passive Interface(s) list) and `show ip ospf interface` ('No Hellos (Passive interface)')",
  "Trap: making a router-facing link passive breaks the adjacency on it",
  "A `command` to make a LAN interface passive",
]

[[chapter.page]]
name = "05-point-to-point-networks"
title = "Point-to-point links and loopbacks"
summary = "Tell OSPF a two-router Ethernet link is point-to-point to skip the DR election, and make loopbacks advertise their real mask."
teaches = [
  "OSPF network types: broadcast multiaccess (Ethernet default), point-to-point (serial default), loopback, NBMA",
  "On an Ethernet link with only two routers, the default broadcast type still elects a DR and BDR, which only adds delay",
  "`ip ospf network point-to-point` on both ends removes the election; `show ip ospf neighbor` then shows `FULL/  -`",
  "The network type must match on both ends or routes and adjacencies misbehave",
  "Loopbacks are advertised as /32 host routes by default (network type LOOPBACK)",
  "`ip ospf network point-to-point` on a loopback makes OSPF advertise its configured mask, such as /24",
  "Verify with `show ip ospf interface g0/0/0` (Network Type POINT_TO_POINT) in a `console` block",
  "A `command` to set the network type on an interface",
]

[[chapter.page]]
name = "06-dr-bdr-in-practice"
title = "Controlling the DR election"
summary = "Read the election result in show commands and change it with interface priority."
teaches = [
  "Use a four-router shared LAN `diagram`; routers R1 to R4 on one switch",
  "`show ip ospf interface g0/0/0` output: State DR / BDR / DROTHER, Priority, Designated Router ID, Backup Designated router ID, Neighbor Count, Adjacent neighbor count",
  "`show ip ospf neighbor` columns: Neighbor ID, Pri, State, Dead Time, Address, Interface; states such as FULL/DR, FULL/BDR, 2WAY/DROTHER",
  "`ip ospf priority 255` to make a router DR; `ip ospf priority 0` to keep it from ever being DR or BDR",
  "Priority is set per interface, so one router can be DR on one segment and DROTHER on another",
  "The election is not preemptive: after changing priorities, `clear ip ospf process` on the routers (or interfaces bounced) forces a new election",
  "Without priority changes, the highest RID wins, so the RID choice influences the DR",
  "A `question` predicting the DR after priorities change but before the process is cleared",
]

[[chapter.page]]
name = "07-cost-and-reference-bandwidth"
title = "OSPF cost and reference bandwidth"
summary = "OSPF cost is reference bandwidth divided by interface bandwidth, and the default reference makes every link faster than 100 Mbps look the same."
teaches = [
  "Cost = reference bandwidth / interface bandwidth, with a default reference of 100 Mbps (10^8 bps)",
  "Default costs table: 10 Gbps 1, 1 Gbps 1, 100 Mbps 1, 10 Mbps 10, T1 1.544 Mbps 64; cost is a whole number and never below 1",
  "The route cost is the sum of outgoing interface costs along the path, counted from the router toward the destination",
  "`auto-cost reference-bandwidth 10000` (value in Mbps) makes 10 Gbps cost 1, 1 Gbps cost 10, 100 Mbps cost 100; set it on every router in the area",
  "`bandwidth` (in kbps) on an interface changes the cost calculation but not the real link speed",
  "`ip ospf cost value` sets the cost directly and overrides the calculation",
  "Equal-cost load balancing: OSPF installs up to 4 equal-cost paths by default; `maximum-paths` changes this",
  "Verify in `show ip ospf interface` (Cost line), `show ip ospf interface brief` (Cost column) and `show ip route` [110/cost]",
  "A worked example computing the best path through the triangle topology, and a `question` on cost after changing the reference bandwidth",
]

[[chapter.page]]
name = "08-hello-and-dead-timers"
title = "Hello and dead intervals"
summary = "Tune how fast OSPF notices a dead neighbor, and why mismatched timers silently stop an adjacency."
teaches = [
  "Defaults: hello 10 seconds, dead 40 seconds on Ethernet and point-to-point",
  "`ip ospf hello-interval seconds` and `ip ospf dead-interval seconds` on the interface",
  "Changing the hello interval also changes the dead interval to four times the new hello, unless the dead interval was set by hand",
  "Timers must match on both ends of a link; a mismatch stops the adjacency forming and the neighbor disappears after the dead interval",
  "Read 'Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5' in `show ip ospf interface`",
  "The Dead Time column in `show ip ospf neighbor` counting down and resetting with each Hello",
  "Trade-off: shorter timers detect failure faster but add overhead",
  "A `command` to set the hello interval and a `question` on what happens when only one side is changed",
]

[[chapter.page]]
name = "09-default-route-propagation"
title = "Sharing a default route"
summary = "The edge router learns the way out to the internet, and OSPF hands that default route to every other router."
teaches = [
  "Use a `diagram` with R2 as the edge router connected to an ISP",
  "On the edge router, a static default route: `ip route 0.0.0.0 0.0.0.0 next-hop-or-exit-interface`",
  "`default-information originate` under `router ospf` advertises that default into OSPF",
  "On other routers the route appears as `O*E2 0.0.0.0/0 [110/1] via ...` and sets the Gateway of last resort",
  "What E2 means: an external route whose metric does not grow as it crosses the area (default metric 1)",
  "Without a default route in its own table the edge router does not advertise one (unless `always` is added)",
  "Verify with `show ip route` on the edge and on an internal router, in `console` blocks",
  "A `command` asking for `default-information originate`",
]

[[chapter.page]]
name = "10-verify-and-troubleshoot"
title = "Verifying and troubleshooting OSPF"
summary = "The show commands that prove OSPF works, and a walk-through of an adjacency that will not form."
teaches = [
  "`show ip ospf neighbor`: is every expected neighbor there and Full (or 2WAY for DROTHER pairs)?",
  "`show ip protocols`: process ID, router ID, networks, passive interfaces, reference bandwidth, AD 110",
  "`show ip ospf`: process ID, router ID, number of areas, SPF run count",
  "`show ip ospf interface` and `show ip ospf interface brief`: area, cost, state, timers, neighbor counts",
  "`show ip route ospf`: routes marked O, [110/cost], next hop",
  "Adjacency checklist: interfaces up, same subnet and mask, same area, matching hello/dead, matching network type, unique RIDs, not passive, matching MTU, matching authentication",
  "Walk-through scenario: R3 is missing from R1's neighbor table; the reader follows `show` output to find mismatched hello timers and a passive interface",
  "Second fault: a route missing from the table because of a wrong wildcard in a network statement",
  "Close with recall cards on the checklist",
]

# ---------------------------------------------------------------------------
# Chapter 3: Network security concepts (ENSA module 3: 3.1 to 3.10)
# ---------------------------------------------------------------------------

[[chapter]]
number = 3
title = "Network security concepts"

[[chapter.page]]
name = "01-the-state-of-cybersecurity"
title = "Assets, threats and risk"
summary = "The words security people use, and the many ways data leaves an organization."
teaches = [
  "Open with a scene: a laptop left on a train, a USB stick in the car park, a cloned badge",
  "Key terms, defined: asset, vulnerability, threat, exploit, mitigation, risk",
  "Risk handling: acceptance, avoidance, reduction, transfer",
  "Attack vectors: external (from outside the network) and internal (insiders, often more damaging because they already have access)",
  "Data loss vectors: email and social networking, unencrypted devices, cloud storage, removable media, hard copy, improper access control",
  "A `table` of the vocabulary with an everyday example for each",
  "A `question` telling a vulnerability apart from a threat and an exploit",
]

[[chapter.page]]
name = "02-threat-actors-and-tools"
title = "Threat actors and their tools"
summary = "Who attacks networks, why, and the toolkit they share with the people who defend them."
teaches = [
  "Hackers by intent: white hat, gray hat, black hat",
  "Types of threat actors: script kiddies, vulnerability brokers, hacktivists, cybercriminals, state-sponsored attackers",
  "Indicators of compromise and why organizations share threat intelligence",
  "Penetration testing tools by category: password crackers, wireless hacking tools, network scanners, packet crafting tools, packet sniffers, rootkit detectors, fuzzers, forensic tools, debuggers, hacking operating systems, encryption tools, vulnerability exploitation and scanning tools",
  "The same tools serve attackers and defenders; authorization is the difference",
  "Categories of attack: eavesdropping, data modification, IP address spoofing, password-based, denial of service, man-in-the-middle (on-path), compromised key, sniffer",
  "A `question` matching a threat actor to a motive",
]

[[chapter.page]]
name = "03-malware"
title = "Viruses, worms and Trojans"
summary = "Malicious software sorted by how it spreads and what it does once it lands."
teaches = [
  "A virus attaches to a legitimate file and needs a user action to spread",
  "A worm replicates by itself across the network by exploiting a vulnerability",
  "The three parts of a worm attack: enabling vulnerability, propagation mechanism, payload",
  "A Trojan horse looks useful and carries a hidden malicious function",
  "Other malware: ransomware, spyware, adware, rootkits, scareware, phishing kits, bots",
  "A `table` comparing virus, worm and Trojan on how each spreads and whether it needs a host file",
  "Mitigations: patching, antimalware, least privilege, user training",
  "A `question` identifying a worm from a description of rapid self-propagation",
]

[[chapter.page]]
name = "04-reconnaissance-and-access-attacks"
title = "Reconnaissance and access attacks"
summary = "Attackers first map the network, then try to get in."
teaches = [
  "Reconnaissance steps: information queries (whois, DNS), ping sweeps, port scans, vulnerability scanners, exploitation tools",
  "Why a ping sweep and a port scan are early warning signs worth logging",
  "Access attacks: password attacks (brute force, dictionary), spoofing (IP, MAC, DHCP), trust exploitation, port redirection, man-in-the-middle, buffer overflow",
  "Trust exploitation example: a DMZ host trusted by an inside host becomes the stepping stone",
  "Port redirection example: using a compromised host to relay traffic past a firewall",
  "Buffer overflow: writing past the end of memory to crash a service or run code",
  "A `question` naming the attack from a short story",
]

[[chapter.page]]
name = "05-social-engineering-and-dos"
title = "Social engineering and denial of service"
summary = "Some attacks target people, and some just knock a service over."
teaches = [
  "Social engineering techniques: pretexting, phishing, spear phishing, spam, something for something (quid pro quo), baiting, impersonation, tailgating, shoulder surfing, dumpster diving",
  "Why user awareness training is the mitigation for most social engineering",
  "Denial of service (DoS): overwhelming quantity of traffic, or maliciously formatted packets",
  "Distributed DoS (DDoS): many compromised hosts (zombies) in a botnet directed by command and control (CnC) servers",
  "Why DoS attacks are easy to launch and hard to stop at the target alone",
  "A `table` of social engineering techniques with a one-line example each",
  "A `question` telling tailgating from pretexting, and one on what makes an attack distributed",
]

[[chapter.page]]
name = "06-ip-tcp-and-udp-weaknesses"
title = "Weaknesses in IP, TCP and UDP"
summary = "The core protocols were built for trust, and attackers abuse their header fields and handshakes."
teaches = [
  "IPv4 and IPv6 headers are not authenticated, so source addresses can be forged",
  "ICMP abuse: echo request/reply for sweeps, destination unreachable for reconnaissance, redirects to steer traffic, router discovery",
  "Amplification and reflection: spoofed requests to many hosts so replies flood the victim (the smurf idea)",
  "Address spoofing: non-blind (attacker sees replies, same subnet) versus blind (cannot see replies)",
  "TCP SYN flood: half-open connections exhaust the server; the three-way handshake recap",
  "TCP reset attack: a forged RST tears down a session",
  "TCP session hijacking: taking over an authenticated session by predicting sequence numbers",
  "UDP has no handshake or sequencing; its checksum can be recomputed after modification; UDP flood attacks",
  "A `question` on why a SYN flood leaves connections half-open",
]

[[chapter.page]]
name = "07-attacks-on-ip-services"
title = "Attacks on ARP, DNS and DHCP"
