  "Apply the same ACL to every VTY line so no line is left open",
  "Verify with `show access-lists` matches after a successful and a refused SSH attempt, and the log message from `deny any log`",
  "A `command` asking for `access-class ADMIN-HOST in`",
]

[[chapter.page]]
name = "06-extended-acl-syntax"
title = "Extended ACL syntax"
summary = "An extended ACE names a protocol, a source, a destination and, for TCP and UDP, the ports."
teaches = [
  "Syntax: `access-list 100-199 {permit | deny} protocol source wildcard [operator port] destination wildcard [operator port] [established] [log]`",
  "Protocols: `ip`, `tcp`, `udp`, `icmp`, `ospf`, `eigrp`, `gre`, `esp`, `ahp`; `ip` matches every IPv4 packet",
  "Port operators: `eq`, `neq`, `lt`, `gt`, `range`",
  "Port names and numbers: www 80, 443, ftp 21 and ftp-data 20, telnet 23, 22, smtp 25, domain 53, tftp 69; names exist only for some ports",
  "Example: `access-list 110 permit tcp 192.168.10.0 0.0.0.255 any eq www` and `eq 443`",
  "ICMP options such as `echo` and `echo-reply`",
  "Port is the destination port when written after the destination, and the source port when written after the source",
  "A `table` of common services, transport protocol and port",
  "A `command` writing an extended ACE that permits HTTPS from a LAN to any destination",
]

[[chapter.page]]
name = "07-configuring-extended-acls"
title = "Configuring extended ACLs"
summary = "Build numbered and named extended ACLs that enforce the chapter's policy, and place them near the source."
teaches = [
  "Named extended mode: `ip access-list extended SURFING` enters `R1(config-ext-nacl)#`",
  "A full example policy: permit web and HTTPS from the 192.168.10.0/24 LAN, deny Telnet to the server, permit everything else",
  "Apply near the source: `ip access-group SURFING in` on the LAN interface",
  "Filtering a single host to a single server: `deny tcp host 192.168.10.10 host 192.168.30.10 eq 23`",
  "Ending with `permit ip any any` when the intent is to block only certain traffic",
  "Numbered equivalent of the same ACL for comparison",
  "Editing extended ACLs with sequence numbers works the same as standard",
  "A `question` on why the ACL is applied inbound on the LAN interface rather than outbound toward the server",
]

[[chapter.page]]
name = "08-return-traffic"
title = "Letting replies back in"
summary = "An inbound ACL facing the internet must still allow replies to sessions your users started."
teaches = [
  "The problem: an inbound ACL on the outside interface that permits nothing also blocks the replies to inside users",
  "The `established` keyword matches TCP segments with the ACK or RST bit set, so replies to inside-initiated sessions pass",
  "Example: `permit tcp any 192.168.10.0 0.0.0.255 established`",
  "Limits: `established` is not stateful inspection; it trusts header bits that can be forged",
  "ICMP replies: `permit icmp any 192.168.10.0 0.0.0.255 echo-reply` so inside pings work while outside pings are blocked",
  "Pairing an outbound policy ACL with an inbound reply ACL on the same router",
  "A `question` on what traffic `established` permits",
]

[[chapter.page]]
name = "09-verifying-acls"
