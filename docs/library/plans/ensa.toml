[[chapter.page]]
name = "05-securing-vty-lines"
title = "Restricting remote management"
summary = "A standard ACL on the VTY lines decides which hosts may SSH to the router."
teaches = [
  "The goal: only the admin workstation may reach the router's VTY lines",
  "`access-class acl-name-or-number {in | out}` in `R1(config-line)#` mode, applied to `line vty 0 4` (or 0 15 on many devices)",
  "Example: `ip access-list standard ADMIN-HOST`, `permit host 192.168.10.10`, `deny any log`, then `access-class ADMIN-HOST in`",
  "Combine with `transport input ssh` and `login local`",
