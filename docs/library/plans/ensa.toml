# ---------------------------------------------------------------------------
# Chapter 4: ACL concepts (ENSA module 4: 4.1 to 4.4)
# ---------------------------------------------------------------------------

[[chapter]]
number = 4
title = "ACL concepts"

[[chapter.page]]
name = "01-what-an-acl-does"
title = "What an ACL does"
summary = "An access control list is an ordered set of permit and deny rules a router checks against each packet."
teaches = [
  "Open with a picture: a router between the HR LAN and the rest of the company, and a policy that only HR may reach the payroll server",
  "An ACL is a sequential list of permit or deny statements, each an access control entry (ACE)",
  "By default a router forwards every packet it can route; an ACL adds a decision",
  "Uses: limit traffic to improve performance, control routing updates, provide a basic level of security, filter by traffic type, screen hosts, and classify traffic for NAT, QoS and VPNs",
  "An ACL applied to an interface filters only traffic passing through it in that direction",
  "Misconception: an ACL is not a full stateful firewall",
  "A `question` on which uses of an ACL do not filter traffic (classification for NAT and QoS)",
]

[[chapter.page]]
name = "02-packet-filtering"
title = "How a router filters packets"
summary = "First match wins, the order matters, and an invisible deny sits at the bottom of every list."
teaches = [
  "Packet filtering checks Layer 3 fields (source and destination IP) and Layer 4 fields (protocol, ports)",
  "Inbound ACLs filter before the routing lookup; outbound ACLs filter after routing, on the way out",
  "Processing: compare top to bottom, the first matching ACE permits or denies, and no further ACEs are checked",
  "The implicit deny: a packet that matches nothing is dropped; it does not appear in the configuration",
  "Consequence: an ACL with only deny statements blocks everything; at least one permit is needed",
  "Why the most specific ACEs must come first",
  "A worked trace: three packets run through a four-line ACL",
  "A `question` predicting what happens to a packet that matches line 3 after line 1 would also have matched",
]

[[chapter.page]]
name = "03-wildcard-masks"
title = "Wildcard masks"
summary = "A 0 bit means match this bit, a 1 bit means ignore it."
teaches = [
  "A wildcard mask is 32 bits; 0 means the bit must match, 1 means the bit is ignored",
  "Compare with a subnet mask: same shape, inverted meaning; wildcards need not be contiguous in theory, but ACL work uses contiguous ones",
  "Examples: 0.0.0.0 matches one host; 0.0.0.255 matches a /24; 0.0.255.255 matches a /16; 255.255.255.255 matches any address",
  "Keywords: `host 192.168.10.10` equals 192.168.10.10 0.0.0.0; `any` equals 0.0.0.0 255.255.255.255",
  "A binary walk-through of 192.168.10.0 0.0.0.255 showing which bits are checked",
  "Matching only odd or even addresses as an example of a non-contiguous wildcard, labeled as rare",
  "A `drill` of kind `binary` and a `question` on what 0.0.0.0 matches",
]

[[chapter.page]]
name = "04-calculating-wildcards"
title = "Calculating wildcard masks"
summary = "Subtract the subnet mask from 255.255.255.255 to get the wildcard."
teaches = [
  "The subtraction method: 255.255.255.255 minus the subnet mask",
  "Worked examples: /24 to 0.0.0.255, /26 to 0.0.0.63, /28 to 0.0.0.15, /30 to 0.0.0.3, /22 to 0.0.3.255, /20 to 0.0.15.255",
  "Prefix length to wildcard shortcut: the block size minus 1 in the interesting octet",
  "Matching a range: 192.168.16.0 to 192.168.31.255 is 192.168.16.0 0.0.15.255",
  "Checking an answer: the network address plus the wildcard gives the last address in the range",
  "Common mistakes: typing the subnet mask where a wildcard belongs, and using a network address that is not on a block boundary",
  "A `drill` of kind `wildcard` and a `drill` of kind `mask`",
]

[[chapter.page]]
name = "05-wildcards-for-ranges"
title = "Wildcards for ranges and summaries"
summary = "Practice turning a set of subnets into one ACE, and reading an ACE back into a range."
teaches = [
  "Summarizing several contiguous subnets into one ACE: 10.1.4.0 to 10.1.7.255 as 10.1.4.0 0.0.3.255",
  "Why the start must sit on a block boundary: 10.1.5.0 to 10.1.8.255 cannot be one ACE",
  "Reading an ACE back: 172.16.32.0 0.0.31.255 covers 172.16.32.0 to 172.16.63.255",
  "Host versus subnet versus summary in one table",
  "Using OSPF network statements and ACLs as two places the same skill is used",
  "Three worked problems solved step by step",
  "A `drill` of kind `wildcard`, a `drill` of kind `subnet` and two `question` blocks on ranges",
]

[[chapter.page]]
name = "06-acl-guidelines"
title = "Rules for building ACLs"
summary = "One ACL per protocol, per direction, per interface, and a few habits that save outages."
teaches = [
  "The three Ps: one ACL per protocol (IPv4, IPv6), per direction (in, out), per interface",
  "Worked count: a router with two interfaces running IPv4 and IPv6 can have up to 8 ACLs applied",
  "Best practices: base ACLs on the security policy, write them in a text editor first, document with `remark`, test on a lab before production",
  "New ACEs are added to the end of the list; the order you type is the order they are checked",
  "Put specific ACEs before general ones",
  "An empty ACL applied to an interface permits everything; an ACL with entries ends with the implicit deny",
  "ACLs do not filter traffic the router itself originates",
  "A `question` on how many ACLs an interface can carry",
]

[[chapter.page]]
name = "07-standard-and-extended"
title = "Standard and extended ACLs"
summary = "Standard ACLs look only at the source address; extended ACLs look at source, destination, protocol and port."
teaches = [
  "Standard IPv4 ACLs match the source IPv4 address only",
  "Extended IPv4 ACLs match source and destination address, protocol (IP, TCP, UDP, ICMP and others) and source and destination port",
  "Numbered ranges: standard 1 to 99 and 1300 to 1999; extended 100 to 199 and 2000 to 2699",
  "Named ACLs: a descriptive name, no spaces or punctuation recommended, standard or extended keyword, easier to edit",
  "A `table` comparing standard and extended: fields matched, number ranges, where to place them",
  "Why extended ACLs give finer control, such as permitting web but denying Telnet to the same server",
  "A `question` picking the ACL type from a requirement",
]

[[chapter.page]]
name = "08-acl-placement"
title = "Where to place an ACL"
summary = "Extended ACLs go close to the source, standard ACLs close to the destination."
teaches = [
  "Rule: extended ACLs as close as possible to the source of the traffic to be filtered, so unwanted traffic is dropped early",
  "Rule: standard ACLs as close as possible to the destination, because they cannot see the destination and would block too much near the source",
  "Other factors: the extent of your administrative control, bandwidth of the links, ease of configuration",
  "A `diagram` with three routers and two LANs, and a worked example of placing a standard ACL and an extended ACL",
  "What goes wrong when a standard ACL is placed near the source",
  "Choosing inbound versus outbound on the chosen interface",
  "A `question` choosing the router, interface and direction for an ACL",
]

[[chapter.page]]
name = "09-check-yourself"
title = "Check yourself: ACL concepts"
summary = "Mixed questions and drills on ACL processing, wildcard masks, types and placement."
teaches = [
  "A scenario: a policy in plain words, and the reader decides ACL type, number range, router, interface and direction",
  "Questions on first-match processing and the implicit deny",
  "Wildcard questions: /27, /21, a host, any, and a range of subnets",
  "A `drill` of kind `wildcard`",
  "Questions on the three Ps and standard versus extended number ranges",
  "Recall cards: standard ACL numbers, extended ACL numbers, `host` and `any` equivalents, placement rules",
]

