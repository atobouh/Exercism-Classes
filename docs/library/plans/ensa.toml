]

[[chapter.page]]
name = "02-numbered-standard-acls"
title = "Numbered standard ACLs"
summary = "Write a standard ACL with access-list, then apply it with ip access-group."
teaches = [
  "Syntax: `access-list 1-99 {permit | deny} source [wildcard] [log]` and `access-list 10 remark text`",
  "Example: `access-list 10 permit 192.168.10.0 0.0.0.255`, then the implicit deny drops the rest",
  "Applying it: `R1(config-if)# ip access-group 10 out` (or `in`)",
  "A host entry without a wildcard: `access-list 10 permit 192.168.10.10` assumes 0.0.0.0",
  "Removing it: `no access-list 10` deletes the whole ACL, and `no ip access-group 10 out` unapplies it",
  "`show access-lists` output: `Standard IP access list 10` then `10 permit 192.168.10.0, wildcard bits 0.0.0.255`",
  "A `command` to apply ACL 10 outbound, and one to write a permit for a /24",
  "Trap: typing `no access-list 10 deny host ...` removes all of ACL 10, not one line",
]

[[chapter.page]]
name = "03-named-standard-acls"
title = "Named standard ACLs"
summary = "Give an ACL a name, enter its own mode, and add entries line by line."
teaches = [
  "`ip access-list standard PERMIT-ACCESS` enters `R1(config-std-nacl)#` mode",
  "Entries: `permit host 192.168.10.10`, `deny 192.168.10.0 0.0.0.255`, `permit any`, `remark text`",
  "Applying it: `ip access-group PERMIT-ACCESS out`",
  "Why names help: self-documenting, editable by sequence number",
  "Names are case-sensitive; convention is capital letters",
  "`show access-lists` and `show running-config | section access-list` output for a named ACL",
  "A `command` to enter named standard ACL mode",
]

[[chapter.page]]
name = "04-editing-acls"
title = "Editing ACLs with sequence numbers"
summary = "Insert or remove one line of an ACL instead of rewriting the whole thing."
teaches = [
  "Sequence numbers start at 10 and go up by 10 by default, shown in `show access-lists`",
  "Text editor method: copy the ACL out, edit, remove the old ACL, paste the new one",
  "Sequence number method: `ip access-list standard 1` (works for numbered ACLs too), then `no 10` and `10 deny host 192.168.10.99`",
  "Inserting between lines: `15 permit host 192.168.10.5`",
  "`ip access-list resequence name-or-number start increment` to renumber after many inserts",
