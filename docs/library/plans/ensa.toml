teaches = [
  "Terms: data terminal equipment (DTE), data communications equipment (DCE), customer premises equipment (CPE), point of presence (POP), demarcation point, local loop (last mile), central office (CO), toll network, backhaul network, backbone network",
  "A `diagram` from the customer router through the demarcation point and local loop to the CO",
  "Devices: voiceband modem, DSL modem and cable modem, CSU/DSU, optical converter, wireless router or access point, WAN switch, router, core router",
