  "Hub-and-spoke: branches connect to a central site; the hub is a single point of failure",
  "Dual-homed: each branch connects to two hubs for redundancy",
  "Fully meshed: every site connects to every other; n(n-1)/2 links",
  "Partially meshed: a compromise that connects only some sites directly",
