[[chapter.page]]
name = "05-traditional-wan"
title = "Traditional WAN connections"
summary = "Leased lines, dial-up, ISDN, Frame Relay and ATM: what they were and why most are gone."
teaches = [
  "Leased lines: dedicated point-to-point bandwidth; T1 1.544 Mbps, E1 2.048 Mbps, T3 44.736 Mbps, E3 34.368 Mbps",
  "Leased line pros (simplicity, quality, availability) and cons (cost, limited flexibility)",
  "Dial-up: analog modems over voice lines, up to 56 kbps",
  "ISDN: BRI 2B+D (two 64 kbps B channels and a 16 kbps D channel); PRI 23B+D on T1 or 30B+D on E1",
  "Frame Relay (virtual circuits, DLCIs) and ATM (fixed 53-byte cells) as legacy packet-switched services",
