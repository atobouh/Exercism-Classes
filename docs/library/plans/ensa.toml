  "DHCP spoofing: a rogue DHCP server hands out a false gateway or DNS server",
  "DHCP starvation: forged requests exhaust the address pool",
  "The four DHCP messages recap (Discover, Offer, Request, Ack) and where the rogue server interferes",
  "Pointer: the switch-level mitigations (DHCP snooping, dynamic ARP inspection) are configured in the SRWE book",
  "A `question` on which attack a rogue DHCP server performs",
]

[[chapter.page]]
name = "08-defending-the-network"
title = "Defense in depth"
summary = "No single device stops every attack, so layers of protection, people and policy work together."
teaches = [
  "The CIA triad: confidentiality, integrity, availability",
  "Defense in depth: layered controls so that one failure does not expose everything",
  "Security devices and their roles: firewall, next-generation firewall, IPS, VPN gateway, email and web security appliances, AAA server",
  "Firewall basics: stateful filtering versus packet filtering; IPS compared with IDS (inline and blocks versus monitors and alerts)",
  "Keep backups, patch and upgrade, use authentication, encrypt data in transit",
  "Security program elements: user awareness, training, physical access control (badges, locks, cameras, mantraps)",
  "Password policy in brief: length, complexity, no reuse, and alternatives such as multifactor authentication, certificates and biometrics; the Field Guide chapter on device access, AAA and passwords goes deeper",
  "A `question` picking IPS over IDS for a requirement to block attacks inline",
]

[[chapter.page]]
name = "09-cryptography"
title = "Cryptography for data in transit"
summary = "Hashes prove data was not changed, keys keep it secret, and certificates prove who sent it."
teaches = [
  "Four goals: data integrity, origin authentication, data confidentiality, data nonrepudiation",
  "Hash functions: fixed-length digest; MD5 128-bit, SHA-1 160-bit, SHA-2 (SHA-256, SHA-384, SHA-512); MD5 and SHA-1 are considered weak",
  "HMAC adds a secret key to the hash, so only key holders can produce a valid digest",
  "Symmetric encryption: one shared key, fast, used for bulk data; DES (56-bit, obsolete), 3DES, AES (128, 192, 256), SEAL, RC series",
  "Asymmetric encryption: public and private key pair, slower; RSA, DSA, Diffie-Hellman, ElGamal, elliptic curve",
  "Confidentiality by encrypting with the recipient's public key; authentication and nonrepudiation by signing with the sender's private key",
  "Diffie-Hellman lets two peers agree on a shared secret over an untrusted network without sending the key",
