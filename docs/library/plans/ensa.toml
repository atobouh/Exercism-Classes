# ---------------------------------------------------------------------------
# Chapter 8: VPN and IPsec concepts (ENSA module 8: 8.1 to 8.3)
# ---------------------------------------------------------------------------

[[chapter]]
number = 8
title = "VPN and IPsec concepts"

[[chapter.page]]
name = "01-why-vpns"
title = "Private traffic on a public network"
summary = "A VPN builds an encrypted tunnel across the internet so remote sites and users act as if they were on the company network."
teaches = [
  "Open with a branch and a teleworker who both need the head office servers, and only an internet connection",
  "A *VPN* (virtual private network): virtual because it runs over shared links, private because traffic is encrypted",
  "Benefits: cost savings, security, scalability, compatibility with broadband",
  "A `diagram` of a head office, a branch and a teleworker joined across the internet by tunnels",
  "Early VPNs used GRE with no encryption; modern VPNs encrypt",
  "A `question` on the main cost benefit of a VPN over a leased line",
]

[[chapter.page]]
name = "02-site-to-site-and-remote-access"
title = "Site-to-site and remote-access VPNs"
summary = "One tunnel joins whole networks; the other joins one user's device to the company."
teaches = [
  "Site-to-site VPN: VPN gateways (routers or firewalls) at each site; end hosts send normal traffic and are unaware of the VPN",
  "Remote-access VPN: a user device connects, using a client (Cisco AnyConnect / Secure Client) or a browser (clientless)",
  "Enterprise-managed VPNs versus service-provider-managed VPNs (MPLS Layer 2 and Layer 3 VPNs)",
  "A `table` comparing site-to-site and remote-access: who builds the tunnel, what is connected, typical device",
  "Which side of the VPN encrypts in each case",
  "A `question` picking the VPN type for a traveling sales team",
]

[[chapter.page]]
name = "03-ssl-and-ipsec"
title = "SSL VPNs and IPsec VPNs"
summary = "SSL/TLS VPNs work from a browser; IPsec VPNs need a client but give full network access with stronger options."
teaches = [
  "SSL VPN (really TLS): uses the browser's TLS on TCP 443; clientless access to web applications, or a lightweight client",
  "IPsec VPN: needs a client on the device or a gateway; supports any IP application",
  "A `table` comparing on authentication strength, encryption strength, connection complexity, and connection option",
  "When each fits: contractors and kiosks versus employees and sites",
  "IPsec ports and protocols in brief: IKE on UDP 500, NAT traversal on UDP 4500, ESP as IP protocol 50",
  "A `question` on which VPN suits access from an unmanaged device",
]

[[chapter.page]]
name = "04-gre-dmvpn-and-vti"
title = "GRE, DMVPN and IPsec VTI"
summary = "Ways to carry routing protocols and multicast through IPsec, and to build many tunnels without configuring each one."
teaches = [
  "Plain IPsec carries unicast traffic only, so routing protocol multicasts (OSPF Hellos) cannot cross it",
  "GRE (generic routing encapsulation, IP protocol 47) carries multicast and other protocols but does not encrypt",
  "GRE over IPsec: GRE wraps the traffic, IPsec encrypts the GRE packet; passenger, carrier and transport protocols",
  "DMVPN: hub-and-spoke with spoke-to-spoke tunnels built on demand, using mGRE and NHRP with IPsec",
  "IPsec virtual tunnel interface (VTI): a routable tunnel interface that carries unicast and multicast without GRE",
  "Service provider MPLS VPNs: Layer 2 (VPLS) and Layer 3 VPNs, where the provider does the work",
  "A `question` on why OSPF needs GRE over IPsec rather than plain IPsec",
]

[[chapter.page]]
name = "05-the-ipsec-framework"
title = "The IPsec framework"
summary = "IPsec is a framework of choices: a protocol, encryption, integrity, authentication and a key exchange."
teaches = [
  "IPsec is an IETF framework at Layer 3, not one fixed algorithm",
  "The five building blocks: IPsec protocol (AH or ESP), confidentiality, integrity, authentication, Diffie-Hellman",
  "Security services it provides: confidentiality, integrity, origin authentication, anti-replay protection",
  "AH (IP protocol 51): authentication and integrity, no encryption, and it breaks through NAT",
  "ESP (IP protocol 50): encryption plus optional authentication and integrity; the common choice",
  "Transport mode (protects the payload) versus tunnel mode (wraps the whole original packet with a new IP header; used in site-to-site VPNs)",
  "A `fields` block showing an ESP tunnel mode packet: new IP header, ESP header, original IP header, data, ESP trailer, ESP authentication",
  "A `table` of the framework with the options in each box",
  "A `question` on why AH is rarely used with NAT",
]

[[chapter.page]]
name = "06-confidentiality-and-integrity"
title = "Encryption and integrity in IPsec"
summary = "Symmetric ciphers keep IPsec traffic secret and hashes prove it was not changed."
teaches = [
  "Confidentiality choices: DES (56-bit, insecure), 3DES, AES (128, 192, 256-bit; recommended), SEAL (160-bit)",
  "Longer keys take longer to break; why AES replaced DES and 3DES",
  "Integrity: HMAC with MD5 (128-bit, weak), SHA-1 (160-bit, weak) or SHA-2 (256, 384, 512-bit)",
  "How integrity works: the sender's hash of the packet and shared key; the receiver recomputes and compares",
  "Anti-replay with sequence numbers",
  "A `table` of algorithms, key or digest sizes, and status",
  "A `question` choosing the strongest encryption from a list",
]

[[chapter.page]]
name = "07-authentication-and-key-exchange"
title = "Authentication and key exchange"
summary = "Peers prove who they are with a pre-shared key or certificates, and agree on keys with Diffie-Hellman."
teaches = [
  "Origin authentication: pre-shared keys (PSK) versus RSA signatures with digital certificates",
  "PSK: easy to configure, hard to scale and to keep secret",
  "RSA signatures: each peer signs with its private key; the other verifies with the public key from the certificate",
  "Diffie-Hellman creates the shared secret key over an insecure link",
  "DH groups: 1, 2 and 5 are no longer recommended; 14, 15 and 16 use 2048, 3072 and 4096-bit modulus; 19, 20 and 21 use elliptic curves; 24 is also listed",
  "IKE negotiates the security association (SA) between peers, using DH",
  "A `question` on what Diffie-Hellman provides",
]

[[chapter.page]]
name = "08-check-yourself"
title = "Check yourself: VPNs and IPsec"
summary = "Mixed questions on VPN types, tunnels and the IPsec framework."
teaches = [
  "A scenario: a company with three branches running OSPF, remote staff and a contractor; the reader picks VPN types for each",
  "Questions on site-to-site versus remote access, SSL versus IPsec",
  "Questions on GRE over IPsec, DMVPN and VTI",
  "Questions on AH versus ESP and transport versus tunnel mode",
  "Questions matching algorithms to framework boxes",
  "Recall cards: ESP protocol 50, AH protocol 51, IKE UDP 500, recommended DH groups",
]

# ---------------------------------------------------------------------------
# Chapter 9: QoS concepts (ENSA module 9: 9.1 to 9.5)
# ---------------------------------------------------------------------------

[[chapter]]
number = 9
title = "QoS concepts"

[[chapter.page]]
name = "01-why-qos"
title = "When the link is full"
summary = "Voice, video and file transfers compete for the same congested link, and quality of service decides who waits."
teaches = [
  "Open with a choppy voice call during a large backup over a branch WAN link",
  "Congestion happens where a fast link feeds a slower one or many links feed one (aggregation)",
  "Queues fill, packets wait, and when the queue is full packets are dropped",
  "Quality of service (QoS): tools that give some traffic priority so important flows get what they need",
  "Without QoS the router serves packets first-in, first-out",
  "A `diagram` of a LAN at 1 Gbps feeding a 100 Mbps WAN link",
  "A `question` on where congestion occurs",
]

[[chapter.page]]
name = "02-delay-jitter-and-loss"
title = "Delay, jitter and loss"
summary = "Three numbers decide how a network feels: how long packets take, how much that varies, and how many vanish."
teaches = [
  "Bandwidth versus delay versus jitter versus loss, defined",
  "Fixed delay: code delay, packetization delay, serialization delay, propagation delay",
  "Variable delay: queuing delay",
  "De-jitter (playout) buffer: smooths jitter at the cost of extra delay",
  "Jitter: variation in delay; harmful for real-time media",
  "Loss: drops from full queues; real-time traffic cannot wait for retransmission",
  "A `table` of delay types with a one-line example",
  "A `question` on which delay grows with congestion",
]

[[chapter.page]]
name = "03-traffic-characteristics"
title = "What voice, video and data need"
summary = "Voice is small and steady, video is large and bursty, data is everything else, and each has its own limits."
teaches = [
  "Voice: smooth, benign, drop sensitive, delay sensitive, UDP priority; latency 150 ms or less one way, jitter 30 ms or less, loss 1% or less, 30 to 128 kbps",
  "Video: bursty, greedy, drop sensitive, delay sensitive, UDP priority; latency 200 to 400 ms or less, jitter 30 to 50 ms or less, loss 0.1 to 1% or less, 384 kbps to over 20 Mbps",
  "Data: TCP retransmits; mission-critical versus not, interactive versus bulk",
  "A `table` comparing voice, video and data requirements",
  "Why voice uses UDP: a late packet is worse than a lost one",
  "A `question` on which traffic type tolerates loss best",
]

[[chapter.page]]
name = "04-queuing-algorithms"
title = "Queuing algorithms"
summary = "FIFO, weighted fair queuing, class-based WFQ and low latency queuing decide which packet leaves next."
teaches = [
  "FIFO: one queue, first in first out, no priority",
  "Weighted fair queuing (WFQ): automatic flows, low-volume flows served first, no user classes",
  "Class-based WFQ (CBWFQ): user-defined classes each with a guaranteed bandwidth share",
  "Low latency queuing (LLQ): CBWFQ plus a strict priority queue for voice, policed so it cannot starve others",
  "Tail drop: when a queue is full, new packets are dropped",
  "A `table` comparing the four algorithms",
  "A `question` picking LLQ for voice",
]

[[chapter.page]]
name = "05-qos-models"
title = "Best effort, IntServ and DiffServ"
summary = "Three models for delivering quality: no promises, reservations per flow, or treatment per class."
teaches = [
  "Best effort: the default; no special treatment; simple and scalable but no guarantees",
  "IntServ: per-flow reservations signaled with RSVP across every hop; strong guarantees, poor scalability",
  "DiffServ: traffic sorted into classes and marked; each hop applies a per-hop behavior (PHB); scalable, no hard guarantee",
  "A `table` of benefits and drawbacks for each model",
  "Why enterprise and provider networks mostly use DiffServ",
  "A `question` naming the model that uses RSVP",
]

[[chapter.page]]
name = "06-classification-and-marking"
title = "Classification and marking"
summary = "Sort traffic into classes and write the class into the frame or packet header so later devices can act on it."
teaches = [
  "Classification identifies traffic (by ACL, interface, NBAR application recognition); marking writes a value into a header",
  "Layer 2 marking: 802.1Q tag Priority Code Point (PCP), the 3-bit Class of Service (CoS), values 0 to 7; voice usually CoS 5",
  "Layer 3 marking: IPv4 Type of Service byte and IPv6 Traffic Class byte; first 3 bits are IP Precedence, first 6 bits are DSCP, last 2 bits are ECN",
  "A `fields` block of the ToS/Traffic Class byte: DSCP 6 bits, ECN 2 bits",
  "DSCP values: default 0 (best effort), Expedited Forwarding EF 46 (binary 101110) for voice, Assured Forwarding AFxy, Class Selector CSx (8 times x)",
  "AF classes 1 to 4 and drop probability 1 to 3; decimal value is 8x + 2y, so AF41 = 34, AF31 = 26, AF21 = 18, AF11 = 10",
  "Higher AF drop probability means dropped first within the same class",
  "A `table` of common DSCP markings and uses",
  "A `drill` of kind `binary` for DSCP values and a `question` on the decimal value of AF31",
]

[[chapter.page]]
name = "07-trust-and-congestion-avoidance"
title = "Trust boundaries and congestion avoidance"
summary = "Decide where markings are believed, and drop a few packets early before the queue overflows."
teaches = [
  "Mark as close to the source as possible; the trust boundary is where the network starts believing markings",
  "Trusted endpoints (an IP phone), the access switch, or the distribution switch as possible trust boundaries",
  "A `diagram` of a PC behind an IP phone on an access switch, with the trust boundary marked",
  "Congestion avoidance: Weighted Random Early Detection (WRED) drops some lower-priority packets early so TCP slows down",
  "Tail drop versus WRED, and why WRED helps TCP but not UDP voice",
  "A `question` on where the trust boundary should sit with an IP phone",
]

[[chapter.page]]
name = "08-shaping-and-policing"
title = "Shaping and policing"
summary = "Shaping holds excess traffic in a buffer; policing drops or remarks it."
teaches = [
  "Both enforce a rate, such as the rate bought from a provider",
  "Shaping: buffers excess and sends it later; smooths output; adds delay; applied outbound",
  "Policing: drops or remarks excess immediately; no added delay; inbound or outbound; providers police at the edge",
  "A described graph of traffic over time: shaping flattens peaks into later troughs, policing cuts peaks off",
  "A `table` comparing shaping and policing",
  "Why a customer shapes to the contracted rate so the provider's policer does not drop traffic",
  "A `question` telling them apart",
]

[[chapter.page]]
name = "09-check-yourself"
title = "Check yourself: QoS"
summary = "A branch office QoS scenario, then mixed questions on delay, queuing, models and markings."
teaches = [
  "Scenario: a branch with phones, video meetings and backups on a 50 Mbps WAN; the reader picks classification, marking, queuing, trust boundary and shaping",
  "Questions on delay types and jitter",
  "Questions on voice and video requirements",
  "Questions on FIFO, WFQ, CBWFQ and LLQ",
  "Questions on DSCP values EF and AFxy",
  "Recall cards: EF = 46, voice latency budget 150 ms, CoS is 3 bits, DSCP is 6 bits",
]

# ---------------------------------------------------------------------------
