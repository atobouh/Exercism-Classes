  "Static NAT: a permanent one-to-one mapping, used for servers that must be reached from outside",
  "Dynamic NAT: inside hosts take addresses from a pool on a first-come basis; when the pool is used up, new hosts wait",
  "PAT (port address translation, NAT overload): many inside hosts share one public address, told apart by port numbers",
