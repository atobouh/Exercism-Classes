teaches = [
  "WAN standards bodies: ITU-T, IEEE, IETF, TIA/EIA",
  "Layer 1 protocols: SDH, SONET, DWDM; Layer 2 protocols: broadband (DSL and cable), wireless, Ethernet WAN (Metro Ethernet), MPLS, PPP (less used), HDLC (less used)",
  "Serial versus parallel communication and why WAN links are serial",
  "Circuit-switched: a dedicated path for the call (PSTN, ISDN)",
  "Packet-switched: data in packets over shared links (Ethernet WAN, MPLS; legacy Frame Relay and ATM)",
  "SDH, SONET and DWDM on optical fiber; DWDM puts many wavelengths on one fiber",
