# ---------------------------------------------------------------------------
# Chapter 5. SRWE module 5: STP concepts
# Rapid PVST+ details and the guards belong in the Field Guide.
# ---------------------------------------------------------------------------

[[chapter]]
number = 5
title = "STP concepts"

[[chapter.page]]
name = "01-why-redundant-switches-loop"
title = "Why redundant switches loop"
summary = "A second cable between switches protects you from a failure, and without help it also melts the network."
teaches = [
  "Scene: three switches connected in a triangle for redundancy; a single broadcast circles forever",
  "Ethernet frames have no TTL, so a Layer 2 loop never dies out on its own, unlike an IP packet",
  "Broadcast storm: broadcasts multiply around the loop until links and switch CPUs are saturated",
  "MAC address table instability: the same source MAC appears on different ports as copies arrive from both directions",
  "Duplicate unicast frames: a host receives the same frame more than once",
  "Redundancy is still needed: STP keeps the extra links but blocks them until they are needed",
  "A `diagram` of the three-switch triangle",
  "A `question` on why the loop does not fade out by itself",
]

[[chapter.page]]
name = "02-how-stp-breaks-the-loop"
title = "How STP breaks the loop"
summary = "Spanning tree turns a looped network into a tree by blocking just enough ports, and unblocks one when a link fails."
teaches = [
  "The Spanning Tree Algorithm (originally by Radia Perlman, standardized as IEEE 802.1D) builds a loop-free logical tree over a physical topology with loops",
  "BPDUs (bridge protocol data units) are sent by switches to share their view; by default every 2 seconds (hello time)",
  "The four steps: elect the root bridge, elect root ports, elect designated ports, and block the rest as alternate ports",
  "Recalculation: when a link fails, a blocked port can move to forwarding to restore connectivity",
  "Misconception: a blocked port is not shut down; it still receives BPDUs and can move to forwarding",
  "A `diagram` of the triangle with one port marked as blocked",
  "Recall cards: the four steps in order, the default hello time",
]

[[chapter.page]]
name = "03-electing-the-root-bridge"
title = "Electing the root bridge"
summary = "The switch with the lowest bridge ID becomes the root, and every other switch measures its distance from it."
teaches = [
  "The bridge ID (BID): 4-bit bridge priority, 12-bit extended system ID (the VLAN number) and the 48-bit MAC address",
  "Default priority 32768, so the priority shown for VLAN 1 is 32769; priority changes only in multiples of 4096 (0 to 61440)",
  "Lowest BID wins; with all priorities at default, the lowest MAC wins, often the oldest switch, which is a poor choice",
  "Every switch first claims to be root; superior BPDUs replace that claim until all agree",
  "Influencing the election: `spanning-tree vlan 1 priority 24576`; the `root primary` and `root secondary` shortcuts are covered in the Field Guide",
  "`show spanning-tree vlan 1` output: the Root ID and Bridge ID blocks, `This bridge is the root`, and `(priority 32768 sys-id-ext 1)`",
  "A `question` giving three BIDs and asking which switch becomes root",
  "Recall cards: BID parts, default priority, priority increments",
]

[[chapter.page]]
name = "04-root-path-cost"
title = "Root path cost"
summary = "Each switch adds up port costs on the way to the root, and the cheapest path wins."
teaches = [
  "Root path cost is the sum of the port costs along the path to the root bridge, counted on the receiving ports",
  "A `table` of default port costs: 802.1D short method 10 Mbps 100, 100 Mbps 19, 1 Gbps 4, 10 Gbps 2; long method (used with RSTP) 10 Mbps 2,000,000, 100 Mbps 200,000, 1 Gbps 20,000, 10 Gbps 2,000",
  "The root bridge advertises a cost of 0; each switch adds its receiving port's cost",
  "Changing a port cost with `spanning-tree cost 25` at the interface, and returning to default with `no spanning-tree cost`",
  "The Cost column of `show spanning-tree` and the Root ID `Cost` line",
  "A worked calculation across a three-switch topology with mixed 100 Mbps and 1 Gbps links",
  "A `question` asking for a switch's root path cost from a diagram",
]

[[chapter.page]]
name = "05-root-designated-and-alternate-ports"
title = "Root, designated and alternate ports"
summary = "Every non-root switch picks one root port, every link gets one designated port, and anything left over blocks."
teaches = [
  "Root port: on each non-root switch, the port with the lowest root path cost; the root bridge has none",
  "Designated port: one per link segment, on the switch with the lowest root path cost to the root; every port on the root bridge is designated",
  "Alternate (blocked) port: any port that is neither root nor designated",
  "Tie-breakers in order: lowest root path cost, then lowest sender BID, then lowest sender port ID",
  "Port ID: port priority (default 128) plus port number, shown as `128.1`; changing it with `spanning-tree port-priority`",
  "A worked election on a three-switch topology with equal-cost paths, step by step",
  "The Role and Sts columns of `show spanning-tree`: `Root FWD`, `Desg FWD`, `Altn BLK`",
  "A `question` on which port blocks when two paths tie on cost",
]

[[chapter.page]]
name = "06-port-states-and-timers"
title = "Port states and timers"
summary = "Classic STP moves a port through listening and learning before it forwards, which keeps the network safe and makes it slow."
teaches = [
  "The 802.1D port states: blocking, listening, learning, forwarding and disabled",
  "A `table` of what each state does with BPDUs, MAC learning and data frames",
  "Timers: hello 2 seconds, forward delay 15 seconds, max age 20 seconds",
  "Convergence after a failure takes 30 to 50 seconds: max age plus two forward delays",
  "Why the delay exists: to let every switch hear the new topology before any port forwards",
  "A host plugged into a classic STP port waits about 30 seconds before it can send, which can make DHCP fail at boot",
  "A `question` on which state learns MACs but does not forward frames",
  "Recall cards: the three timers and their defaults",
]

[[chapter.page]]
name = "07-the-stp-family"
title = "The STP family"
summary = "802.1D was only the start. Per-VLAN and rapid versions fix its slowness and its one-tree limit."
teaches = [
  "A `table` of STP versions: 802.1D (STP, one tree, slow), PVST+ (Cisco, one tree per VLAN), 802.1w (RSTP, fast), Rapid PVST+ (Cisco, rapid and per VLAN), 802.1s (MSTP, several VLANs per instance), with standard or proprietary, resource use and convergence",
  "Per-VLAN trees allow load sharing: one switch is root for some VLANs and another for others",
  "PVST+ is the default on Catalyst 2960; Catalyst 9200 and 9300 default to Rapid PVST+; `spanning-tree mode rapid-pvst` changes the mode (Rapid PVST+ in depth is in the Field Guide)",
  "`show spanning-tree` reports `protocol ieee` for PVST+ and `protocol rstp` for Rapid PVST+",
  "Alternatives that reduce reliance on STP: EtherChannel, Layer 3 routing at the access layer, and switch stacking",
  "A `question` on which version gives per-VLAN trees with fast convergence",
  "Recall cards: the IEEE numbers for STP, RSTP and MSTP",
]

[[chapter.page]]
name = "08-rstp-portfast-and-bpdu-guard"
title = "RSTP, PortFast and BPDU guard"
summary = "Rapid spanning tree converges in seconds, and edge ports can skip the wait entirely."
teaches = [
  "RSTP port states: discarding (replacing blocking and listening), learning, forwarding",
  "RSTP port roles: root, designated, alternate (a backup path to the root) and backup (a redundant link to the same segment)",
  "Faster convergence: switches negotiate directly with neighbors instead of waiting for timers; a neighbor is considered lost after three missed hellos (6 seconds)",
  "Edge ports and link types: point-to-point (full duplex between switches) and shared (half duplex)",
  "PortFast: an access port goes straight to forwarding; `spanning-tree portfast` on the interface or `spanning-tree portfast default` globally; never on a link to another switch",
  "BPDU guard: an edge port that receives a BPDU is error-disabled; `spanning-tree bpduguard enable` (configuration in chapter 11; root guard, loop guard and BPDU filter are in the Field Guide)",
  "A `question` on what happens when someone plugs a switch into a PortFast port with BPDU guard",
  "Recall cards: the three RSTP states, the four RSTP roles",
]

[[chapter.page]]
name = "09-check-yourself"
title = "Check yourself"
summary = "Run a full spanning tree election by hand, then answer mixed questions on loops, states and versions."
teaches = [
  "A worked election on a four-switch topology: BIDs, root bridge, root path costs, root ports, designated ports and the alternate port, laid out in a table",
  "A `diagram` of the four-switch topology with link speeds",
  "The matching `show spanning-tree` output for one non-root switch, with the reader asked to identify each role",
  "Mixed `question` blocks on loop symptoms, BID math (priority plus VLAN), tie-breakers, timers and RSTP roles",
  "A question on what changes when the root bridge's priority is raised to 61440",
  "Recall cards on port costs, the 30 to 50 second convergence and PortFast placement",
]

# ---------------------------------------------------------------------------
# Chapter 6. SRWE module 6: EtherChannel
# ---------------------------------------------------------------------------

[[chapter]]
number = 6
title = "EtherChannel"

[[chapter.page]]
name = "01-why-bundle-links"
title = "Why bundle links"
summary = "Two uplinks should give you twice the bandwidth, but spanning tree blocks one. EtherChannel makes them one link."
teaches = [
  "Scene: an access switch with two gigabit uplinks to distribution, and STP blocking one of them",
  "EtherChannel groups up to 8 active physical ports into one logical port-channel interface",
  "STP sees the port-channel as a single link, so nothing is blocked inside the bundle",
  "Load balancing spreads flows across member links; one flow stays on one link, so a single transfer does not get the combined bandwidth",
  "Redundancy: losing one member link reduces bandwidth but does not trigger an STP recalculation",
  "Configuration is applied once to the port-channel interface",
  "A `diagram` with two uplinks drawn as a bundle",
  "A `question` on why one large file copy does not go faster over a two-link EtherChannel",
]

[[chapter.page]]
name = "02-rules-for-a-bundle"
title = "Rules for a bundle"
summary = "Member ports must match in every way that matters, or the bundle won't form."
teaches = [
  "All members must share the same speed and duplex",
  "All members must be in the same mode: all access ports in the same VLAN, or all trunks with the same allowed VLANs and native VLAN",
  "Members cannot mix interface types (for example FastEthernet with GigabitEthernet)",
  "Settings applied to the port-channel are copied to the members; settings applied to a member are not copied to the others",
  "EtherChannel can be Layer 2 (switchport) or Layer 3 (routed), and both ends must match",
  "A `table` of what must match and what happens when it does not (port suspended, bundle not formed)",
  "A `question` with one member configured with a different native VLAN",
]

[[chapter.page]]
name = "03-pagp-and-lacp"
title = "PAgP and LACP"
summary = "Two protocols can negotiate a bundle, one Cisco's and one an open standard, and each has its own modes."
teaches = [
  "PAgP: Cisco proprietary; modes `desirable` (actively negotiates) and `auto` (only responds); plus `on` (no protocol)",
  "LACP: IEEE 802.3ad (now 802.1AX), works across vendors; modes `active` and `passive`; plus `on`",
  "A `table` of PAgP mode combinations: desirable with desirable or auto forms a channel; auto with auto does not",
  "A `table` of LACP combinations: active with active or passive forms a channel; passive with passive does not",
  "Mode `on` forms a channel only with `on` on the other side, with no checks, which can cause loops if the far side is not bundled",
  "LACP can hold up to 16 ports in a group, 8 active and up to 8 in hot standby",
  "PAgP and LACP cannot negotiate with each other",
  "A `question` on two switches set to passive and passive, and recall cards on the mode pairs",
]

[[chapter.page]]
name = "04-configuring-etherchannel"
title = "Configuring EtherChannel"
summary = "Select the member ports, give them a channel group and a mode, then configure the port-channel interface."
teaches = [
  "Step by step on S1: `interface range fa0/1 - 2`, `channel-group 1 mode active` (which creates `Port-channel1`)",
  "Then `interface port-channel 1`, `switchport mode trunk`, `switchport trunk allowed vlan 1,2,20`",
  "Shut the member ports before bundling and bring them up afterward, so a half-configured bundle does not loop",
  "Matching configuration on S2, and why both ends need compatible modes",
  "Layer 3 EtherChannel on multilayer switches: `no switchport` on the members and on `interface port-channel 1`, then `ip address` on the port-channel",
  "Load-balancing method: `port-channel load-balance src-dst-ip` in global configuration, checked with `show etherchannel load-balance`",
  "`command` blocks for `channel-group 1 mode active` and `interface port-channel 1`",
]

[[chapter.page]]
name = "05-verifying-etherchannel"
title = "Verifying EtherChannel"
summary = "Four show commands tell you whether the bundle formed, which protocol it uses and which ports are in it."
teaches = [
  "`show etherchannel summary` with its flag legend: P bundled in port-channel, I stand-alone, s suspended, D down, S Layer 2, R Layer 3, U in use",
  "Reading a summary line: `1      Po1(SU)         LACP      Fa0/1(P)    Fa0/2(P)`",
  "`show interfaces port-channel 1` for status and combined bandwidth (BW)",
  "`show etherchannel port-channel` for the protocol and member ports",
  "`show interfaces fa0/1 etherchannel` for one member's role and its partner's details",
  "`show spanning-tree` lists Po1 instead of the member ports",
  "A `question` reading a summary where one port shows `(s)`",
  "Recall cards on SU and P flags",
]

[[chapter.page]]
name = "06-troubleshooting-etherchannel"
title = "Troubleshooting EtherChannel"
summary = "A bundle that won't come up almost always has a mode mismatch or a member that differs from the rest."
teaches = [
  "Common causes: incompatible modes (auto with auto, passive with passive), PAgP on one end and LACP on the other, mismatched speed or duplex, mismatched trunk settings or allowed VLANs, ports in different access VLANs",
  "Symptoms: no port-channel, ports stand-alone (I), ports suspended (s), or Po1 down (SD)",
  "A worked fault: S1 and S2 both set to PAgP auto; `show etherchannel summary` shows `Po1(SD)`, fixed by changing one side to desirable",
  "The safe fix procedure: shut the port-channel, correct the members, bring it back up",
  "`show run interface port-channel 1` and `show run | section interface FastEthernet0/1` to compare member configurations",
  "A second worked fault: a member left as an access port while the others are trunks",
  "A `question` with mixed LACP and PAgP modes",
]

[[chapter.page]]
name = "07-check-yourself"
title = "Check yourself"
summary = "Mixed questions on bundle rules, negotiation modes, configuration and output."
teaches = [
  "Mixed `question` blocks: maximum active links, STP behavior with EtherChannel, mode combination outcomes, member matching rules, Layer 3 EtherChannel",
  "A question reading `show etherchannel summary` and naming the fault",
  "`command` blocks for `channel-group 2 mode desirable`, `interface port-channel 2` and `port-channel load-balance src-dst-mac`",
  "A short scenario: bundle two links between a switch and a multilayer switch with LACP and a trunk, written out end to end",
  "Recall cards on PAgP and LACP mode names and the 8 active, 8 standby LACP limit",
]

# ---------------------------------------------------------------------------
# Chapter 7. SRWE module 7: DHCPv4
# ---------------------------------------------------------------------------

[[chapter]]
number = 7
title = "DHCPv4"

[[chapter.page]]
name = "01-why-hosts-ask-for-addresses"
title = "Why hosts ask for addresses"
summary = "Typing an address into every laptop doesn't scale. DHCP leases one out, along with everything else the host needs."
teaches = [
  "Scene: 200 laptops, phones and printers arriving on a network each day; static addressing breaks down",
  "DHCPv4 server and client roles; what a lease contains: IP address, mask, default gateway, DNS servers, domain name and lease time",
  "A lease is temporary; the client must renew it, and addresses return to the pool when it expires",
  "Where the server lives: a dedicated server in large networks, a Cisco router or the home router in small ones",
  "Static addresses still matter for routers, servers and printers, and must be excluded from the pool",
  "A `question` on which settings DHCP can hand out",
  "Recall cards: what a lease is",
]

[[chapter.page]]
name = "02-dora-step-by-step"
title = "DORA step by step"
summary = "Discover, Offer, Request, Acknowledge: four messages turn a host with no address into a working one."
teaches = [
  "DHCPDISCOVER: broadcast from 0.0.0.0 to 255.255.255.255, UDP source port 68 to destination port 67",
  "DHCPOFFER: the server proposes an address after checking it is not in use (an IOS server pings it first)",
  "DHCPREQUEST: still broadcast, so other servers that made offers learn they were not chosen",
  "DHCPACK: the server confirms, and the client checks the address with ARP before using it",
  "Renewal: at 50 percent of the lease (T1) the client unicasts a DHCPREQUEST to its server; at 87.5 percent (T2) it broadcasts to any server",
  "DHCPNAK, DHCPDECLINE and DHCPRELEASE in one line each",
  "A `table` of the four messages with source address, destination address and purpose",
  "A `question` on why the Request is broadcast, and recall cards on UDP 67 and 68",
]

[[chapter.page]]
name = "03-configuring-an-ios-dhcp-server"
title = "Configuring an IOS DHCP server"
summary = "Exclude the static addresses, define a pool, and tell it what to hand out."
teaches = [
  "Step 1: `ip dhcp excluded-address 192.168.10.1 192.168.10.9` for the gateway, servers and printers",
  "Step 2: `ip dhcp pool LAN-POOL-1`, which enters `R1(dhcp-config)#`",
  "Step 3 inside the pool: `network 192.168.10.0 255.255.255.0`, `default-router 192.168.10.1`, `dns-server 192.168.11.5`, `domain-name example.com`, `lease 7` (days, hours, minutes; default 1 day)",
  "The router must have an interface in the pool's subnet, or no client there can reach it without a relay",
  "The DHCP service is on by default; `no service dhcp` turns it off and `service dhcp` back on",
  "A `drill` of kind `hosts` for counting how many addresses a pool really has after exclusions",
  "`command` blocks for `ip dhcp excluded-address` and `default-router`",
  "Misconception: excluded addresses are configured globally, not inside the pool",
]

[[chapter.page]]
name = "04-verifying-the-dhcp-server"
title = "Verifying the DHCP server"
summary = "Check the configuration, see which addresses are leased, and confirm from the client."
teaches = [
  "`show running-config | section dhcp` to see exclusions and pools together",
  "`show ip dhcp binding` output: IP address, client ID or hardware address, lease expiration, type",
  "`show ip dhcp server statistics` and `show ip dhcp pool` for counts and utilization",
  "`show ip dhcp conflict` for addresses found in use when the server checked",
  "On a Windows client: `ipconfig /all` (DHCP Enabled, DHCP Server, Lease Obtained), `ipconfig /release` and `ipconfig /renew`",
  "A `question` on what a client with 169.254.x.x (APIPA) is telling you",
