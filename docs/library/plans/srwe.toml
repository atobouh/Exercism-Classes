book = "srwe"

# ---------------------------------------------------------------------------
# Chapter 1. SRWE module 1: Basic device configuration
# ---------------------------------------------------------------------------

[[chapter]]
number = 1
title = "Basic device configuration"

[[chapter.page]]
name = "01-from-power-on-to-prompt"
title = "From power on to prompt"
summary = "What a Cisco switch does between the moment you plug it in and the moment it shows you a prompt."
teaches = [
  "Scene: a new switch arrives for a small office with two LANs and one router; this chapter takes both boxes from factory state to managed, secure and verified",
  "The switch boot sequence in order: POST, boot loader, low-level CPU initialization, flash file system initialization, then loading the IOS image into RAM",
  "The BOOT environment variable and `boot system flash:/...bin` in global configuration; with no BOOT variable the switch loads the first executable image it finds in flash",
  "Front-panel LEDs on a Catalyst 2960: SYST, RPS, STAT, DUPLX, SPEED and PoE, and how the Mode button cycles the port LEDs between modes",
  "Recovering from a crash or a missing image: hold the Mode button while powering on to reach the `switch:` boot loader prompt, then `flash_init`, `dir flash:`, `set BOOT flash:...` and `boot`",
  "Misconception: the boot loader is not ROMMON-style IOS; it understands only a small set of commands, so you fix the image path and boot, then configure in IOS",
  "Show the start of `show version` on a switch: IOS version, uptime, image file name, and the configuration register line",
  "Recall cards: boot order, how to reach the boot loader, what the BOOT variable controls",
]

[[chapter.page]]
name = "02-the-switch-management-interface"
title = "The switch management interface"
summary = "A Layer 2 switch gets an IP address on a virtual interface so you can reach it over the network."
teaches = [
  "Why a Layer 2 switch needs an IP address at all: only for management (SSH, SNMP, ping), never for forwarding frames",
  "The switch virtual interface (SVI): `interface vlan 99`, `ip address 172.17.99.11 255.255.255.0`, optional `ipv6 address 2001:db8:acad:99::11/64`, `no shutdown`",
  "VLAN 1 is the default management SVI; best practice is a dedicated management VLAN such as 99 (VLANs themselves are taught in chapter 3)",
  "`ip default-gateway 172.17.99.1` so the switch can answer management hosts on other subnets; a switch with no gateway can only be managed from its own subnet",
  "An SVI comes up/up only when its VLAN exists and at least one port in that VLAN is up; show `show ip interface brief` with Vlan99 up/down and explain why",
  "Verify with `show ip interface brief`, `show ipv6 interface brief` and `show running-config interface vlan 99`",
  "Save with `copy running-config startup-config` and explain running versus startup configuration in one paragraph",
  "A `command` block for `ip default-gateway` and a `question` on why a remote ping to the switch fails without it",
]

[[chapter.page]]
name = "03-duplex-speed-and-auto-mdix"
title = "Duplex, speed and auto-MDIX"
summary = "Each switch port agrees speed and duplex with the device on the other end, and can fix a wrong cable type by itself."
teaches = [
  "Half duplex versus full duplex: half duplex shares the medium and uses CSMA/CD, full duplex sends and receives at once with no collisions",
  "Autonegotiation of speed and duplex is the default; manual settings with `duplex full` and `speed 100` at `S1(config-if)#`",
  "Gigabit and faster copper ports run only full duplex; 10/100 ports can run half",
  "A duplex mismatch: one side full, the other half; the link comes up but performs badly, with late collisions on the half-duplex side and CRC errors or runts on the full-duplex side",
  "Misconception: setting one side manually and leaving the other on auto often produces a mismatch, because the auto side falls back to half duplex when it cannot negotiate at 10 or 100 Mbps",
  "Auto-MDIX: the port detects a straight-through versus crossover cable and adjusts; `mdix auto` on the interface; enabled by default on current Catalyst switches",
  "Verify with `show interfaces fa0/1` (the `Full-duplex, 100Mb/s` line) and `show controllers ethernet-controller fa0/1 phy | include MDIX`",
  "A `table` comparing half and full duplex, and recall cards on mismatch symptoms",
]

[[chapter.page]]
name = "04-reading-interface-errors"
title = "Reading interface errors"
summary = "The counters in show interfaces tell you whether a link problem is the cable, the duplex or the far end."
teaches = [
  "`show interfaces fa0/18` output, walking through the status line (`is up, line protocol is up`), the duplex/speed line and the counters block",
  "Input errors: the total of runts, giants, CRC, no buffer, frame, overrun and ignored counts",
  "Runts are frames shorter than 64 bytes; giants are frames larger than the maximum (1518 bytes for untagged Ethernet); CRC errors mean the FCS did not match, usually noise or a bad cable",
  "Output errors, collisions and late collisions; collisions are normal only on half duplex; late collisions (after the first 512 bits) point to a duplex mismatch or an over-long cable",
  "The four status combinations: up/up, up/down (Layer 2 or encapsulation problem, keepalives), down/down (cable or far end), administratively down/down (`shutdown`)",
  "A troubleshooting flow for an access port: check status, check duplex and speed, check counters, clear with `clear counters fa0/18`, watch if they grow, swap the cable",
  "A `question` giving a counter block with rising late collisions and asking for the likely cause",
  "Recall cards: what a runt is, what a giant is, what late collisions usually mean",
]

[[chapter.page]]
name = "05-ssh-instead-of-telnet"
title = "SSH instead of Telnet"
summary = "Telnet sends your password in clear text. SSH encrypts the session, and setting it up takes six commands."
teaches = [
  "Why Telnet (TCP 23) is unsafe: everything, including the password, crosses the network in plain text; SSH (TCP 22) encrypts the whole session",
  "Check the IOS supports SSH: a `k9` (crypto) image in `show version`, or the `show ip ssh` command being accepted",
  "Configuration in order: `hostname`, `ip domain-name`, `crypto key generate rsa general-keys modulus 1024` (the key name comes from hostname plus domain), `username admin secret ...`, `line vty 0 15`, `transport input ssh`, `login local`",
  "`ip ssh version 2` and why version 2 needs a key of at least 768 bits; the course uses 1024 or larger",
  "Misconception: `password` plus `login` on the VTY lines does not use the local username database; SSH needs `login local` (or AAA)",
  "Verify with `show ip ssh` (version, timeout, retries) and `show ssh` (active sessions); connect from a PC with an SSH client to the SVI address",
  "Removing keys with `crypto key zeroize rsa` disables SSH",
  "`command` blocks for `transport input ssh` and `login local`; recall cards for ports 22 and 23",
]

[[chapter.page]]
name = "06-a-router-from-scratch"
title = "A router from scratch"
summary = "The basic settings every router gets, and how to address its interfaces for IPv4 and IPv6 at once."
teaches = [
  "Basic router security settings, reviewed from CCNA 1: `hostname R1`, `enable secret`, console and VTY passwords, `service password-encryption`, `banner motd #...#`",
  "Interfaces on an ISR 4000 are named like G0/0/0 and G0/0/1, and are shut down by default, unlike switch ports",
  "Dual stack on one interface: `description`, `ip address 192.168.10.1 255.255.255.0`, `ipv6 address 2001:db8:acad:10::1/64`, `ipv6 address fe80::1 link-local`, `no shutdown`",
  "`ipv6 unicast-routing` in global configuration so the router forwards IPv6 and sends router advertisements",
  "Loopback interfaces: `interface loopback 0`, an address with any mask, always up/up, used for testing and as a stable router ID later",
  "Save with `copy running-config startup-config`; show the console messages `%LINK-3-UPDOWN` and `%LINEPROTO-5-UPDOWN` when an interface comes up",
  "A `drill` of kind `ipv6` for writing interface addresses in their shortest form",
  "A `command` block for `ipv6 unicast-routing` and a `question` on why hosts get no IPv6 gateway without it",
]

[[chapter.page]]
name = "07-verifying-connected-networks"
title = "Verifying connected networks"
summary = "Before you route anything, prove that each interface is up, addressed correctly and in the routing table."
teaches = [
  "`show ip interface brief` and `show ipv6 interface brief` columns (Interface, IP-Address, OK?, Method, Status, Protocol) and what each status pair means",
  "`show ip route` and `show ipv6 route` after configuration: one C (connected network) and one L (local /32 or /128 host route) entry per active interface",
  "Misconception: an interface that is down puts nothing in the routing table, even if it is fully addressed",
  "`show interfaces g0/0/0` for Layer 1 and 2 detail, `show ip interface g0/0/0` for Layer 3 detail, `show ipv6 interface g0/0/0` for all IPv6 addresses including link-local and joined multicast groups",
  "Using `show running-config interface g0/0/0` to compare intended and actual configuration",
  "Test end to end with `ping` and `traceroute` from the router and from a PC (`ping`, `tracert`) in each LAN",
  "A `question` showing `show ip interface brief` with one interface up/down and asking where to look next",
  "Recall cards: what C and L mean in the routing table",
]

[[chapter.page]]
name = "08-filtering-output-and-history"
title = "Filtering output and command history"
summary = "Long show output can be cut down to the lines you need, and recent commands can be recalled instead of retyped."
teaches = [
  "The pipe filters after a show command: `| include`, `| exclude`, `| begin` and `| section`, each with a real example",
  "`show running-config | section line vty`, `show ip interface brief | include up`, `show running-config | begin interface`",
  "Filters are case sensitive and match a regular expression, so `include Up` and `include up` give different results",
  "The `--More--` prompt: Space for a page, Enter for a line, any other key to quit; `terminal length 0` to turn paging off for the session",
  "Command history: Up arrow or Ctrl+P, Down arrow or Ctrl+N, `show history`, and `terminal history size 200`; the default buffer holds 10 commands and the maximum is 256",
  "`command` blocks for filtering the running configuration to the VTY section and for showing only interfaces that are up",
  "Recall card on the default history size",
]

[[chapter.page]]
name = "09-check-yourself"
title = "Check yourself"
summary = "Mixed questions and a short build that pull together switch setup, port settings, SSH and router addressing."
teaches = [
  "A worked scenario: one switch and one router connecting two LANs, with a step list from erased switch to SSH-managed, dual-stack router with verified routes",
  "A `diagram` of the scenario topology with interface labels and subnets",
  "Mixed `question` blocks: boot loader recovery, SVI not coming up, duplex mismatch counters, missing `login local`, missing `ipv6 unicast-routing`",
  "`command` blocks for at least three key commands typed in context (`ip default-gateway`, `crypto key generate rsa`, `no shutdown` on a router interface)",
  "A `question` that shows `show ip route` with one LAN missing and asks why",
  "Four or more recall cards covering the chapter's numbers: TCP 22 and 23, 64 and 1518 byte limits, history size",
]

# ---------------------------------------------------------------------------
# Chapter 2. SRWE module 2: Switching concepts
# ---------------------------------------------------------------------------

[[chapter]]
number = 2
title = "Switching concepts"

[[chapter.page]]
name = "01-what-a-switch-decides"
title = "What a switch decides"
summary = "Every frame that enters a switch port raises one question: which port, or ports, should it leave by?"
teaches = [
  "Scene: a frame arrives on port 1 of a 24-port switch; the switch must decide in microseconds where it goes, using only Layer 2 information",
  "Ingress and egress ports, and the idea of a forwarding decision based on the destination MAC address",
  "A switch versus a hub: a hub repeats every bit out of every port; a switch forwards selectively",
  "The two jobs: learn (from the source MAC) and forward (using the destination MAC); forwarding happens in hardware (ASICs)",
  "Why switches replaced shared Ethernet: dedicated bandwidth per port, full duplex, microsegmentation",
  "A `diagram` of one switch with four PCs used through the chapter",
  "A `question` on which address the switch reads to learn and which it reads to forward",
]

[[chapter.page]]
name = "02-learning-and-aging"
title = "Learning and aging MAC addresses"
summary = "A switch builds its MAC address table by reading the source address of every frame, and forgets entries it has not seen for a while."
teaches = [
  "Learning: for every incoming frame the switch records the source MAC, the ingress port and the VLAN; an existing entry is refreshed, a moved MAC is updated to the new port",
  "The MAC address table is also called the CAM table; show `show mac address-table` output with the Vlan, Mac Address, Type and Ports columns",
  "Dynamic entries age out after 300 seconds of silence by default; `mac address-table aging-time` changes it",
  "Static entries with `mac address-table static 0050.7966.6800 vlan 1 interface fa0/1` never age out",
  "`show mac address-table dynamic`, `show mac address-table address 0050.7966.6800`, `show mac address-table count`, and `clear mac address-table dynamic`",
  "Misconception: a switch never learns from the destination address; a silent host is never learned until it sends something",
  "A `drill` of kind `hex`, since MAC addresses are written in hexadecimal",
  "Recall cards: the default aging time, what triggers learning",
]

[[chapter.page]]
name = "03-forward-flood-or-filter"
title = "Forward, flood or filter"
summary = "A known destination is forwarded out one port, an unknown one is flooded, and a frame for the port it came in on is dropped."
teaches = [
  "Known unicast: the destination MAC is in the table, so the frame leaves by that port only",
  "Unknown unicast: the destination MAC is not in the table, so the frame is flooded out every port in the VLAN except the ingress port",
  "Broadcast (ffff.ffff.ffff) and most multicast frames are always flooded within the VLAN",
  "Filtering: if the destination is on the same port the frame arrived on, the switch drops it",
  "A step-by-step walk-through: PC1 pings PC3 on an empty table, showing the ARP broadcast, the flood, the reply and the table after each step",
  "Two connected switches: a MAC learned on the inter-switch port stands for every host behind the other switch",
  "A `question` with a partial MAC table asking which ports a given frame leaves by",
]

[[chapter.page]]
name = "04-store-and-forward-and-cut-through"
title = "Store-and-forward and cut-through"
summary = "A switch can wait for the whole frame and check it, or start sending as soon as it knows where the frame goes."
teaches = [
  "Store-and-forward: receive the whole frame, check the FCS (CRC), drop it if bad, then forward; the default on Catalyst access switches",
  "Why store-and-forward is needed for ports of different speeds (buffering) and for QoS decisions that read deeper into the frame",
  "Cut-through: start forwarding once the destination MAC (the first 6 bytes after the preamble) has been read; lowest latency, but bad frames are passed on",
  "Fast-forward is the purest cut-through; fragment-free waits for the first 64 bytes, where most collision damage would show, then forwards",
  "Port-based and shared-memory buffering in one short paragraph",
  "A `table` comparing store-and-forward, fast-forward and fragment-free on latency, error checking and when each fits",
  "A `question` on which method never forwards a frame with a bad FCS",
  "Recall cards: what fragment-free checks, why buffering matters",
]

[[chapter.page]]
name = "05-collision-and-broadcast-domains"
title = "Collision and broadcast domains"
summary = "Switches end collisions; only routers and VLANs stop broadcasts."
teaches = [
  "A collision domain: the set of devices whose frames can collide; on a hub, every port shares one",
  "Every switch port is its own collision domain, and full duplex removes collisions entirely",
  "A broadcast domain: every device that receives a given broadcast; a switch forwards broadcasts out all ports, so all its ports (in one VLAN) form one broadcast domain",
  "Routers bound broadcast domains; VLANs split a switch into several (forward pointer to chapter 3)",
  "Counting domains on a `diagram` with a hub, two switches and a router",
  "How switches relieve congestion: high port density, large frame buffers, fast ports, fast internal switching and low per-port cost",
  "A `question` asking how many collision and broadcast domains a given topology has, with tempting wrong answers that count a switch as one collision domain",
  "Recall cards: what bounds a collision domain, what bounds a broadcast domain",
]

[[chapter.page]]
name = "06-check-yourself"
title = "Check yourself"
summary = "Trace frames through a two-switch network and count its domains."
teaches = [
  "A worked trace: two switches, five PCs, a sequence of four frames, with the MAC tables of both switches written out after each frame",
  "A `diagram` of the topology used for the trace",
  "Mixed `question` blocks on learning, flooding, filtering, aging and forwarding methods",
  "A domain-counting question on a mixed hub, switch and router topology",
  "A question on what happens after a host moves to another port before its entry ages out",
  "Recall cards covering the 300-second aging default, 64-byte fragment-free check and the meaning of unknown unicast",
]

# ---------------------------------------------------------------------------
# Chapter 3. SRWE module 3: VLANs
# Existing page names 01 to 05 are kept. The lab stays the last page.
# ---------------------------------------------------------------------------

[[chapter]]
number = 3
title = "VLANs"

[[chapter.page]]
name = "01-what-a-vlan-is"
title = "What a VLAN is"
summary = "A VLAN splits one switch into separate broadcast domains."
teaches = [
  "Scene: one floor, one switch, three departments that should not share broadcasts or see each other's traffic",
  "A VLAN is a logical broadcast domain; each VLAN is its own IP subnet, and hosts in different VLANs need a router to talk",
  "Benefits: smaller broadcast domains, better security, lower cost than separate switches, grouping by function rather than location, simpler management",
  "VLAN types: default VLAN (VLAN 1: all ports start there and it cannot be deleted or renamed), data VLANs, native VLAN, management VLAN, voice VLAN",
  "Misconception: VLAN 1 is not special because it is safer; best practice moves users, management and the native VLAN off VLAN 1",
  "A `diagram` of one switch with PCs in VLAN 10, 20 and 30",
  "A `question` on whether two PCs on the same switch but different VLANs can ping each other without a router",
  "Recall cards: what a VLAN creates, which VLAN ports start in",
]

[[chapter.page]]
name = "02-assigning-ports"
title = "Assigning ports"
summary = "An access port belongs to exactly one VLAN, plus an optional voice VLAN for a phone."
teaches = [
  "VLAN ranges: normal range 1 to 1005 (1002 to 1005 reserved for legacy Token Ring and FDDI, and with VLAN 1 cannot be deleted), stored in `vlan.dat` in flash; extended range 1006 to 4094, saved in the running configuration",
  "Creating a VLAN: `vlan 10`, then `name SALES` at `S1(config-vlan)#`",
  "Assigning an access port: `interface fa0/6`, `switchport mode access`, `switchport access vlan 10`; `interface range fa0/1 - 12` for many ports; IOS creates a missing VLAN when you assign it",
  "A voice VLAN on the same port: `mls qos trust cos` and `switchport voice vlan 150`; the phone tags voice frames and the PC behind it sends untagged data",
  "Verification: `show vlan brief`, `show vlan id 10`, `show vlan name SALES`, `show vlan summary`, `show interfaces fa0/18 switchport` (Administrative Mode, Access Mode VLAN, Voice VLAN lines)",
  "Changing membership: `no switchport access vlan` returns the port to VLAN 1",
  "Deleting: `no vlan 20`; ports left in a deleted VLAN become inactive until reassigned; `delete flash:vlan.dat` removes all VLANs, and with `erase startup-config` and `reload` restores factory state",
  "`command` blocks for creating a VLAN and assigning a port, and a `question` on what happens to ports when their VLAN is deleted",
]

[[chapter.page]]
name = "03-vlan-trunks"
title = "VLAN trunks"
summary = "An access port carries one VLAN. A trunk carries all of them on the same cable."
teaches = [
  "Keep the existing `figure` block with id `trunk-tagging` near the top of the page",
  "Why a trunk: without one, every VLAN would need its own cable between switches",
  "The 802.1Q tag is 4 bytes inserted between the source MAC and the Type field: TPID 0x8100 (16 bits), priority PCP (3 bits), DEI (1 bit) and VLAN ID (12 bits); the FCS is recalculated",
  "A `fields` block of the 802.1Q tag; the 12-bit VLAN ID explains the 4094 usable VLANs",
  "Configuring a trunk: `switchport mode trunk`, `switchport trunk native vlan 99`, `switchport trunk allowed vlan 10,20,30,99`, and `allowed vlan add` and `remove`; some older multilayer switches need `switchport trunk encapsulation dot1q` first",
  "Resetting: `no switchport trunk allowed vlan` and `no switchport trunk native vlan`, and `switchport mode access` to make it an access port again",
  "`show interfaces trunk` output: the four sections (mode and native VLAN, VLANs allowed, allowed and active, forwarding and not pruned)",
  "Misconception: a trunk does not create VLANs on the far switch; each switch must have the VLAN defined",
  "A `command` block for making a port a trunk and a `question` on how a VLAN 10 frame crosses the trunk",
]

[[chapter.page]]
name = "04-native-vlan"
title = "Native VLAN"
summary = "One VLAN crosses a trunk untagged. Both ends have to agree on which one."
teaches = [
  "Frames in the native VLAN cross an 802.1Q trunk untagged; untagged frames arriving on a trunk are placed in the native VLAN",
  "Why it exists: compatibility with devices and hubs that do not understand tags",
  "The default native VLAN is VLAN 1; set it with `switchport trunk native vlan 99` on both ends",
  "A native VLAN mismatch: traffic leaks between the two VLANs and CDP reports `%CDP-4-NATIVE_VLAN_MISMATCH` on the console",
  "Best practice: a dedicated, unused native VLAN that carries no user traffic (links forward to chapter 11 on VLAN attacks)",
  "Voice VLAN tagging recap: the phone tags voice frames, PC data passes untagged, like a small trunk",
  "A `question` on what happens when S1 uses native VLAN 99 and S2 uses native VLAN 1",
  "Recall cards: default native VLAN, how native frames cross the trunk",
]

[[chapter.page]]
name = "05-troubleshooting-vlans"
title = "Troubleshooting VLANs"
summary = "Most problems are a port in the wrong VLAN, a VLAN that doesn't exist, or a VLAN missing from the trunk."
teaches = [
  "Work from the edge inward: host IP and subnet, access port VLAN, VLAN existence on every switch, trunk status, allowed VLAN list",
  "Wrong subnet: a PC in the right VLAN with an address from another VLAN's subnet cannot reach its neighbors",
  "Missing VLAN: a switch drops frames for a VLAN it does not have, even on a trunk; ports in a deleted VLAN are inactive and show nowhere in `show vlan brief`",
  "Trunk problems: native VLAN mismatch, a trunk mode mismatch (one side access, one side trunk), VLAN missing from `switchport trunk allowed vlan`",
  "The key commands and what each answers: `show vlan brief`, `show interfaces fa0/1 switchport`, `show interfaces trunk`, `show mac address-table`",
  "A worked fault: VLAN 20 fails between two switches while VLAN 10 works, solved by reading `show interfaces trunk`",
  "A `question` on the classic cause when one VLAN fails across a working trunk",
  "Recall cards: the command that shows allowed VLANs on a trunk, what happens to ports of a deleted VLAN",
]

[[chapter.page]]
name = "06-dynamic-trunking-protocol"
title = "Dynamic Trunking Protocol"
summary = "Cisco switches can negotiate whether a link becomes a trunk, which is convenient and best turned off."
teaches = [
  "DTP is Cisco proprietary, on by default, and negotiates trunking between two Cisco switches; it requires matching VTP domain names",
  "The modes: `switchport mode access`, `switchport mode dynamic auto`, `switchport mode dynamic desirable`, `switchport mode trunk`, and `switchport nonegotiate` to stop DTP frames",
  "Catalyst 2960 and 9200 ports default to dynamic auto, so two default switches connected together form an access link, not a trunk",
  "A `table` of DTP outcomes: auto with auto gives access; auto with desirable, desirable with desirable, and trunk with auto or desirable give trunk; access with trunk gives limited or no connectivity",
  "`show dtp interface fa0/1` and the Administrative Mode and Operational Mode lines of `show interfaces fa0/1 switchport`",
  "Best practice: set `switchport mode trunk` and `switchport nonegotiate` on trunks, and `switchport mode access` on every edge port",
  "A `question` on two new switches connected with default settings",
  "Recall cards: default DTP mode, the command that stops DTP negotiation",
]

[[chapter.page]]
name = "07-check-yourself"
title = "Check yourself"
summary = "Mixed questions and a two-switch build that pull together VLANs, access ports, trunks and DTP."
teaches = [
  "A worked scenario: two switches, VLANs 10, 20 and 99, voice VLAN 150, one trunk with native VLAN 99, with the full configuration and expected `show vlan brief` and `show interfaces trunk`",
  "A `diagram` of the two-switch scenario with port labels and the trunk link styled as trunk",
  "Mixed `question` blocks: VLAN ranges, deleted VLAN behavior, 802.1Q tag size, native VLAN mismatch, DTP auto with auto",
  "`command` blocks for `switchport voice vlan 150`, `switchport trunk allowed vlan add 30` and `switchport nonegotiate`",
  "A `question` reading a `show interfaces trunk` output where one VLAN is allowed but not active",
  "Recall cards on the 12-bit VLAN ID, VLAN 1 restrictions and where normal-range VLANs are stored",
]

[[chapter.page]]
name = "08-lab-router-on-a-stick"
title = "Lab: Router-on-a-stick"
summary = "Give VLAN 10 and 20 a gateway on one router port."
lab = "srwe-03-router-on-a-stick"
teaches = [
  "Page header carries `lab = \"srwe-03-router-on-a-stick\"` and the body holds a `lab` block with id `srwe-03-router-on-a-stick`; this stays the last page of the chapter",
  "Short framing before the lab: VLANs isolate hosts, so traffic between VLAN 10 and VLAN 20 needs a router; one trunk to a router port can carry both",
  "What the lab practices: a trunk from the switch to the router, subinterfaces with `encapsulation dot1Q 10` and `encapsulation dot1Q 20`, one gateway address per subinterface, `no shutdown` on the physical interface",
  "What success looks like: PCs in both VLANs ping their gateways and each other; `show ip interface brief` lists the subinterfaces up/up",
  "Point forward to chapter 4, which explains router-on-a-stick fully, and back to the trunk page",
  "Two recall cards after the lab: what `encapsulation dot1Q 10` does, and why the physical interface needs `no shutdown`",
]

# ---------------------------------------------------------------------------
# Chapter 4. SRWE module 4: Inter-VLAN routing
# ---------------------------------------------------------------------------

[[chapter]]
number = 4
title = "Inter-VLAN routing"

[[chapter.page]]
name = "01-why-vlans-need-a-router"
title = "Why VLANs need a router"
summary = "VLANs keep hosts apart at Layer 2. Something at Layer 3 has to carry traffic between them."
teaches = [
  "Scene: Sales in VLAN 10 needs the printer in VLAN 20; the switch alone cannot deliver it because each VLAN is a separate subnet and broadcast domain",
  "Hosts send traffic for other subnets to their default gateway; each VLAN needs a gateway address on a Layer 3 device",
  "Legacy inter-VLAN routing: one physical router interface and one switch access port per VLAN, and why it does not scale",
  "Router-on-a-stick: one router interface, one trunk, one subinterface per VLAN",
  "Layer 3 switch with SVIs: routing inside the switch hardware, the method used in most campus networks",
  "A `table` comparing the three methods on ports used, scalability, speed and cost",
  "A `diagram` of the legacy method with two cables to the router",
  "A `question` on why legacy inter-VLAN routing runs out of router ports",
]

[[chapter.page]]
name = "02-how-router-on-a-stick-works"
title = "How router-on-a-stick works"
summary = "One physical router port becomes several logical ones, each in its own VLAN and subnet."
teaches = [
  "Subinterfaces: logical interfaces such as G0/0/1.10, each with its own IP address and VLAN tag",
  "The subinterface number need not match the VLAN, but matching them is the convention; the `encapsulation dot1Q 10` command sets the VLAN",
  "The path of a packet from PC1 in VLAN 10 to PC2 in VLAN 20: tagged 10 up the trunk, routed, tagged 20 back down the same trunk",
  "The switch port toward the router must be a trunk; the router does not run DTP, so set `switchport mode trunk` statically",
  "Native VLAN on a subinterface: `encapsulation dot1Q 99 native`",
  "Limits: all inter-VLAN traffic shares one link's bandwidth, and the router is a single point of failure",
  "A `diagram` of router-on-a-stick with the trunk link styled as trunk",
  "Recall cards: what a subinterface is, the main bandwidth limit",
]

[[chapter.page]]
name = "03-configuring-router-on-a-stick"
title = "Configuring router-on-a-stick"
summary = "Configure the switches for VLANs and a trunk, then give the router one subinterface per VLAN."
teaches = [
  "Scenario: S1 and S2 with VLANs 10 and 20 plus management VLAN 99, S1 trunked to R1 G0/0/1",
  "Switch side: create VLANs, assign access ports, configure trunks between switches and to the router, management SVI and default gateway on the switches",
  "Router side for each VLAN: `interface g0/0/1.10`, `description`, `encapsulation dot1Q 10`, `ip address 192.168.10.1 255.255.255.0`",
  "Then `interface g0/0/1` and `no shutdown`; subinterfaces follow the state of the physical interface",
  "Misconception: `ip address` is rejected on a subinterface until `encapsulation dot1Q` has been set",
