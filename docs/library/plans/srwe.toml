# ---------------------------------------------------------------------------
# Chapter 9. SRWE module 9: FHRP concepts
# ---------------------------------------------------------------------------

[[chapter]]
number = 9
title = "FHRP concepts"

[[chapter.page]]
name = "01-one-gateway-one-point-of-failure"
title = "One gateway, one point of failure"
summary = "A host knows one default gateway. If that router dies, the host is cut off even when a second router is right there."
teaches = [
  "Scene: a LAN with two routers to the internet; R1 fails and every PC loses access although R2 is fine",
  "Hosts have a single static or DHCP-learned default gateway, and an ARP entry for its MAC",
  "Changing every host's gateway by hand is not a recovery plan",
  "The idea of a first hop redundancy protocol (FHRP): several routers share one virtual gateway",
