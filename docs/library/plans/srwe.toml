]

[[chapter.page]]
name = "05-dhcp-relay"
title = "DHCP relay"
summary = "DHCP Discover is a broadcast, and routers don't forward broadcasts. A relay turns it into a unicast to the server."
teaches = [
  "The problem: clients on 192.168.10.0/24, server on 192.168.11.6, and R1 drops the broadcast Discover",
  "`ip helper-address 192.168.11.6` on the interface facing the clients (their gateway interface), not the interface facing the server",
  "The relay forwards the request as a unicast and fills in the gateway address (giaddr) so the server picks the right pool",
  "`show ip interface g0/0/0` shows `Helper address is 192.168.11.6`",
  "ip helper-address also relays other UDP broadcasts by default, including DNS, TFTP, the time service, TACACS and NetBIOS name and datagram services",
  "A `diagram` with the client LAN, R1 and the server LAN",
  "A `command` block for `ip helper-address` and a `question` on which interface it goes on",
]

[[chapter.page]]
name = "06-router-as-a-dhcp-client"
title = "A router as a DHCP client"
summary = "A router's internet-facing interface can get its own address from the ISP, the same way a laptop does."
teaches = [
  "Small offices and homes often get their public address from the ISP by DHCP",
  "`ip address dhcp` on the interface, then `no shutdown`",
