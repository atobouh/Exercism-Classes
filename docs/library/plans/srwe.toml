teaches = [
  "HSRP: Cisco proprietary, active and standby routers; HSRP for IPv6 also exists",
  "VRRP: open standard (VRRPv2 for IPv4, VRRPv3 for IPv4 and IPv6), master and backup routers",
  "GLBP: Cisco proprietary, load balances across several routers while also providing failover",
  "IRDP: a legacy method in one sentence",
  "A `table` comparing HSRP, VRRP and GLBP: standard, role names, load balancing, preemption default",
