  "A `table` comparing DHCPv4 DORA and DHCPv6 messages side by side",
  "The host starts DHCPv6 only when the RA's M or O flag tells it to",
  "Misconception: a DHCPv6 server does not need to be the router; it can be anywhere reachable through a relay",
