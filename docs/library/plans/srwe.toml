  "Static routes do not adapt: if a path changes, someone must update them",
  "A `question` on why R1 cannot reach R3's LAN before any static routes",
]

[[chapter.page]]
name = "02-static-route-syntax"
title = "Static route syntax"
summary = "Two commands, ip route and ipv6 route, with three ways to say where the packet goes next."
teaches = [
  "`ip route network-address subnet-mask {ip-address | exit-intf [ip-address]} [distance]`",
  "`ipv6 route ipv6-prefix/prefix-length {ipv6-address | exit-intf [ipv6-address]} [distance]`, which needs `ipv6 unicast-routing`",
  "Next-hop route: give only the next-hop address",
  "Directly connected route: give only the exit interface",
  "Fully specified route: give both the exit interface and the next hop",
  "A `table` comparing the three forms and when to use each",
  "A `question` on which form a given command is",
]

[[chapter.page]]
name = "03-next-hop-static-routes"
title = "Next-hop static routes"
summary = "Point the route at the neighbor's address, and the router works out the exit interface itself."
teaches = [
  "R1 config: `ip route 172.16.2.0 255.255.255.0 172.16.2.2` and the matching routes on R2 and R3",
  "IPv6: `ipv6 route 2001:db8:acad:2::/64 2001:db8:acad:2::2`",
  "Recursive lookup: the router looks up the next hop in the table to find the exit interface",
  "The return path: every router along the way needs a route back, or pings fail",
  "Verify with `show ip route static`, `show ipv6 route static` and a ping between LANs",
  "A `drill` of kind `mask` for writing route masks",
  "`command` blocks for an IPv4 and an IPv6 next-hop route",
]

[[chapter.page]]
name = "04-directly-connected-and-fully-specified"
title = "Directly connected and fully specified routes"
summary = "Naming only the exit interface works on point-to-point links; on Ethernet, give the next hop too."
teaches = [
  "Directly connected static route: `ip route 192.168.2.0 255.255.255.0 s0/1/0`; no recursive lookup",
  "It appears in the table as `is directly connected, Serial0/1/0`",
  "On Ethernet, an exit-interface-only route makes the router ARP for every destination, relying on proxy ARP; avoid it",
  "Fully specified route: `ip route 192.168.2.0 255.255.255.0 g0/0/1 172.16.2.2`",
  "IPv6 with a link-local next hop must be fully specified, `ipv6 route 2001:db8:acad:2::/64 g0/0/1 fe80::2`, because a link-local address is only meaningful on one link; IOS rejects the route without the interface",
  "A `question` on why a link-local next hop needs an exit interface",
  "Recall cards on when to use each form",
]

[[chapter.page]]
name = "05-default-static-routes"
title = "Default static routes"
summary = "One route that matches everything sends unknown traffic toward the internet or headquarters."
teaches = [
  "The IPv4 default route: `ip route 0.0.0.0 0.0.0.0 172.16.2.2` (quad zero)",
  "The IPv6 default route: `ipv6 route ::/0 2001:db8:acad:2::2`",
  "Used on stub routers and edge routers to the ISP",
  "In the table: `S* 0.0.0.0/0 [1/0] via 172.16.2.2` and `Gateway of last resort is 172.16.2.2 to network 0.0.0.0`",
  "A default route is used only when no more specific route matches",
  "`command` blocks for both defaults",
  "A `question` on which route is used for a destination that matches both a /24 and the default",
]

[[chapter.page]]
name = "06-floating-static-routes"
title = "Floating static routes"
summary = "A backup route waits out of the table with a higher administrative distance, and appears only when the main path fails."
teaches = [
  "A floating static route has an AD higher than the primary route, so it is not installed while the primary exists",
  "Example: primary `ip route 0.0.0.0 0.0.0.0 172.16.2.2` (AD 1) and backup `ip route 0.0.0.0 0.0.0.0 10.10.10.2 5`",
  "To back up a dynamic route, the AD must be higher than the protocol's, for example 115 over OSPF's 110",
  "IPv6: `ipv6 route ::/0 2001:db8:feed:10::2 5`",
  "Test by shutting the primary interface and watching the backup appear in `show ip route static`",
  "Misconception: the floating route does not appear in `show ip route` while the primary is up, but it is in the running configuration",
  "A `question` on the AD needed to back up an EIGRP route",
  "Recall cards: what makes a static route float",
]

[[chapter.page]]
name = "07-host-routes"
title = "Host routes"
summary = "A /32 or /128 route points at a single address, and the router creates some of these by itself."
