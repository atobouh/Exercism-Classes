[[chapter]]
number = 16
title = "Troubleshoot static and default routes"

[[chapter.page]]
name = "01-following-a-packet-through-static-routes"
title = "Following a packet through static routes"
summary = "Walk one packet hop by hop through routers that know the way only because someone told them."
teaches = [
  "Scene: PC1 on R1's LAN pings PC3 on R3's LAN across R2, with static and default routes configured",
  "At each router: look up the destination, use the static route, resolve the next hop by recursive lookup, ARP for the next hop's MAC, forward",
  "The reply needs its own path back: a route on every router toward PC1's network",
  "What happens if one router has no matching route and no default: the packet is dropped and an ICMP unreachable is returned",
  "A `diagram` of the three-router path",
  "A `question` on what happens when R2 has a route to PC3's LAN but not to PC1's",
]

[[chapter.page]]
name = "02-what-breaks-static-routes"
title = "What breaks static routes"
summary = "Static routes don't notice change, so links, typos and missing return paths all break them."
teaches = [
  "Network changes that break static routes: an interface or link going down, a new ISP next hop, a renumbered subnet",
  "A static route with an exit interface is removed when that interface goes down; a next-hop route is removed when the next hop no longer resolves",
  "Misconception: a static route can stay in the table while the far router is dead, for example across a switch where the local interface stays up, which black-holes traffic",
  "Common typos: wrong network address, wrong mask, wrong next hop, wrong AD on a floating route",
  "Missing return routes, which make one-way traffic look like a total failure",
  "A `table` of faults and the symptom each produces",
  "A `question` on why pings fail even though R1's route to R3's LAN looks right",
]

[[chapter.page]]
name = "03-the-troubleshooting-toolkit"
title = "The troubleshooting toolkit"
summary = "Five commands find almost every static routing fault."
teaches = [
  "`ping`, including extended ping from a chosen source interface (`ping 192.168.3.10 source g0/0/0`)",
  "`traceroute` and reading where it stops: the last answering hop and `* * *` lines",
  "`show ip route` and `show ip route 192.168.3.10` to see which route a destination uses",
  "`show ip interface brief` to check interface status",
  "`show cdp neighbors detail` to confirm the neighbor's real IP address on the link",
  "`show running-config | include ip route` to read the configured routes, including floating ones not in the table",
  "The IPv6 equivalents: `show ipv6 route`, `show ipv6 interface brief`, `ping` and `traceroute` with IPv6 addresses",
  "`command` blocks for an extended ping with a source and for filtering the running configuration",
]

[[chapter.page]]
name = "04-solving-a-connectivity-problem"
title = "Solving a connectivity problem"
summary = "A full walk-through: a ping fails, and five commands later the bad route is fixed."
teaches = [
  "The symptom: PC1 cannot reach PC3; PC1 can reach its gateway",
  "Ping and traceroute from R1 show the packet dies after R1",
  "`show ip route` on R1 shows the static route to 192.168.3.0/24 pointing at the wrong next hop",
  "`show cdp neighbors detail` confirms R2's real address",
  "The fix: `no ip route` for the bad entry, then the correct `ip route`",
  "Verify with ping and traceroute from PC1 and from R1",
  "A second short fault: the route is right but R3 lacks a route back to PC1's LAN",
  "A `question` asking which command reveals the wrong next hop",
]

[[chapter.page]]
name = "05-default-route-problems"
title = "Default route problems"
summary = "Default and floating routes fail in their own ways: a loop between two routers, or a backup that never takes over."
teaches = [
  "Two routers whose default routes point at each other: packets for unknown networks bounce until TTL expires, seen as repeating hops in traceroute and `TTL expired in transit` from Windows ping",
  "A missing default route on a stub router: internet traffic is dropped while internal traffic works",
  "A floating route with an AD lower than or equal to the primary, so it is installed too early or shares traffic",
  "A floating route that never appears because the primary route stays up while the far side is unreachable",
  "IPv6 default routes with a link-local next hop entered without an exit interface",
  "A `question` with a traceroute that alternates between two addresses",
  "Recall cards on the floating AD rule",
]

[[chapter.page]]
name = "06-check-yourself"
title = "Check yourself"
summary = "Find the fault in a set of routing tables, configurations and traceroutes."
teaches = [
