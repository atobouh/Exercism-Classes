teaches = [
  "The rule: of all matching routes, the one with the longest prefix (most leftmost matching bits) wins",
  "IPv4 example: destination 172.16.0.10 matches 172.16.0.0/12, 172.16.0.0/18 and 172.16.0.0/26; the /26 wins",
