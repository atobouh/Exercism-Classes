  "IPv6: `ipv6 route 2001:db8:acad:4::2/128 2001:db8:acad:2::2`",
  "A host route beats any shorter route to the same address by longest prefix match",
  "A fully specified IPv6 host route with a link-local next hop",
  "A `question` on why a host route is chosen over a /24",
  "Recall cards on /32 and /128",
]

[[chapter.page]]
name = "08-worked-scenario"
