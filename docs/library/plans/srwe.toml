  "A `question` on why adding a second router alone does not help the hosts",
]

[[chapter.page]]
name = "02-how-a-virtual-router-works"
title = "How a virtual router works"
summary = "Two routers answer for one virtual IP and MAC address, so hosts never notice which one is really forwarding."
teaches = [
  "The virtual router has a virtual IP address (the hosts' gateway) and a virtual MAC address",
  "One router forwards for the virtual router (active or master), another waits (standby or backup)",
  "Failover steps: the standby stops hearing hellos, takes over the virtual IP and MAC, and forwarding continues",
  "Hosts keep the same gateway and ARP entry, so nothing changes on the hosts",
  "Each router still has its own real interface address in the same subnet",
