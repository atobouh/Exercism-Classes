[[chapter.page]]
name = "05-layer-3-switch-svis"
title = "Routing on a Layer 3 switch"
summary = "A Layer 3 switch routes between VLANs in hardware, using one SVI per VLAN as the gateway."
teaches = [
  "An SVI per VLAN is the gateway: `interface vlan 10`, `ip address 192.168.10.1 255.255.255.0`, `no shutdown`",
  "`ip routing` in global configuration; without it a Layer 3 switch does not route between its SVIs",
