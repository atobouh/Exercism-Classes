]

[[chapter.page]]
name = "04-dhcpv6-message-flow"
title = "DHCPv6 message flow"
summary = "DHCPv6 has its own four messages, sent from link-local addresses to a well-known multicast group."
teaches = [
  "SOLICIT from the client's link-local address to ff02::1:2 (all DHCPv6 servers and relays)",
  "ADVERTISE from a server, then REQUEST (stateful) or INFORMATION-REQUEST (stateless), then REPLY",
