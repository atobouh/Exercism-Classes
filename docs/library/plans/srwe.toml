]

[[chapter.page]]
name = "03-slaac"
title = "SLAAC"
summary = "The host takes the prefix from the router advertisement and builds the rest of its address itself."
teaches = [
  "The prefix (usually /64) comes from the RA; the 64-bit interface ID is made by the host",
  "EUI-64: split the MAC in half, insert fffe, and flip the seventh bit; worked example 0050.7966.6800 becomes interface ID 0250:79ff:fe66:6800",
  "Random interface IDs and temporary addresses for privacy, as shown in Windows `ipconfig`",
  "Duplicate address detection: the host sends a neighbor solicitation to its own solicited-node multicast address and uses the address only if no one answers",
  "Router side for SLAAC only: an interface GUA, `ipv6 unicast-routing`, nothing else",
  "DNS with SLAAC only: hosts can learn DNS from the RA (RDNSS) where supported, otherwise they need stateless DHCPv6",
  "A `drill` of kind `ipv6`",
