  "A router as a stateless client: `ipv6 enable` and `ipv6 address autoconfig` on the interface",
  "Verify: `show ipv6 dhcp pool`, `show ipv6 interface` (`Hosts use stateless autoconfig for addresses` and `Hosts use DHCP to obtain other configuration`), `ipconfig /all` on a PC",
  "`command` blocks for `ipv6 nd other-config-flag`",
  "A `question` on what the O flag changes",
]

[[chapter.page]]
name = "06-stateful-dhcpv6"
title = "Stateful DHCPv6"
summary = "The DHCPv6 server hands out the address itself and remembers who has which one."
