[[chapter.page]]
name = "05-stateless-dhcpv6"
title = "Stateless DHCPv6"
summary = "Hosts build their own address with SLAAC and ask a DHCPv6 server only for extras such as DNS."
teaches = [
  "Server: `ipv6 dhcp pool IPV6-STATELESS`, `dns-server 2001:db8:acad:1::254`, `domain-name example.com`",
  "Interface: `ipv6 nd other-config-flag` and `ipv6 dhcp server IPV6-STATELESS`",
