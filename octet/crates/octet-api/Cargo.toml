[package]
name = "octet-api"
description = "The commands Octet's interface calls, shared by the desktop app and the dev server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
octet-sim = { path = "../octet-sim" }
octet-core = { path = "../octet-core" }
tiny_http = { version = "0.12", optional = true }
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"], optional = true }
ureq = { version = "2", optional = true }

[features]
# The reading voice, run natively (ONNX Runtime is built in).
voice = ["dep:ort", "dep:ureq"]
dev-server = ["dep:tiny_http", "voice"]

[[bin]]
name = "octet-dev"
required-features = ["dev-server"]

[dev-dependencies]
tempfile = "3"
