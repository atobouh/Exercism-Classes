[workspace]
resolver = "2"
members = ["crates/octet-sim", "crates/octet-core", "crates/octet-api", "app/src-tauri"]
default-members = ["crates/octet-sim", "crates/octet-core", "crates/octet-api"]

[workspace.package]
edition = "2021"
version = "0.3.1"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
