[workspace]
resolver = "2"
members = ["crates/octet-sim", "crates/octet-core"]
default-members = ["crates/octet-sim", "crates/octet-core"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
