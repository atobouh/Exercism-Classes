<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octet</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="lb" id="lb" tabindex="0" data-theme="light">
  <header class="titlebar" id="titlebar" data-tauri-drag-region>
    <div class="tb-brand" data-tauri-drag-region><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3" width="4" height="14" rx="1" fill="var(--cloth-itn)"/><rect x="8" y="3" width="4" height="14" rx="1" fill="var(--cloth-srwe)"/><rect x="13.6" y="3.4" width="4" height="14" rx="1" transform="rotate(8 15.6 10.4)" fill="var(--cloth-ensa)"/></svg><b data-tauri-drag-region>Octet</b><button type="button" class="tb-side" id="tbSide" aria-label="Sidebar" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6.2 3v10"/></svg></button></div>
    <div class="tb-where" id="tbWhere" data-tauri-drag-region></div>
    <div class="tb-ctl" id="tbCtl" hidden>
      <button type="button" data-win="min" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5.5h8"/></svg></button>
      <button type="button" data-win="max" aria-label="Maximize" title="Maximize"><svg viewBox="0 0 10 10" aria-hidden="true" class="i-max"><rect x="1.5" y="1.5" width="7" height="7" rx="1"/></svg><svg viewBox="0 0 10 10" aria-hidden="true" class="i-restore"><rect x="1.5" y="3" width="5.5" height="5.5" rx="1"/><path d="M3.5 3V2.2c0-.4.3-.7.7-.7h3.6c.4 0 .7.3.7.7v3.6c0 .4-.3.7-.7.7H7"/></svg></button>
      <button type="button" data-win="close" class="close" aria-label="Close" title="Close"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
    </div>
  </header>
  <aside class="side">
    <nav aria-label="Main" id="nav">
      <button class="si" type="button" data-go="library"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5v11M6 2.5v11M9.5 3.2l3.6 10.3"/></svg>Library</button>
      <button class="si" type="button" data-go="reading"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h6l2.5 2.5v8.5H4z"/><path d="M6.5 7.5h4M6.5 10h3"/></svg>Reading now</button>
      <button class="si" type="button" data-go="review"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.6M3 2.8v2.4h2.4"/></svg>Review<span class="n" id="dueN"></span></button>
      <span class="grp">Books</span>
      <div id="navBooks"></div>
      <span class="grp">Collections</span>
      <div id="navCols"></div>
    </nav>
    <div class="side-foot">
      <button class="si" type="button" data-go="settings"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/></svg>Settings</button>
      <div class="theme" role="group" aria-label="Theme"><button type="button" data-th="light" aria-pressed="true">Light</button><button type="button" data-th="dark" aria-pressed="false">Dark</button></div>
      <span>Stored on this computer</span>
    </div>
  </aside>

  <div class="main">
    <section class="view library" data-view="library"><div class="lib-in" id="libIn"></div></section>
    <section class="view book-view" data-view="book"><div class="book-in" id="bookIn"></div></section>
    <section class="view notes-v" data-view="reading">
      <div class="list"><div class="list-head"><h2 id="chTitle"></h2><span id="chSub"></span></div><div class="items" id="items"></div></div>
      <div class="ed">
        <div class="ed-bar">
          <button class="tool" type="button" id="listBtn" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg>Pages</button>
          <div class="ed-tools"><button class="tool" type="button" id="focusBtn" aria-pressed="false">Focus <span class="k">Ctrl .</span></button></div>
        </div>
        <div class="ed-scroll" id="edScroll"><article class="doc" id="doc"></article></div>
        <div class="selbar" id="selbar" role="toolbar" aria-label="Selection"><button type="button" data-act="mark">Highlight</button><button type="button" data-act="note">Add a note</button><button type="button" data-act="collect">Collect</button></div>
        <div class="collect-menu" id="colMenu" hidden></div>
      </div>
    </section>
    <section class="view collection" data-view="collection"><div class="col-in"><div class="lib-head"><h1 id="colTitle"></h1><p id="colSub"></p></div><div class="blocks" id="colBlocks"></div></div></section>
    <section class="view settings" data-view="settings"><div class="set-in" id="setIn"></div></section>
    <section class="view review" data-view="review"><div class="card" id="card"></div></section>
    <div class="toast hide" id="toast" role="status"></div>
  </div>

  <div class="labw" id="labw" role="region" aria-label="Lab">
    <octet-bench id="bench" back="Back to reading" layout="docked"></octet-bench>
  </div>
</div>
<script src="figures.js"></script>
<script src="blocks.js"></script>
<script type="module" src="bench/index.js"></script>
<script src="app.js"></script>
</body>
</html>
