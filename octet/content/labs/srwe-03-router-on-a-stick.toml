# A bench lab: devices from the bench catalog, cables between them, and
# tasks with checks. See app/ui/bench/README.md for the format.
format = 1
id = "srwe-03-router-on-a-stick"
title = "Router-on-a-stick"
summary = "Sales and Engineering share one switch and one router port. Engineering can't reach Sales. Find out why and fix it."
booted = true

[[device]]
id = "R1"
model = "ISR4321"
x = -280
y = -230
config = """
interface g0/0/1
 no shutdown
interface g0/0/1.10
 encapsulation dot1q 10
 ip address 192.168.10.1 255.255.255.0
interface g0/0/1.20
 encapsulation dot1q 30
 ip address 192.168.20.1 255.255.255.0
"""

[[device]]
id = "S1"
model = "WS-C2960+24TC-L"
x = -360
y = -20
config = """
vlan 10
 name SALES
vlan 20
 name ENG
interface fa0/5
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
interface fa0/6
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
interface g0/1
 switchport mode trunk
"""

[[device]]
id = "PC-SALES"
model = "PC"
x = -330
y = 200
ip = "192.168.10.10"
mask = "255.255.255.0"
gateway = "192.168.10.1"

[[device]]
id = "PC-ENG"
model = "PC"
x = 140
y = 200
ip = "192.168.20.10"
mask = "255.255.255.0"
gateway = "192.168.20.1"

[[device]]
id = "LAPTOP"
model = "PC"
x = 420
y = -230

[[cable]]
type = "straight"
a = "R1 G0/0/1"
b = "S1 G0/1"

[[cable]]
type = "straight"
a = "PC-SALES NIC"
b = "S1 F0/5"

[[cable]]
type = "straight"
a = "PC-ENG NIC"
b = "S1 F0/6"

[[task]]
text = "From PC-ENG, `ping 192.168.10.10`. It fails. That's the problem you're here to fix."
hint = "Double-click PC-ENG to open its command prompt."
check = { tried = { from = "PC-ENG", to = "192.168.10.10" } }

[[task]]
text = "Plug a console cable from the LAPTOP's COM1 into R1's CONSOLE port, and open R1."
check = { console = "R1" }

[[task]]
text = "Find the subinterface whose VLAN tag doesn't match the switch, and fix it."
hint = "`show running-config` on R1, then compare each `encapsulation dot1Q` with the VLANs on S1 (`show vlan brief`)."
check = { reach = { from = "PC-ENG", to = "192.168.10.10" } }
